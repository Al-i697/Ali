/* Layout: a small deck of 1280x720 lesson slides. A slide is either a full-bleed illustration with labels that appear click by click, or an illustration beside ribbon cards. Scaled to fit; turned on its side on a portrait phone. */
:root{--page:#dbe7f1;--ink:#0a1f3d;color-scheme:light}

:root[data-theme="dark"]{--page:#050d1c;--ink:#e8f1fb;color-scheme:dark}
html,body{height:100%}
body{margin:0;box-sizing:border-box;background:var(--page);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,"DejaVu Sans",sans-serif;display:grid;place-items:center;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:manipulation}
#box{position:relative;flex:none}
#st{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;direction:rtl;overflow:hidden;border-radius:18px;background:#06142e;user-select:none;-webkit-user-select:none;color:#fff;font-weight:600}
.sl{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.sl.cur{opacity:1;pointer-events:auto}
.sl>img.bg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
[data-s]{opacity:0;transition:opacity .6s ease,transform .6s ease;pointer-events:none}
[data-s].on{opacity:1}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes glow{0%,100%{opacity:.18}50%{opacity:.4}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.march{animation:march 1.4s linear infinite}

/* labels */
.ttl{position:absolute;left:36px;top:22px;font-size:30px;font-weight:800;line-height:1.3;background:rgba(5,19,44,.78);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 20px 8px;z-index:3}
.chip{position:absolute;box-sizing:border-box;padding:8px 14px 10px;border-radius:14px;background:rgba(5,19,44,.9);border:1px solid rgba(255,255,255,.2);font-size:21px;line-height:1.35;font-weight:800;transform:translateX(20px);z-index:3}
.chip.on{transform:none}
.chip small{display:block;font-weight:600;font-size:16px;line-height:1.4;color:#c6e6f6;margin-top:1px}
.chip.one{padding:7px 14px 8px}
.chip.hot{background:#ffd66b;color:#2a1c00;border-color:#fff}
.col{position:absolute;display:flex;flex-direction:column;gap:7px;z-index:3}
.col .chip{position:relative}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;color:#7fe6f5;font-weight:700;font-size:17px;margin-inline-start:5px}
.mk{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:8px;vertical-align:1px}
.ld{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;z-index:2}

/* illustration beside cards */
.side .artw{position:absolute;left:36px;top:112px;width:487px;height:533px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.45)}
.side .artw img{width:100%;height:100%;object-fit:cover;display:block}

.stats{display:flex;gap:8px}

.ex{margin-top:6px;font-size:18.5px}

/* lead-in question */
.lead{position:absolute;left:250px;top:150px;width:780px;box-sizing:border-box;padding:24px 30px 22px;border-radius:24px;background:rgba(10,24,54,.94);border:1.5px solid rgba(255,255,255,.22);transition:opacity .6s,transform .6s;z-index:6}
.lead.gone{opacity:0;transform:scale(.96);pointer-events:none}
.lead .tag{display:inline-block;font-size:17px;font-weight:800;color:#2a1c00;background:#ffd66b;border-radius:999px;padding:2px 14px}
.lead .q{font-size:31px;font-weight:800;line-height:1.4;margin:10px 0 14px}
.lead .o{display:block;width:100%;text-align:right;font:inherit;font-size:24px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer}
.lead .o:hover{background:rgba(255,255,255,.18)}
.lead .o.ok{background:#1f8f5a;border-color:#6fe0a3}
.lead .o.bad{background:#a8463a;border-color:#ff9c8a}
.lead .fb{min-height:36px;font-size:22px;font-weight:700;line-height:1.4;color:#d6ecf7}
.lead .fb.ok{color:#8ff0bd}.lead .fb.bad{color:#ffb4a6}

/* deck controls */
#bar{position:absolute;left:36px;top:78px;display:flex;align-items:center;gap:10px;z-index:9}
.side~#bar{top:22px}
#bar button{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:12px;height:42px;padding:0 16px;cursor:pointer;white-space:nowrap}
#pv{background:rgba(5,19,44,.78);color:#fff}
#nx{background:#ffd66b;color:#2a1c00}
#nb{background:rgba(5,19,44,.7);color:#d3e6f5;border:2px solid rgba(255,255,255,.3)!important;font-size:15px!important;padding:0 12px!important}
#cnt{font-size:16px;font-weight:700;background:rgba(5,19,44,.7);border-radius:999px;padding:4px 12px;color:#d3e6f5;direction:ltr}
#bar button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#note{position:absolute;left:36px;top:130px;width:760px;box-sizing:border-box;padding:16px 22px;border-radius:18px;background:rgba(8,12,30,.97);border:1px solid rgba(255,255,255,.25);font-size:18px;line-height:1.55;font-weight:600;display:none;z-index:10}
#note.open{display:block}
#note b{color:#ffd66b}
#note ul{margin:6px 0 0;padding-inline-start:20px}
</style>

 chips:[

  {s:3,x:372,y:390,w:312,h:mk('#8ef27c')+'الأخضر ينعكس بعيداً',tx:1130,ty:230,c:'#8ef27c'},

/* ---------- build the slides ---------- */
var host=$('#slides'),LD=[];
SL.forEach(function(s,i){
 var d=document.createElement('div');d.className='sl '+(s.k==='side'?'side':'scene');
 var h='';
 if(s.k==='scene'){
  h+='<img class="bg" alt="" src="'+IMG[s.img]+'"><svg class="ld" viewBox="0 0 1280 720"></svg><div class="ttl" style="'+(s.tl?'left:'+s.tl.x+'px;top:'+s.tl.y+'px':'')+'">'+s.title+'</div>';
  if(s.col)h+='<div class="col" style="left:'+s.col.x+'px;top:'+s.col.y+'px;width:'+s.col.w+'px"></div>';
  s.n=s.n||s.caps.length-1;
  h+='<div class="cap" style="opacity:0"></div>';
 }else{
  h+='<div class="t2"><h1>'+s.h1+'</h1><p>'+s.sub+'</p></div><div class="artw"><img alt="" src="'+IMG[s.img]+'"></div><div class="cards"></div><div class="endbar" data-s="5">'+s.end+'</div>';
 }
 if(s.lead){h+='<div class="lead"><span class="tag">اكتشف</span><div class="q">'+s.lead.q+'</div>'+s.lead.o.map(function(o){return '<button type="button" class="o" data-ok="'+o[1]+'" data-w="'+o[2]+'">'+o[0]+'</button>'}).join('')+'<div class="fb">اختر إجابتك.</div></div>'}
 d.innerHTML=h;host.appendChild(d);s.el=d;s.step=0;
 if(s.k==='scene'){
  var colEl=$('.col',d);
  (s.chips||[]).forEach(function(c){
   var e=document.createElement('div');e.className='chip'+(c.one?' one':'')+(c.hot?' hot':'');e.setAttribute('data-s',c.s);e.innerHTML=c.h;
   if(c.x!=null){e.style.left=c.x+'px';e.style.top=c.y+'px';if(c.w)e.style.width=c.w+'px';d.appendChild(e)}else if(colEl){colEl.appendChild(e)}
   c.el=e;
  });
  var svg=$('.ld',d),g='';
  (s.hl||[]).forEach(function(l){g+='<g data-s="'+l.s+'" data-e="'+l.e+'"><ellipse cx="'+l.cx+'" cy="'+l.cy+'" rx="'+l.rx+'" ry="'+l.ry+'" fill="#ffd66b" style="animation:glow 2.6s ease-in-out infinite"/><ellipse cx="'+l.cx+'" cy="'+l.cy+'" rx="'+l.rx+'" ry="'+l.ry+'" fill="none" stroke="#ffe27a" stroke-width="3.5" stroke-dasharray="12 10" class="march"/></g>'});
  svg.innerHTML=g;
  (s.hl||[]).forEach(function(l){var e=document.createElement('div');e.className='chip hot one';e.setAttribute('data-s',l.s);e.setAttribute('data-e',l.e);e.style.left=l.lx+'px';e.style.top=(l.ly-20)+'px';e.textContent=l.label;d.appendChild(e)});
 }else{
  var cw=$('.cards',d);
  s.cards.forEach(function(c){var e=document.createElement('div');e.className='c';e.setAttribute('data-s',c.s);e.innerHTML='<div class="h '+c.c+'">'+c.ic+c.h+'</div><div class="b">'+c.b+'</div>';cw.appendChild(e)});
 }
 if(s.lead){$$('.lead .o',d).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var ok=b.dataset.ok==='1',f=$('.lead .fb',d);b.classList.add(ok?'ok':'bad');f.textContent=b.dataset.w;f.className='fb '+(ok?'ok':'bad')}})}
});

/* leader lines, placed from the real label positions */
function pos(el){var x=0,y=0,w=el.offsetWidth,h=el.offsetHeight;while(el&&el!==st){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent}return{x:x,y:y,w:w,h:h}}
function leaders(){
 SL.forEach(function(s){
  if(s.k!=='scene')return;
  var svg=$('.ld',s.el),keep=svg.innerHTML.split('<!--L-->')[0],g='';
  s.el.style.visibility='hidden';s.el.style.opacity=1;s.el.classList.add('cur');
  (s.chips||[]).forEach(function(c){
   if(c.tx==null)return;var p=pos(c.el),cx=p.x+p.w/2,cy=p.y+p.h/2,dx=c.tx-cx,dy=c.ty-cy,t=Math.min((p.w/2)/(Math.abs(dx)||1e-9),(p.h/2)/(Math.abs(dy)||1e-9));
   var sx=cx+dx*t,sy=cy+dy*t;
   g+='<g data-s="'+c.s+'"><line x1="'+sx.toFixed(0)+'" y1="'+sy.toFixed(0)+'" x2="'+c.tx+'" y2="'+c.ty+'" stroke="rgba(255,255,255,.85)" stroke-width="2.2"/><circle cx="'+c.tx+'" cy="'+c.ty+'" r="6" fill="'+c.c+'" stroke="#fff" stroke-width="2"/></g>'});
  svg.innerHTML=keep+'<!--L-->'+g;
  s.el.classList.remove('cur');s.el.style.visibility='';s.el.style.opacity='';
 });
}

/* ---------- navigation ---------- */
var cur=0;
function show(){
 SL.forEach(function(s,i){s.el.classList.toggle('cur',i===cur)});
 var s=SL[cur];
 $$('[data-s]',s.el).forEach(function(e){var a=+e.getAttribute('data-s'),b=e.getAttribute('data-e');e.classList.toggle('on',s.step>=a&&(b==null||s.step<=+b))});
 var lead=$('.lead',s.el);if(lead)lead.classList.toggle('gone',s.step>0);
 if(s.k==='scene'){var cp=$('.cap',s.el);var t=s.caps[Math.min(s.step,s.caps.length-1)];cp.style.opacity=s.step?1:0;if(cp.dataset.t!==t){cp.dataset.t=t;cp.textContent=t}}
 $('#pv').disabled=cur===0&&s.step===0;
 $('#nx').textContent=(cur===0&&s.step===0)?'ابدأ الشرح':(cur===SL.length-1&&s.step===s.n)?'من البداية':'التالي';
 $('#cnt').textContent=(cur+1)+' / '+SL.length;
 $('#note').innerHTML='<b>ملاحظة المعلم</b><ul>'+s.note.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul>';
 var bar=$('#bar');bar.style.top=(s.k==='side'?22:(s.bl?s.bl.y:78))+'px';bar.style.left=(s.bl?s.bl.x:36)+'px';
}
function next(){var s=SL[cur];if(s.step<s.n){s.step++}else if(cur<SL.length-1){cur++;SL[cur].step=0}else{cur=0;SL.forEach(function(x){x.step=0})}show()}
function prev(){var s=SL[cur];if(s.step>0){s.step--}else if(cur>0){cur--;SL[cur].step=SL[cur].n}show()}
$('#nx').onclick=function(e){e.stopPropagation();next()};
$('#pv').onclick=function(e){e.stopPropagation();prev()};
$('#nb').onclick=function(e){e.stopPropagation();$('#note').classList.toggle('open')};
$('#note').onclick=function(e){e.stopPropagation();this.classList.remove('open')};
st.addEventListener('click',function(e){if(e.target.closest('button,#note,.lead'))return;next()});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key===' '||(e.key==='Enter'&&e.target.tagName!=='BUTTON')){e.preventDefault();next()}else if(e.key==='ArrowRight'){prev()}});

function fit(){
 var cs=getComputedStyle(document.body),aw=document.body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=document.body.clientHeight,port=ah>aw*1.1,s;
 if(port){s=Math.min(ah/1280,aw/720);box.style.width=(720*s)+'px';box.style.height=(1280*s)+'px';st.style.transform='translate('+(720*s)+'px,0) rotate(90deg) scale('+s+')'}
 else{s=Math.min(aw/1280,ah/720);box.style.width=(1280*s)+'px';box.style.height=(720*s)+'px';st.style.transform='scale('+s+')'}
}
addEventListener('resize',fit);fit();leaders();show();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){leaders();show()});
var m=location.hash.match(/^#(\d)-(\d)$/);if(m){cur=Math.min(+m[1],SL.length-1);SL[cur].step=Math.min(+m[2],SL[cur].n);show()}
})();
</script>
