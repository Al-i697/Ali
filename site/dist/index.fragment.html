<title>منصة الدروس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Lesson 3-1 player. The stage is a fixed 1280x720 sheet scaled to fit the screen,
   so every slide reads the same on a PC and on the classroom whiteboard. */
:root{
  --font-display:"Cairo","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal","Cairo",system-ui,sans-serif;
  --font-math:"STIX Two Text","Cambria Math",Georgia,serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --accent:#E4BC4B; --accent-ink:#171100; --accent-soft:rgba(228,188,75,.2); --gold:#E4BC4B;
  --ink:#f4fbf8; --field-ink:#f4fbf8; --c-bar-ink:#f4fbf8;
  --ok:#A6F28A; --ok-bg:rgba(166,242,138,.16); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.14);
  --radius:16px;
  color-scheme:dark; direction:rtl;
}

/* ===== colour palettes: one set of tokens per palette, picked per slide with data-pal ===== */
:root,[data-pal="emerald"]{--t1:69,224,180; --t2:150,236,208; --d1:2,24,18; --d2:4,36,29; --p1:9,74,58; --p2:4,46,37; --cyan:#45e0b4; --muted:#bfded4; --ground:#04231d; --field:#0f5a49;
  --c-bg:#02130f; --c-bar:#04201a; --c-bar-2:#0c3d33; --c-muted:#8fd0bc; --f1:#0e6a55; --f2:#0a5240; --f3:#07382d; --f4:#03201a}
[data-pal="navy"]{--t1:96,190,255; --t2:160,205,255; --d1:2,10,28; --d2:4,18,44; --p1:12,52,108; --p2:6,30,70; --cyan:#5fbfff; --muted:#bed2ee; --ground:#061a3a; --field:#124a8c;
  --c-bg:#020a1c; --c-bar:#04132e; --c-bar-2:#0c2d5c; --c-muted:#8fb0e0; --f1:#12509a; --f2:#0c3a78; --f3:#08285a; --f4:#051a40}
[data-pal="ember"]{--t1:255,150,60; --t2:255,205,160; --d1:14,6,2; --d2:28,12,4; --p1:82,38,10; --p2:46,20,6; --cyan:#ff9a45; --muted:#ead4bf; --ground:#1a0c04; --field:#7a3510; --bad:#FF6464; --bad-bg:rgba(255,100,100,.16);
  --c-bg:#0c0502; --c-bar:#1a0b04; --c-bar-2:#3d1c0a; --c-muted:#d0a888; --f1:#7a3510; --f2:#5c2808; --f3:#3a1808; --f4:#1f0d04}
[data-pal="gold"]{--t1:236,236,244; --t2:225,225,235; --d1:4,5,8; --d2:12,13,18; --p1:34,35,42; --p2:16,17,22; --cyan:#e9e9f2; --muted:#d0d2d9; --ground:#0b0c10; --field:#2b2d34;
  --c-bg:#040508; --c-bar:#0b0c10; --c-bar-2:#22242b; --c-muted:#a5a8b2; --f1:#2a2b33; --f2:#1d1e25; --f3:#121318; --f4:#08090c}
[data-pal="violet"]{--t1:190,150,255; --t2:215,190,255; --d1:10,4,24; --d2:20,9,44; --p1:52,28,108; --p2:28,14,64; --cyan:#bf9cff; --muted:#d2c6ec; --ground:#170a2e; --field:#3f2290;
  --c-bg:#07030f; --c-bar:#120828; --c-bar-2:#2c1666; --c-muted:#b49cdc; --f1:#4a2a9a; --f2:#36207a; --f3:#241254; --f4:#14082e}
/* derived tokens are declared where the palette is, so every slide resolves them with its own colours */
:root,[data-pal]{--paper:rgba(var(--t2),.09); --surface:rgba(var(--t2),.17); --panel-line:rgba(var(--t2),.42); --line:rgba(var(--t2),.38); --blue:var(--cyan)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--c-bg); color:var(--ink); font-family:var(--font-body); overflow:hidden; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:8px}
.num{direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; display:inline-block}
sub,sup{line-height:0}

/* ===== app frame ===== */
.app{position:fixed; inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0; display:grid; grid-template-rows:60px 1fr 68px}
.top,.bot{background:var(--c-bar); color:var(--c-bar-ink); display:flex; align-items:center; gap:16px; padding:0 20px}
.brand{display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:800; font-size:22px; white-space:nowrap}
.brand i{font-style:normal; width:38px; height:42px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:21px; position:relative}
.brand i small{position:absolute; top:3px; inset-inline-start:5px; font:700 9px var(--font-body)}
.brand span em{font-style:normal; opacity:.8; font-weight:600; font-size:17px; margin-inline-start:8px}
.prog{flex:1; display:flex; gap:3px; align-items:center; height:100%; padding:0 6px}
.prog .seg{flex:1; height:12px; border:0; padding:0; border-radius:4px; background:var(--c-bar-2); position:relative; transition:background-color 180ms var(--ease-out), transform 180ms var(--ease-out)}
.prog .seg.gap{margin-inline-start:9px}
.prog .seg.done{background:var(--c-muted)}
.prog .seg.cur{background:var(--accent); transform:scaleY(1.5)}
.prog .seg.act::after{content:""; position:absolute; top:-7px; inset-inline-start:50%; width:6px; height:6px; margin-inline-start:-3px; border-radius:50%; background:var(--accent)}
.prog .seg:hover{background:#fff}
.tbtn{min-width:48px; height:44px; padding:0 14px; border-radius:12px; border:0; background:var(--c-bar-2); color:var(--c-bar-ink); font-weight:700; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform 160ms var(--ease-out), background-color 160ms var(--ease-out)}
.tbtn:hover{background:#0f8f6f}
.tbtn:active{transform:scale(.96)}
.tbtn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.bot{justify-content:space-between}
.nav{height:50px; min-width:150px; padding:0 22px; border:0; border-radius:14px; font-family:var(--font-display); font-weight:800; font-size:21px; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:transform 160ms var(--ease-out), opacity 160ms var(--ease-out), background-color 160ms var(--ease-out)}
.nav svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.nav.next{background:var(--accent); color:var(--accent-ink)}
.nav.prev{background:var(--c-bar-2); color:var(--c-bar-ink)}
.nav:active{transform:scale(.97)}
.nav[disabled]{opacity:.35; pointer-events:none}
.where{flex:1; text-align:center; font-size:18px; display:flex; flex-direction:column; line-height:1.25; min-width:0}
.where b{font-family:var(--font-display); font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.where small{opacity:.8; font-size:15px}

.view{position:relative; overflow:hidden}
.rot{display:none; position:absolute; inset-inline:12px; bottom:10px; z-index:80; background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:8px 14px; font-weight:800; font-size:15px; text-align:center; pointer-events:none}
@media (max-width:700px) and (orientation:portrait){.rot{display:block}}
.stage{position:absolute; left:50%; top:50%; width:1280px; height:720px; transform:translate(-50%,-50%) scale(var(--s,1)); transform-origin:center; background:var(--ground); color:var(--ink); border-radius:6px; overflow:hidden; transition:background-color 240ms var(--ease-out)}

/* ===== slides ===== */
.slide{position:absolute; inset:0; padding:34px 56px 30px; display:flex; flex-direction:column; opacity:0; pointer-events:none; transform:translateX(-26px)}
.slide.on{opacity:1; pointer-events:auto; transform:none; transition:opacity 220ms var(--ease-out), transform 260ms var(--ease-out)}
.slide.off{opacity:0; transform:translateX(22px); transition:opacity 140ms var(--ease-out), transform 160ms var(--ease-out)}
.slide.back{transform:translateX(26px)}
.slide.back.off{transform:translateX(-22px)}
.hd{display:flex; align-items:center; gap:18px; margin-bottom:18px; min-height:64px}
.hd .chip{flex:none; height:34px; padding:0 14px; border-radius:999px; background:var(--field); color:var(--field-ink); font-weight:700; font-size:16px; display:inline-flex; align-items:center}
.hd h2{margin:0; font-family:var(--font-display); font-weight:800; font-size:42px; line-height:1.15; flex:1; text-wrap:balance}
.hd .tag{flex:none; display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 16px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:17px}
.hd .tag svg{width:18px; height:18px; fill:currentColor}
.body{flex:1; min-height:0; display:flex; gap:28px; position:relative}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.body>.col{justify-content:center}
.grow{flex:1}
p{margin:0}
.lead{font-size:30px; line-height:1.55; text-wrap:pretty}
.big{font-size:34px; line-height:1.5}
.sm{font-size:22px; line-height:1.5}
.muted{color:var(--muted)}
.panel{background:var(--paper); border-radius:var(--radius); padding:22px 26px}
.panel.flat{background:var(--surface)}
.panel.dark{background:var(--field); color:var(--field-ink)}
.k{background:var(--accent-soft); border-radius:8px; padding:0 8px; font-weight:700}
.eq{font-family:var(--font-display); font-weight:800; direction:ltr; unicode-bidi:isolate; display:inline-block}

.btn{min-height:56px; padding:0 26px; border:0; border-radius:16px; background:var(--field); color:var(--field-ink); font-family:var(--font-display); font-weight:800; font-size:23px; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:transform 160ms var(--ease-out), background-color 160ms var(--ease-out), opacity 160ms var(--ease-out)}
.btn:hover{background:#0a7a5e}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--accent); color:var(--accent-ink)}
.btn.acc:hover{background:#FFA23C}
.btn.ghost{background:transparent; color:var(--field); box-shadow:inset 0 0 0 3px var(--field)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{min-height:44px; padding:0 18px; font-size:19px; border-radius:12px}
.btn[disabled]{opacity:.4; pointer-events:none}

/* feedback states */
.fb{min-height:34px; font-size:23px; font-weight:700; line-height:1.4}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.ok-b{background:var(--ok-bg)!important; box-shadow:inset 0 0 0 3px var(--ok)!important}
.bad-b{background:var(--bad-bg)!important; box-shadow:inset 0 0 0 3px var(--bad)!important}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake 320ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop 260ms var(--ease-out) both}
@keyframes up{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.up{animation:up 320ms var(--ease-out) both}
.hide{display:none!important}

/* options (mcq) */
.opts{display:flex; flex-direction:column; gap:12px}
.opt{display:flex; align-items:center; gap:16px; width:100%; min-height:64px; padding:10px 20px; border:0; border-radius:16px; background:var(--paper); text-align:start; font-size:26px; font-weight:500; box-shadow:inset 0 0 0 3px var(--line); transition:transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out), background-color 160ms var(--ease-out)}
.opt:hover{box-shadow:inset 0 0 0 3px var(--field)}
.opt:active{transform:scale(.98)}
.opt .ix{flex:none; width:40px; height:40px; border-radius:10px; background:var(--surface); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:22px}
.opt.locked{pointer-events:none}

/* number input */
.nin{display:inline-flex; align-items:center; gap:10px}
.nin input{width:150px; height:60px; border:0; border-radius:14px; background:var(--paper); box-shadow:inset 0 0 0 3px var(--line); font:800 30px var(--font-display); text-align:center; direction:ltr; color:var(--ink); transition:box-shadow 160ms var(--ease-out), background-color 160ms var(--ease-out)}
.nin input:focus{outline:none; box-shadow:inset 0 0 0 4px var(--accent)}
.nin input.ok-b,.nin input.bad-b{}
.nin .u{font-size:22px; font-weight:700; color:var(--muted)}
.nin .go{height:60px; min-width:60px; padding:0 16px; border:0; border-radius:14px; background:var(--field); color:var(--field-ink); font-weight:800; font-size:22px; transition:transform 160ms var(--ease-out)}
.nin .go:active{transform:scale(.95)}
.nin.sm input{width:110px; height:50px; font-size:25px}
.nin.sm .go{height:50px; min-width:50px; font-size:19px}

/* poll */
.poll{display:flex; flex-direction:column; gap:12px}
.pr{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; background:var(--paper); border-radius:16px; padding:10px 14px 10px 18px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 3px var(--line)}
.pr .bar{position:absolute; inset-block:0; inset-inline-start:0; width:0; background:var(--accent-soft); transition:width 420ms var(--ease-out); z-index:0}
.pr .t{position:relative; z-index:1; font-size:25px; font-weight:500; line-height:1.4; display:flex; align-items:center; gap:14px}
.pr .t .ix{flex:none; width:38px; height:38px; border-radius:10px; background:var(--surface); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:21px}
.pr .cnt{position:relative; z-index:1; display:flex; align-items:center; gap:8px}
.pr .cnt b{min-width:50px; text-align:center; font-family:var(--font-display); font-size:32px}
.pr .cnt button{width:48px; height:48px; border:0; border-radius:12px; background:var(--surface); font:800 28px var(--font-display); transition:transform 140ms var(--ease-out)}
.pr .cnt button:active{transform:scale(.92)}
.pr.right{box-shadow:inset 0 0 0 4px var(--ok); background:var(--ok-bg)}
.pr.right .bar{background:#b8e6cb}
.pr.dim{opacity:.55}

/* drag */
.chip{touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; position:relative; z-index:5}
.chip.drag{cursor:grabbing; z-index:50; transition:none!important}
.chip.back{transition:transform 260ms var(--ease-out)}
.slot{transition:background-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out)}
.slot.hot{background:var(--accent-soft)!important; box-shadow:inset 0 0 0 4px var(--accent)!important}

/* teacher note drawer */
.note{position:absolute; inset-inline-end:0; top:0; bottom:0; width:340px; background:var(--field); color:var(--field-ink); padding:84px 24px 24px; z-index:90; transform:translateX(-102%); transition:transform 260ms var(--ease-out); font-size:21px; line-height:1.6; overflow:auto}
.note.open{transform:none}
.note h4{margin:0 0 10px; font-family:var(--font-display); font-size:24px; color:var(--accent)}
.note ul{margin:0; padding-inline-start:22px}
.note li{margin-bottom:8px}
.note b{color:#fff}

/* index drawer */
.idx{position:absolute; inset:0; z-index:95; background:rgba(6,42,49,.72); display:none; align-items:center; justify-content:center; padding:40px}
.idx.open{display:flex}
.idx .sheet{background:var(--paper); border-radius:24px; padding:26px 30px; width:min(980px,100%); max-height:100%; overflow:auto; display:grid; grid-template-columns:repeat(2,1fr); gap:6px 26px}
.idx h3{grid-column:1/-1; margin:0 0 6px; font-family:var(--font-display); font-size:30px}
.idx .grp{grid-column:1/-1; font-weight:800; color:var(--muted); font-size:17px; margin-top:10px}
.idx button.it{display:flex; align-items:center; gap:12px; min-height:46px; border:0; background:transparent; border-radius:10px; text-align:start; font-size:22px; padding:0 10px; transition:background-color 140ms var(--ease-out)}
.idx button.it:hover{background:var(--surface)}
.idx button.it i{font-style:normal; width:34px; height:34px; border-radius:9px; background:var(--surface); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:17px; flex:none}
.idx button.it.cur i{background:var(--accent)}

/* ===== cover ===== */
.cover{padding:0}
.cover .band{flex:1; background:var(--field); color:var(--field-ink); position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 80px; padding-inline-end:420px; overflow:hidden}
.cover h1{margin:0; font-family:var(--font-display); font-weight:800; font-size:112px; line-height:1.05}
.cover .sub{font-size:30px; margin-top:16px; opacity:.92; max-width:760px; line-height:1.5}
.cover .meta{display:flex; gap:12px; margin-top:34px}
.cover .meta span{height:46px; padding:0 20px; border-radius:999px; background:rgba(255,255,255,.14); display:inline-flex; align-items:center; font-weight:700; font-size:22px}
.cover .foot{height:140px; background:var(--ground); display:flex; align-items:center; justify-content:space-between; padding:0 80px; position:relative}
.cover .foot p{font-size:26px; color:var(--muted)}
.cover .tile{position:absolute; inset-inline-end:70px; top:50%; width:280px; height:300px; margin-top:-150px; border-radius:30px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:170px; transform:rotate(-4deg)}
.cover .tile small{position:absolute; top:18px; inset-inline-start:24px; font:800 30px var(--font-body)}
.cover .tile em{position:absolute; bottom:18px; font-style:normal; font:700 30px var(--font-body)}
.cover .doodle{position:absolute; inset:0; opacity:.1; pointer-events:none}

/* goals */
.goal{display:flex; gap:20px; align-items:flex-start; background:var(--paper); border-radius:22px; padding:20px 26px}
.goal .gn{flex:none; width:60px; height:66px; border-radius:12px; background:var(--accent); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:34px}
.goal h3{margin:0 0 4px; font-family:var(--font-display); font-size:30px}
.goal p{font-size:23px; line-height:1.55; color:var(--muted)}
.goal.on{background:var(--field); color:var(--field-ink)}
.goal.on p{color:var(--field-ink); opacity:.92}

/* npk */
.bag{width:300px; flex:none; align-self:center}
.chips{display:flex; gap:12px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; min-height:50px; padding:0 20px; border-radius:14px; background:var(--paper); box-shadow:inset 0 0 0 3px var(--line); font-size:24px; font-weight:700}

/* match */
.mrow{display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:stretch}
.mfield{display:flex; align-items:center; gap:16px; background:var(--field); color:var(--field-ink); border-radius:18px; padding:14px 20px; font-family:var(--font-display); font-size:30px; font-weight:800}
.mfield svg{width:54px; height:54px; flex:none}
.mslot{min-height:96px; border-radius:18px; background:var(--surface); box-shadow:inset 0 0 0 3px var(--line); display:flex; align-items:center; padding:8px}
.mslot .ph{color:var(--muted); font-size:22px; padding:0 14px}
.mchip{background:var(--paper); border-radius:14px; padding:14px 18px; font-size:24px; font-weight:700; box-shadow:0 2px 0 rgba(6,42,49,.18); line-height:1.4}
.mtray{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; padding:14px; background:var(--surface); border-radius:20px; min-height:90px}

/* balance */
.bal{position:relative; flex:1}
.bal svg{width:100%; height:100%; display:block}
.zone{position:absolute; border-radius:18px; border:3px dashed transparent}
.zone.show{border-color:var(--line)}
.tray{display:flex; gap:12px; align-items:center; justify-content:center; padding:10px 14px; background:var(--surface); border-radius:20px; min-height:84px}
.atom{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:24px; color:#fff; box-shadow:inset -5px -6px 0 rgba(0,0,0,.14); flex:none}
.atom.H{background:#EEF3F2; color:#243b3f; box-shadow:inset 0 0 0 3px #5E7E84}
.atom.C{background:#3A3F45}
.atom.He{background:#F5A93A; color:#4a2a00}
.atom.Mg{background:#6FA8E4; color:#06223d}
.rounds{display:flex; gap:10px}
.rd{height:40px; padding:0 16px; border-radius:999px; background:var(--surface); display:inline-flex; align-items:center; font-weight:700; font-size:18px}
.rd.cur{background:var(--field); color:var(--field-ink)}
.rd.done{background:var(--ok-bg); color:var(--ok)}

/* atom tap */
.part{cursor:pointer; transition:transform 180ms var(--ease-out); transform-box:fill-box; transform-origin:center}
.part:hover{transform:scale(1.04)}

/* zeros */
.zeros{direction:ltr; font-family:var(--font-display); font-weight:800; font-size:56px; line-height:1.15; display:flex; flex-wrap:wrap; gap:4px 3px; align-items:flex-end; unicode-bidi:isolate}
.zeros .z{width:36px; height:64px; border-radius:10px; background:var(--field); color:var(--field-ink); display:grid; place-items:center; animation:pop 200ms var(--ease-out) both}
.zeros .z.d{background:var(--accent); color:var(--accent-ink)}
.zeros .dot{width:20px; text-align:center; align-self:flex-end}

/* steps */
.steps{display:flex; flex-direction:column; gap:14px}
.stp{background:var(--paper); border-radius:18px; padding:16px 22px; display:flex; gap:18px; align-items:center; font-size:27px; line-height:1.5; animation:up 320ms var(--ease-out) both}
.stp .sn{flex:none; width:46px; height:46px; border-radius:12px; background:var(--accent); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:26px}
.stp.final{background:var(--field); color:var(--field-ink)}
.stp.final .sn{background:var(--accent)}
.defn{font-size:30px; line-height:1.65}

/* calc table */
.calc{display:grid; grid-template-columns:auto 1fr; gap:10px 18px; align-items:center; font-size:27px}
.calc .eq{font-size:36px}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 8px; direction:ltr}
.frac>span{padding:2px 10px}
.frac>span:first-child{border-bottom:3px solid currentColor}

/* isotopes */
.dots{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; width:360px; flex:none}
.dots i{aspect-ratio:1; border-radius:50%; background:var(--field); transition:background-color 160ms var(--ease-out), transform 160ms var(--ease-out)}
.dots i.b{background:var(--accent)}
.rng{width:100%; height:44px; -webkit-appearance:none; appearance:none; background:transparent; direction:ltr}
.rng::-webkit-slider-runnable-track{height:16px; border-radius:10px; background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--field) var(--p,50%))}
.rng::-moz-range-track{height:16px; border-radius:10px; background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--field) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none; width:44px; height:44px; margin-top:-14px; border-radius:50%; background:#fff; border:6px solid var(--ink)}
.rng::-moz-range-thumb{width:32px; height:32px; border-radius:50%; background:#fff; border:6px solid var(--ink)}
.readout{font-family:var(--font-display); font-weight:800; font-size:92px; line-height:1; direction:ltr; transition:color 200ms var(--ease-out)}
.readout.hit{color:var(--ok)}

/* ex 3-1 a */
.line{position:relative; height:150px}
.sent{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--paper); border-radius:16px; padding:12px 18px; font-size:25px; line-height:1.7}

/* Mr cards */
.mrc{background:var(--paper); border-radius:20px; padding:12px 18px; display:flex; flex-direction:column; gap:6px; flex:1; min-width:0}
.mrc h4{margin:0; display:flex; align-items:center; justify-content:space-between; font-family:var(--font-display); font-size:44px; direction:ltr}
.mrc h4 span{font-family:var(--font-body); font-size:21px; color:var(--muted); direction:rtl; font-weight:500}
.mrr{display:grid; grid-template-columns:54px 74px 1fr; align-items:center; gap:8px; direction:ltr; font-size:23px; min-height:46px}
.cin{width:68px; height:42px; border:0; border-radius:12px; background:#fff; box-shadow:inset 0 0 0 3px var(--line); font:800 26px var(--font-display); text-align:center; direction:ltr; color:var(--ink); transition:box-shadow 160ms var(--ease-out), background-color 160ms var(--ease-out)}
.cin:focus{outline:none; box-shadow:inset 0 0 0 4px var(--accent)}
.mrr small{display:block; font-size:14px; color:var(--muted); line-height:1.1; font-family:var(--font-body); direction:rtl; text-align:left}
.mrc .tot{display:flex; align-items:center; gap:10px; margin-top:auto; font-family:var(--font-display); font-weight:800; font-size:26px; direction:ltr; justify-content:center}
.mrr b{font-family:var(--font-display); font-size:28px}
.mrr .res{font-weight:800; font-size:23px; color:var(--ok); min-width:110px; text-align:left}
.arside{width:230px; flex:none; background:var(--field); color:var(--field-ink); border-radius:20px; padding:16px 18px}
.arside h4{margin:0 0 8px; font-family:var(--font-display); font-size:23px; color:var(--accent)}
.arside .g{display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; direction:ltr; font-size:21px}
.arside .g span{display:flex; justify-content:space-between; background:rgba(255,255,255,.1); border-radius:8px; padding:3px 9px}
.arside .g b{font-family:var(--font-display)}
.rule{display:flex; gap:12px; align-items:flex-start; background:var(--paper); border-radius:16px; padding:12px 16px; font-size:22px; line-height:1.5; cursor:pointer; box-shadow:inset 0 0 0 3px transparent; transition:box-shadow 160ms var(--ease-out)}
.rule i{flex:none; font-style:normal; width:44px; height:44px; border-radius:11px; background:var(--accent); display:grid; place-items:center; font:800 24px var(--font-display); direction:ltr}
.rule.on{box-shadow:inset 0 0 0 3px var(--accent)}
.fbig{font-family:var(--font-display); font-weight:800; font-size:62px; direction:ltr; display:flex; align-items:baseline; justify-content:center; gap:2px; line-height:1.2; unicode-bidi:isolate}
.fbig .seg{padding:0 6px; border-radius:12px; transition:background-color 200ms var(--ease-out)}
.fbig .seg.hl{background:var(--accent-soft)}
.fbig sub{font-size:.55em}

/* race */
.rgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; flex:1}
.rc{background:var(--paper); border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:space-between; box-shadow:inset 0 0 0 3px var(--line); transition:box-shadow 160ms, background-color 160ms}
.rc .f{font-family:var(--font-display); font-weight:800; font-size:34px; direction:ltr; line-height:1.2; text-align:center; unicode-bidi:isolate}
.rc .nm{font-size:19px; color:var(--muted)}
.rc.ok{background:var(--ok-bg); box-shadow:inset 0 0 0 3px var(--ok)}
.rc .ans{font-family:var(--font-display); font-weight:800; font-size:30px; color:var(--ok); direction:ltr; min-height:36px}
.teams{display:flex; flex-direction:column; gap:12px; width:210px; flex:none}
.team{background:var(--field); color:var(--field-ink); border-radius:20px; padding:12px 14px; text-align:center}
.team.b{background:var(--accent); color:var(--accent-ink)}
.team b{display:block; font-family:var(--font-display); font-size:64px; line-height:1}
.team .pm{display:flex; gap:8px; justify-content:center; margin-top:6px}
.team .pm button{width:52px; height:44px; border:0; border-radius:10px; background:rgba(255,255,255,.2); color:inherit; font:800 26px var(--font-display); transition:transform 140ms var(--ease-out)}
.team .pm button:active{transform:scale(.92)}

/* tickets */
.tk{display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center}
.tq{display:none; background:var(--paper); border-radius:24px; padding:22px 30px; flex-direction:column; gap:14px}
.tq.cur{display:flex; animation:up 300ms var(--ease-out) both}
.tq h4{margin:0; font-size:32px; line-height:1.5; font-weight:700; display:flex; gap:16px}
.tq h4 i{font-style:normal; flex:none; width:48px; height:48px; border-radius:12px; background:var(--accent); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:28px}
.tq .opt{min-height:62px; font-size:27px}
.tq .fb{min-height:34px; font-size:23px}
.tkbar{display:flex; align-items:center; gap:14px}
.score{grid-column:1/-1; display:flex; align-items:center; gap:18px; background:var(--field); color:var(--field-ink); border-radius:20px; padding:12px 26px; font-size:26px; font-weight:700}
.score b{font-family:var(--font-display); font-size:46px; color:var(--accent); direction:ltr}

/* models */
.mod{background:var(--paper); border-radius:22px; display:flex; flex-direction:column; align-items:center; padding:10px 14px; gap:6px; flex:1; min-width:0}
.mod svg{width:100%; height:auto; max-height:380px}
.sph{cursor:pointer}
.sph circle.s{transition:stroke 140ms, stroke-width 140ms}
.sph.cnt circle.s{stroke:var(--accent); stroke-width:6}
.tally{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; min-height:46px}
.tally span{display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 14px 0 10px; border-radius:999px; background:var(--surface); font-weight:800; font-size:23px; font-family:var(--font-display)}
.tally span i{width:26px; height:26px; border-radius:50%; display:inline-block}
.sel{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.sel button{min-height:54px; padding:0 20px; border:0; border-radius:14px; background:var(--surface); font:800 30px var(--font-display); direction:ltr; box-shadow:inset 0 0 0 3px transparent; transition:transform 150ms var(--ease-out), box-shadow 150ms}
.sel button:hover{box-shadow:inset 0 0 0 3px var(--field)}
.sel button:active{transform:scale(.96)}
.sel button.locked{pointer-events:none}

/* q3-1 diagram cards */
.qd{position:relative; background:var(--paper); border-radius:18px; padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px; align-items:center; min-width:0}
.qd .id{position:absolute; top:8px; inset-inline-start:8px; font-family:var(--font-display); font-weight:800; font-size:22px; background:var(--accent); width:34px; height:34px; display:grid; place-items:center; border-radius:10px}
.qd svg{width:100%; height:150px}
.qd .sel button{min-height:44px; padding:0 12px; font-size:23px}
.qd.ok{background:var(--ok-bg)}

/* past-exam cards */
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-content:start}
.pq{background:var(--paper); border-radius:18px; padding:10px 16px 8px; display:flex; flex-direction:column; gap:6px; min-width:0}
.pq.ok{background:var(--ok-bg)}
.pqh{display:flex; justify-content:space-between; align-items:center}
.yr{background:var(--surface); border-radius:999px; padding:1px 10px; font-weight:800; font-size:15px}
.pq.ok .yr{background:#fff}
.mk{font-family:var(--font-display); font-weight:800; color:var(--muted); font-size:18px}
.pqt{font-size:20px; line-height:1.5}
.pq .fb{min-height:24px; font-size:17px}
.pq .sel button{min-height:44px}

/* ===== virtual lab ===== */
.stage.lab{background:#0C2B31; color:#EAF6F3}
@supports (overflow:clip){.stage{overflow:clip}}  /* focusing a field must never scroll the stage */
.lab .hd .chip{background:#12403F}
.lab .hd h2{color:#EAF6F3}
.lab .panel{background:#12403F; color:#EAF6F3}
.lab .muted{color:#A9CFC9}
.lb{display:grid; grid-template-columns:250px 1fr 380px; gap:18px; flex:1; min-height:0}
.lsteps{display:flex; flex-direction:column; gap:8px}
.ls{display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:14px; background:#12403F; color:#A9CFC9; font-size:18px; line-height:1.35; font-weight:500; transition:background-color 200ms var(--ease-out), color 200ms var(--ease-out)}
.ls i{flex:none; width:32px; height:32px; border-radius:9px; background:#0C2B31; display:grid; place-items:center; font:800 18px var(--font-display); font-style:normal}
.ls.cur{background:#EAF6F3; color:#062A31; font-weight:800}
.ls.cur i{background:var(--accent)}
.ls.done{color:#EAF6F3}
.ls.done i{background:#1C8A4E; color:#fff}
.lwork{position:relative; background:#12403F; border-radius:22px; overflow:hidden; display:flex; flex-direction:column}
.lwork .scene{flex:1; min-height:0}
.lwork .scene svg{width:100%; height:100%; display:block}
.lwork .ctl{padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#0C2B31; min-height:84px}
.lwork .say{padding:10px 18px; font-size:22px; line-height:1.45; min-height:62px; background:#0F3538}
.lwork .say b{color:var(--accent)}
.lnote{display:flex; flex-direction:column; gap:10px; min-height:0}
.lnote table{width:100%; border-collapse:separate; border-spacing:0 3px; font-size:16px; direction:ltr; text-align:center}
.lnote th{color:#A9CFC9; font-weight:700; font-size:16px; padding:2px 2px}
.lnote td{background:#0C2B31; padding:2px 2px; font-family:var(--font-display); font-weight:800; font-size:17px; line-height:1.35}
.lnote td:first-child{border-radius:9px 0 0 9px} .lnote td:last-child{border-radius:0 9px 9px 0}
.lnote tr.fresh td{background:var(--accent); color:#062A31}
.lnote td.q{color:#A9CFC9}
.lgraph{background:#0C2B31; border-radius:16px}
.lgraph svg{width:100%; height:auto; display:block}
.lb .btn{background:var(--accent); color:#062A31}
.lb .btn.ghost{background:transparent; color:#EAF6F3; box-shadow:inset 0 0 0 3px #3C6E6C}
.lb .btn.ghost:hover{background:#12403F}
.lb .btn:hover{background:#FFA23C}
.lb .nin input{background:#EAF6F3}
.lb .nin .go{background:var(--accent); color:#062A31}
.lb .nin .u{color:#A9CFC9}
.lb .fb.ok{color:#7EE0A8} .lb .fb.bad{color:#FF9C8C}
.lb .opts{flex-direction:row; flex-wrap:wrap; gap:8px}
.lb .opt{flex:1 1 30%; width:auto; background:#12403F; box-shadow:inset 0 0 0 3px #2E6462; color:#EAF6F3; font-size:21px; min-height:54px}
.lb .opt .ix{background:#0C2B31}
.lb .opt.ok-b{background:#1C6B45!important; box-shadow:inset 0 0 0 3px #7EE0A8!important}
.lb .opt.bad-b{background:#7A2A20!important; box-shadow:inset 0 0 0 3px #FF9C8C!important}
.gear{width:96px; text-align:center; cursor:pointer; border:0; background:#0C2B31; border-radius:16px; padding:10px 4px; color:#EAF6F3; font-weight:700; font-size:17px; box-shadow:inset 0 0 0 3px #2E6462; transition:transform 160ms var(--ease-out), box-shadow 160ms}
.gear svg{width:56px; height:56px; display:block; margin:0 auto 4px}
.gear.on{box-shadow:inset 0 0 0 3px #7EE0A8; background:#1C6B45}
.gear:active{transform:scale(.96)}
@keyframes flare{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:1; transform:scale(1.12)}}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}
@keyframes smoke{0%{opacity:.0; transform:translateY(0) scale(.6)}25%{opacity:.8}100%{opacity:0; transform:translateY(-120px) scale(1.7)}}
.flame{transform-box:fill-box; transform-origin:50% 100%; animation:flick 220ms ease-in-out infinite}
.flare{transform-box:fill-box; transform-origin:center; animation:flare 140ms linear infinite}
.sm1,.sm2,.sm3{transform-box:fill-box; transform-origin:center; animation:smoke 1.6s ease-out infinite}
.sm2{animation-delay:.5s} .sm3{animation-delay:1s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
}
@media (max-width:700px){
  .brand span em,.where small{display:none}
  .nav{min-width:92px; padding:0 14px; font-size:18px}
  .prog .seg.gap{margin-inline-start:4px}
}

/* the platform shell: one frame for the home page and the teacher's records; the lesson view keeps the lesson player's frame */
body{overflow:auto; background:var(--c-bg)}
.app{position:static!important; display:block!important; inset:auto!important}
.view{position:fixed; inset:0; overflow:hidden}
.page{position:relative; z-index:2; min-height:100vh; padding:24px 48px 44px; max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.top2{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.top2 .brand{font-size:26px}
.top2 .sp{flex:1}
/* ===== living background layers and solid glass panels; every colour comes from the slide's palette ===== */

/* page chrome follows the palette of the current slide, fading between palettes */
.top,.bot{background-color:var(--c-bar); background-image:none; transition:background-color 900ms ease; position:relative; z-index:5}
.top{border-bottom:1px solid rgba(var(--t1),.18)}
.bot{border-top:1px solid rgba(var(--t1),.18)}
.tbtn{background:rgba(var(--t1),.12); box-shadow:inset 0 0 0 1px rgba(var(--t1),.2)}
.tbtn:hover{background:rgba(var(--t1),.24)}
#bFx[data-tier="0"]{opacity:.72}
#bFx[data-tier="2"] svg{color:var(--gold)}
.nav.prev{background:rgba(var(--t1),.14)}
.prog .seg{background:rgba(var(--t1),.18)}
.prog .seg.done{background:var(--c-muted)}
.prog .seg.cur{box-shadow:0 0 12px rgba(228,188,75,.7)}

/* the stage no longer paints its own ground: the background engine sits behind it */
.stage,.stage.lab{background:transparent!important; border-radius:0}
.stage::before,.stage::after{content:none!important; display:none!important}

/* ---- background layers ---- */
.bgfx{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:radial-gradient(900px 560px at 82% 6%,var(--f1) 0%,transparent 62%),radial-gradient(760px 480px at 6% 98%,var(--f2) 0%,transparent 64%),linear-gradient(160deg,var(--f3) 0%,var(--ground) 55%,var(--f4) 100%)}
.bgc{position:absolute; inset:0; width:100%; height:100%; display:block}
.nogl .gl{display:none}
.bgb{display:none}
.nogl .bgb{display:block; position:absolute; width:70%; height:90%; border-radius:50%; will-change:transform}
.nogl .b1{right:-12%; top:-25%; background:radial-gradient(closest-side,rgba(var(--t1),.4),transparent); animation:bgd1 26s ease-in-out infinite alternate}
.nogl .b2{left:-16%; bottom:-35%; background:radial-gradient(closest-side,rgba(var(--t1),.3),transparent); animation:bgd2 32s ease-in-out infinite alternate}
@keyframes bgd1{from{transform:translate(0,0) scale(1)}to{transform:translate(-14%,18%) scale(1.12)}}
@keyframes bgd2{from{transform:translate(0,0) scale(1)}to{transform:translate(18%,-14%) scale(1.1)}}

/* slow beams of light (transform only, so they cost almost nothing) */
.bgl{position:absolute; inset:0; overflow:hidden}
.bgl::before,.bgl::after{content:""; position:absolute; top:-35%; bottom:-35%; width:30%; will-change:transform;
  background:linear-gradient(90deg,transparent,rgba(255,226,150,.075),rgba(var(--t2),.05),transparent)}
.bgl::before{left:-20%; animation:beam1 38s ease-in-out infinite alternate}
.bgl::after{right:-14%; width:22%; animation:beam2 52s ease-in-out infinite alternate}
@keyframes beam1{from{transform:translateX(0) rotate(18deg)}to{transform:translateX(420%) rotate(18deg)}}
@keyframes beam2{from{transform:translateX(0) rotate(18deg)}to{transform:translateX(-520%) rotate(18deg)}}
[data-fx="0"] .bgl{display:none}

/* a soft sweep of light whenever the background changes */
.bgwipe{position:absolute; inset:0; opacity:0; transform:translateX(110%);
  background:linear-gradient(100deg,transparent 36%,rgba(255,226,150,.05) 43%,rgba(255,238,175,.20) 50%,rgba(var(--t2),.12) 57%,transparent 64%)}
.bgwipe.go{animation:bgwipe 1.5s var(--ease-io) both}
@keyframes bgwipe{0%{transform:translateX(110%);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-110%);opacity:0}}

/* keeps text calm: a dark pool behind the content and a vignette at the edges */
.bgscrim{position:absolute; inset:0;
  background:radial-gradient(ellipse 62% 68% at 50% 54%,rgba(var(--d1),.46) 0%,rgba(var(--d1),.26) 58%,rgba(var(--d1),0) 100%),radial-gradient(ellipse at 50% 50%,transparent 56%,rgba(0,0,0,.5) 100%)}

/* ---- solid glass panels: readable over moving light ---- */
.panel,.frm,.mod,.qd,.rc,.mrc,.pq,.goal,.tq{
  background:linear-gradient(145deg,rgba(var(--p1),.80),rgba(var(--p2),.74));
  border:1.5px solid rgba(var(--t2),.48);
  box-shadow:0 14px 38px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14), 0 0 26px rgba(var(--t1),.10)}
.frm>.fh{background:linear-gradient(90deg,rgba(var(--t1),.26),rgba(var(--t1),.08))}
/* gold-edged panels: deep amber fading into the palette ground */
.panel.dark,.stp.final,.frm.gold,.team.b,.score{background:linear-gradient(135deg,rgba(104,78,12,.82),rgba(var(--p2),.86))}
.frm.gold>.fh{background:rgba(228,188,75,.22)}
.opt,.pr,.pill{background:rgba(var(--d2),.72)}
.hd h2,.lead,.big{text-shadow:0 2px 14px rgba(var(--d1),.7), 0 0 22px rgba(var(--t1),.28)}
.sm,.muted,.fb{text-shadow:0 1px 8px rgba(var(--d1),.85)}
.hd::after{background:linear-gradient(to left,var(--cyan),rgba(var(--t1),.35) 45%,transparent); box-shadow:0 0 12px rgba(var(--t1),.5)}

/* lab step list and chips: darker ground so small text keeps its contrast */
.ls{background:rgba(var(--d2),.72); color:#e8ecef}
.ls i{color:#fff; background:rgba(var(--t1),.30)}
.ls.cur{background:rgba(94,70,12,.8)}

/* per-palette versions of the shaded "Cyan" ball used in the atom drawings */
[data-pal="navy"] [fill="url(#gCyan)"]{fill:url(#gCyan_navy)}
[data-pal="ember"] [fill="url(#gCyan)"]{fill:url(#gCyan_ember)}
[data-pal="gold"] [fill="url(#gCyan)"]{fill:url(#gCyan_gold)}
[data-pal="violet"] [fill="url(#gCyan)"]{fill:url(#gCyan_violet)}

/* small labels that sit on tinted chips: dark ink on the gold badge, light ink on the dark chips */
.qd .id{color:var(--accent-ink)}
.rd{color:var(--ink); background:rgba(var(--d2),.7)}
.rd.cur{color:#fff; background:rgba(var(--t1),.38)}

a.tbtn{text-decoration:none}

/* ===== motion: slide transitions (one per slide change) and element entrances (varied per slide) ===== */
@property --ang{syntax:"<angle>"; inherits:false; initial-value:0deg}
@property --bw{syntax:"<percentage>"; inherits:false; initial-value:0%}
@property --wa{syntax:"<angle>"; inherits:false; initial-value:0deg}
@property --wb{syntax:"<percentage>"; inherits:false; initial-value:0%}

/* resting states: every transition below animates away from / towards these */
.stage{perspective:2200px}
.slide{opacity:0; transform:none; filter:none}
.tr-flip{backface-visibility:hidden}
.slide.back{transform:none}
.slide.on{opacity:1; z-index:2; transition:none}
.slide.off{opacity:0; z-index:1; transform:none; transition:none}
.slide.on:where([class*="tr-"]),.slide.off:where([class*="tr-"]){animation-duration:var(--tdur,640ms); animation-timing-function:var(--ease-out); animation-fill-mode:both}
.slide.off:where([class*="tr-"]){animation-timing-function:cubic-bezier(.5,0,.75,0)}

/* fade with a soft focus pull */
.tr-fade.on{animation-name:trFadeIn}
.tr-fade.off{animation-name:trFadeOut; animation-duration:240ms!important}
@keyframes trFadeIn{from{opacity:0; transform:scale(.985); filter:blur(5px)}to{opacity:1; transform:none; filter:blur(0)}}
@keyframes trFadeOut{from{opacity:1}to{opacity:0; filter:blur(3px)}}

/* push: the new slide pushes the old one out */
.tr-push.on{animation-name:trPushIn}
.tr-push.off{animation-name:trPushOut; animation-timing-function:var(--ease-out)}
@keyframes trPushIn{from{opacity:1; transform:translateX(calc(var(--dx)*100%))}to{opacity:1; transform:none}}
@keyframes trPushOut{from{opacity:1; transform:none}to{opacity:1; transform:translateX(calc(var(--dx)*-100%))}}

/* cover: the new slide slides over the old one, which dims */
.tr-cover.on{animation-name:trCoverIn; box-shadow:0 0 60px rgba(0,0,0,.55)}
.tr-cover.off{animation-name:trCoverOut; animation-timing-function:var(--ease-out)}
@keyframes trCoverIn{from{opacity:1; transform:translateX(calc(var(--dx)*100%))}to{opacity:1; transform:none}}
@keyframes trCoverOut{from{opacity:1; transform:none}to{opacity:.35; transform:translateX(calc(var(--dx)*-14%)) scale(.97)}}

/* uncover: the old slide slides away and shows the new one under it */
.tr-uncover.on{animation-name:trHoldIn; z-index:1}
.tr-uncover.off{animation-name:trUncoverOut; z-index:3; animation-timing-function:var(--ease-out)}
@keyframes trHoldIn{from{opacity:1}to{opacity:1}}
@keyframes trUncoverOut{from{opacity:1; transform:none}to{opacity:1; transform:translateX(calc(var(--dx)*-100%))}}

/* zoom and fly-through */
.tr-zoom.on{animation-name:trZoomIn}
.tr-zoom.off{animation-name:trZoomOut; animation-duration:360ms!important}
@keyframes trZoomIn{from{opacity:0; transform:scale(.88)}to{opacity:1; transform:none}}
@keyframes trZoomOut{from{opacity:1}to{opacity:0; transform:scale(1.1)}}
.tr-flythrough.on{animation-name:trFlyIn}
.tr-flythrough.off{animation-name:trFlyOut; animation-duration:520ms!important}
@keyframes trFlyIn{from{opacity:0; transform:scale(.55); filter:blur(8px)}55%{opacity:1}to{opacity:1; transform:none; filter:blur(0)}}
@keyframes trFlyOut{from{opacity:1}to{opacity:0; transform:scale(1.7); filter:blur(8px)}}

/* wipe, split, circle, clock, blinds: the new slide is revealed while the old one waits underneath */
.tr-wipe.on{animation-name:trWipeIn}
.tr-split.on{animation-name:trSplitIn}
.tr-circle.on{animation-name:trCircleIn}
.tr-clock.on{animation-name:trClockIn; -webkit-mask-image:conic-gradient(from -90deg at 50% 50%,#000 var(--ang),transparent calc(var(--ang) + .4deg)); mask-image:conic-gradient(from -90deg at 50% 50%,#000 var(--ang),transparent calc(var(--ang) + .4deg))}
.tr-blinds.on{animation-name:trBlindsIn; -webkit-mask-image:repeating-linear-gradient(90deg,#000 0,#000 var(--bw),transparent var(--bw),transparent 12.5%); mask-image:repeating-linear-gradient(90deg,#000 0,#000 var(--bw),transparent var(--bw),transparent 12.5%)}
.tr-wipe.off,.tr-split.off,.tr-circle.off,.tr-clock.off,.tr-blinds.off{animation-name:trFadeOut; animation-duration:calc(var(--tdur,700ms)*.55)!important; animation-timing-function:ease-out}
@keyframes trWipeIn{from{opacity:1; clip-path:inset(0 calc(50% - var(--dx)*50%) 0 calc(50% + var(--dx)*50%))}to{opacity:1; clip-path:inset(0 0 0 0)}}
@keyframes trSplitIn{from{opacity:1; clip-path:inset(0 50% 0 50%)}to{opacity:1; clip-path:inset(0 0 0 0)}}
@keyframes trCircleIn{from{opacity:1; clip-path:circle(0% at 50% 50%)}to{opacity:1; clip-path:circle(142% at 50% 50%)}}
@keyframes trClockIn{from{opacity:1; --ang:0deg}to{opacity:1; --ang:361deg}}
@keyframes trBlindsIn{from{opacity:1; --bw:0%}to{opacity:1; --bw:12.5%}}

/* flip, gallery, rotate, pan, flash */
.tr-flip.on{animation-name:trFlipIn}
.tr-flip.off{animation-name:trFlipOut; animation-timing-function:ease-in}
@keyframes trFlipIn{0%{opacity:0; transform:perspective(1800px) rotateY(calc(var(--dx)*-90deg))}49%{opacity:0}50%{opacity:1; transform:perspective(1800px) rotateY(calc(var(--dx)*-90deg))}100%{opacity:1; transform:perspective(1800px) rotateY(0)}}
@keyframes trFlipOut{0%{opacity:1; transform:perspective(1800px) rotateY(0)}50%{opacity:1; transform:perspective(1800px) rotateY(calc(var(--dx)*90deg))}51%,100%{opacity:0}}
.tr-gallery.on{animation-name:trGalIn}
.tr-gallery.off{animation-name:trGalOut}
@keyframes trGalIn{from{opacity:0; transform:perspective(1800px) translateX(calc(var(--dx)*55%)) rotateY(calc(var(--dx)*-40deg)) scale(.78)}to{opacity:1; transform:none}}
@keyframes trGalOut{from{opacity:1}to{opacity:0; transform:perspective(1800px) translateX(calc(var(--dx)*-55%)) rotateY(calc(var(--dx)*40deg)) scale(.78)}}
.tr-rotate.on{animation-name:trRotIn}
.tr-rotate.off{animation-name:trRotOut}
@keyframes trRotIn{from{opacity:0; transform:rotate(calc(var(--dx)*-7deg)) scale(.88)}to{opacity:1; transform:none}}
@keyframes trRotOut{from{opacity:1}to{opacity:0; transform:rotate(calc(var(--dx)*7deg)) scale(.9)}}
.tr-pan.on{animation-name:trPanIn}
.tr-pan.off{animation-name:trPanOut}
@keyframes trPanIn{from{opacity:0; transform:translateX(calc(var(--dx)*45%)) scale(1.06)}to{opacity:1; transform:none}}
@keyframes trPanOut{from{opacity:1}to{opacity:0; transform:translateX(calc(var(--dx)*-45%))}}
.tr-flash.on{animation-name:trFlashIn}
.tr-flash.off{animation-name:trFadeOut; animation-duration:160ms!important}
@keyframes trFlashIn{0%{opacity:0; filter:brightness(3) blur(4px)}35%{opacity:1; filter:brightness(1.8) blur(1px)}100%{opacity:1; filter:brightness(1) blur(0)}}

/* one gold glint travels along the title rule when a slide opens */
.hd::before{content:""; position:absolute; right:0; bottom:-1px; width:22%; height:4px; border-radius:2px; opacity:0; pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff6cf,transparent); box-shadow:0 0 14px rgba(255,226,150,.9)}
.slide.on .hd::before{animation:glint 1.5s 200ms var(--ease-io) 1 both}
@keyframes glint{0%{transform:translateX(120%); opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(-520%); opacity:0}}

/* ---- element entrances: a different effect and direction for each block, chosen per slide ---- */
.fx{animation-duration:var(--fd,680ms); animation-delay:var(--fdl,0ms); animation-timing-function:var(--fe,cubic-bezier(.22,1,.36,1)); animation-fill-mode:backwards}
.e-fade{animation-name:fxFade}
.e-float{animation-name:fxFloat}
.e-flyR{animation-name:fxFlyR}
.e-flyL{animation-name:fxFlyL}
.e-flyT{animation-name:fxFlyT}
.e-flyB{animation-name:fxFlyB}
.e-zoom{animation-name:fxZoom}
.e-growTurn{animation-name:fxGrowTurn}
.e-swivel{animation-name:fxSwivel; transform-origin:50% 0}
.e-bounce{animation-name:fxBounce; --fe:cubic-bezier(.3,1.35,.5,1)}
.e-wipeR{animation-name:fxWipeR}
.e-wipeL{animation-name:fxWipeL}
.e-wipeB{animation-name:fxWipeB}
.e-wipeT{animation-name:fxWipeT}
.e-splitH{animation-name:fxSplitH}
.e-splitV{animation-name:fxSplitV}
.e-shape{animation-name:fxShape}
.e-diamond{animation-name:fxDiamond}
.e-wheel{animation-name:fxWheel; -webkit-mask-image:conic-gradient(from -90deg,#000 var(--wa),transparent calc(var(--wa) + .4deg)); mask-image:conic-gradient(from -90deg,#000 var(--wa),transparent calc(var(--wa) + .4deg))}
.e-bars{animation-name:fxBars; -webkit-mask-image:repeating-linear-gradient(0deg,#000 0,#000 var(--wb),transparent var(--wb),transparent 14.2857%); mask-image:repeating-linear-gradient(0deg,#000 0,#000 var(--wb),transparent var(--wb),transparent 14.2857%)}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxFloat{from{opacity:0; transform:translateY(22px)}to{opacity:1; transform:none}}
@keyframes fxFlyR{from{opacity:0; transform:translateX(90px)}to{opacity:1; transform:none}}
@keyframes fxFlyL{from{opacity:0; transform:translateX(-90px)}to{opacity:1; transform:none}}
@keyframes fxFlyT{from{opacity:0; transform:translateY(-70px)}to{opacity:1; transform:none}}
@keyframes fxFlyB{from{opacity:0; transform:translateY(70px)}to{opacity:1; transform:none}}
@keyframes fxZoom{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
@keyframes fxGrowTurn{from{opacity:0; transform:scale(.7) rotate(-7deg)}to{opacity:1; transform:none}}
@keyframes fxSwivel{from{opacity:0; transform:perspective(900px) rotateX(-80deg)}to{opacity:1; transform:perspective(900px) rotateX(0)}}
@keyframes fxBounce{0%{opacity:0; transform:translateY(46px)}100%{opacity:1; transform:none}}
@keyframes fxWipeR{from{opacity:1; clip-path:inset(-24px -24px -24px 100%)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxWipeL{from{opacity:1; clip-path:inset(-24px 100% -24px -24px)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxWipeB{from{opacity:1; clip-path:inset(100% -24px -24px -24px)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxWipeT{from{opacity:1; clip-path:inset(-24px -24px 100% -24px)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxSplitH{from{opacity:1; clip-path:inset(-24px 50% -24px 50%)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxSplitV{from{opacity:1; clip-path:inset(50% -24px 50% -24px)}to{opacity:1; clip-path:inset(-24px)}}
@keyframes fxShape{from{opacity:1; clip-path:circle(0% at 50% 50%)}to{opacity:1; clip-path:circle(150% at 50% 50%)}}
@keyframes fxDiamond{from{opacity:1; clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%)}to{opacity:1; clip-path:polygon(50% -60%,160% 50%,50% 160%,-60% 50%)}}
@keyframes fxWheel{from{opacity:1; --wa:0deg}to{opacity:1; --wa:361deg}}
@keyframes fxBars{from{opacity:1; --wb:0%}to{opacity:1; --wb:14.2857%}}
[data-fx="0"] .fx{animation:none}

/* emphasis: a short pulse when an answer is right, a bold flash on key results */
.ok-b{animation:okPulse 520ms var(--ease-out)}
@keyframes okPulse{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
.gbox.ok-b,.gbar.pulse{animation:boldFlash 700ms ease-out}
@keyframes boldFlash{0%{filter:brightness(1)}30%{filter:brightness(1.55)}100%{filter:brightness(1)}}

/* ---------- stickers: placed in free space under the content, alive, never on text ---------- */
.slide>*{z-index:1} .slide>.stk{z-index:2}
.stk{position:absolute; pointer-events:none; user-select:none; -webkit-user-drag:none; opacity:0; transform:rotate(var(--r,0deg)); transform-origin:50% 70%}
.stk .in{width:100%; height:100%; transform-origin:50% 92%; filter:drop-shadow(0 7px 9px rgba(0,0,0,.35)); will-change:transform}
.stk .in img,.stk .in svg{display:block; width:100%; height:100%; -webkit-user-drag:none}
.stk .in svg{overflow:visible}
.stk.placed{opacity:1; pointer-events:auto; cursor:pointer; transition:left .7s cubic-bezier(.3,.8,.3,1), top .7s cubic-bezier(.3,.8,.3,1);
  animation:stkIn .75s cubic-bezier(.2,1.45,.35,1) var(--sd,0s) backwards, stkFloat var(--fd,6s) ease-in-out calc(var(--sd,0s) + .75s) infinite alternate}
.stk.free{opacity:1; cursor:pointer; pointer-events:auto;
  animation:stkIn .75s cubic-bezier(.2,1.45,.35,1) var(--sd,0s) backwards, stkFloat var(--fd,6s) ease-in-out calc(var(--sd,0s) + .75s) infinite alternate}
.stk.nospot{opacity:0; pointer-events:none}
@keyframes stkIn{from{opacity:0; transform:translateY(26px) scale(.15) rotate(calc(var(--r,0deg) - 24deg))} to{opacity:1; transform:translateY(0) scale(1) rotate(var(--r,0deg))}}
@keyframes stkFloat{from{transform:translateY(0) rotate(var(--r,0deg))} to{transform:translateY(-8px) rotate(calc(var(--r,0deg) + 2deg))}}
/* how each sticker moves when idle */
.stk[data-mv=breathe] .in{animation:mvBreathe 3.8s ease-in-out var(--bd,0s) infinite alternate}
.stk[data-mv=sway] .in{animation:mvSway 4.6s ease-in-out var(--bd,0s) infinite alternate}
.stk[data-mv=bob] .in{animation:mvBob 3.2s ease-in-out var(--bd,0s) infinite alternate}
.stk[data-mv=hop] .in{animation:mvHop 4.8s ease-in-out var(--bd,0s) infinite}
.stk[data-mv=wiggle] .in{animation:mvWiggle 5.6s ease-in-out var(--bd,0s) infinite}
.stk.poked .in{animation:mvPoke .9s cubic-bezier(.3,.7,.4,1) 1!important}
@keyframes mvBreathe{from{transform:scale(1,1)} to{transform:scale(1.045,.97)}}
@keyframes mvSway{from{transform:rotate(-2.6deg)} to{transform:rotate(2.6deg)}}
@keyframes mvBob{from{transform:translateY(0) rotate(-1deg)} to{transform:translateY(-7px) rotate(1.2deg)}}
@keyframes mvHop{0%,66%,100%{transform:none} 72%{transform:scale(1.07,.9)} 80%{transform:translateY(-22px) scale(.95,1.07)} 88%{transform:translateY(0) scale(1.08,.89)} 94%{transform:scale(.98,1.03)}}
@keyframes mvWiggle{0%,58%,100%{transform:rotate(0)} 64%{transform:rotate(-7deg)} 70%{transform:rotate(7deg)} 76%{transform:rotate(-5deg)} 82%{transform:rotate(3deg)} 88%{transform:rotate(0)}}
@keyframes mvPoke{0%{transform:none} 28%{transform:translateY(-38px) scale(.92,1.1) rotate(-9deg)} 58%{transform:translateY(0) scale(1.12,.86)} 78%{transform:scale(.97,1.04) rotate(3deg)} 100%{transform:none}}
/* drawn stickers: faces blink and look at the pointer, things inside move */
.stk svg .eg{transform:translate(var(--ex,0px),var(--ey,0px)); transition:transform .18s ease-out}
.stk svg .eye{transform-box:fill-box; transform-origin:center; animation:blink 5.2s infinite; animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.08)}}
.stk svg .bu{transform-box:fill-box; transform-origin:center; animation:bubRise 2.8s ease-in infinite}
.stk svg .b2{animation-delay:.9s; animation-duration:3.3s} .stk svg .b3{animation-delay:1.7s; animation-duration:2.4s}
@keyframes bubRise{0%{transform:translateY(0) scale(.6); opacity:0} 18%{opacity:1} 100%{transform:translateY(-52px) scale(1.15); opacity:0}}
.stk svg .liq{transform-box:fill-box; transform-origin:50% 100%; animation:liqW 3.4s ease-in-out infinite alternate}
@keyframes liqW{from{transform:skewX(-2.5deg) scaleY(.97)} to{transform:skewX(2.5deg) scaleY(1.03)}}
.stk svg .orb{animation:orbit 16s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.stk svg .pulse{animation:pulseS 1.8s ease-in-out infinite alternate}
@keyframes pulseS{from{transform:scale(1) rotate(-4deg)} to{transform:scale(1.07) rotate(4deg)}}
.stk svg .tw{animation:twk 1.6s ease-in-out infinite} .stk svg .t2{animation-delay:.7s}
@keyframes twk{0%,100%{transform:scale(.2); opacity:0} 50%{transform:scale(1); opacity:1}}
.stk svg .rays{animation:rayP 1.4s ease-in-out infinite alternate}
@keyframes rayP{from{opacity:.35} to{opacity:1}}
.stk svg .glow{animation:glowP 1.4s ease-in-out infinite alternate}
@keyframes glowP{from{fill:#ffe66b} to{fill:#fff6a8}}
.stk svg .fl{animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,.95) skewX(-2deg)} to{transform:scale(1.03,1.06) skewX(2deg)}}
.stk svg .fl2{animation:flick2 .38s ease-in-out infinite alternate}
@keyframes flick2{from{transform:scale(.92,.9)} to{transform:scale(1.05,1.08)}}
.stk svg .ear{animation:earW 3.6s ease-in-out infinite} .stk svg .ear.e2{animation-delay:.5s}
@keyframes earW{0%,70%,100%{transform:rotate(0)} 78%{transform:rotate(-9deg)} 86%{transform:rotate(5deg)}}
.stk svg .hand{animation:waveH 4.2s ease-in-out infinite} .stk svg .hand.h2{animation-delay:1.6s}
@keyframes waveH{0%,60%,100%{transform:rotate(0)} 70%{transform:rotate(-16deg)} 80%{transform:rotate(8deg)} 90%{transform:rotate(-8deg)}}
.stk svg .nose{transform-box:fill-box; transform-origin:center; animation:noseW 3s ease-in-out infinite}
@keyframes noseW{0%,80%,100%{transform:scale(1)} 88%{transform:scale(1.12,.92)}}
/* calm and still modes, hidden slides */
html[data-fx="1"] .stk.placed,html[data-fx="1"] .stk.free{animation:stkIn .75s cubic-bezier(.2,1.45,.35,1) var(--sd,0s) backwards}
html[data-fx="0"] .stk,html[data-fx="0"] .stk *{animation:none!important}
.slide:not(.on) .stk,.slide:not(.on) .stk *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.stk,.stk *{animation:none!important}}
/* praise sticker and sparkles */
.stk-pop{position:absolute; z-index:60; pointer-events:none; transform:rotate(var(--r,0deg)); filter:drop-shadow(0 12px 18px rgba(0,0,0,.45)); animation:popIn .6s cubic-bezier(.2,1.6,.35,1) both}
.stk-pop img,.stk-pop svg{display:block; width:100%; height:100%}
.stk-pop.out{animation:popOut .55s ease-in both}
@keyframes popIn{from{opacity:0; transform:translateY(70px) scale(.2) rotate(-26deg)} to{opacity:1; transform:translateY(0) scale(1) rotate(var(--r,0deg))}}
@keyframes popOut{to{opacity:0; transform:translateY(-34px) scale(.72) rotate(var(--r,0deg))}}
.spk{position:absolute; z-index:61; width:0; height:0; pointer-events:none} .spk.fixed{position:fixed}
.spk i{position:absolute; left:0; top:0; width:var(--z); height:var(--z); margin:calc(var(--z)/-2) 0 0 calc(var(--z)/-2); background:var(--c); animation:spk .95s cubic-bezier(.15,.7,.3,1) var(--o) both}
.spk i:nth-child(3n+1){clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.spk i:nth-child(3n+2){border-radius:50%}
.spk i:nth-child(3n){clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
@keyframes spk{0%{opacity:0; transform:translate(0,0) scale(.2) rotate(0)} 14%{opacity:1} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg)}}
html.stk-off .stk,html.stk-off .stk-pop,html.stk-off .spk{display:none!important}
/* narrow windows: top-bar buttons keep only their icon so the bar still fits */
@media (max-width:1180px){#bStk span{display:none} #bStk{min-width:44px; padding:0 10px}}
@media (max-width:1100px){#bFx span{display:none} #bFx{min-width:44px; padding:0 10px}}
@media (max-width:1100px){#bHome span{display:none} #bHome{min-width:44px; padding:0 10px}}
/* arrows between steps breathe so the flow reads as moving */
.slide.on .arw{animation:arwPulse 1.7s ease-in-out infinite}
@keyframes arwPulse{0%,100%{transform:scale(1); opacity:.8} 50%{transform:scale(1.18); opacity:1}}
html[data-fx="0"] .arw{animation:none!important}


/* ---- vocabulary used by every screen ---- */
.pill{font:700 19px var(--font-display); color:var(--ink); background:rgba(var(--d2),.72); border:1px solid rgba(var(--t2),.35); border-radius:999px; padding:7px 20px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none}
.pill:hover{border-color:rgba(var(--t1),.9)}
.pill.on{background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border-color:transparent}
.pill svg{width:20px; height:20px}
.sample{font:700 16px var(--font-display); color:var(--muted); border:1px dashed rgba(var(--t2),.5); border-radius:999px; padding:4px 14px}
.glass{background:linear-gradient(145deg,rgba(var(--p1),.82),rgba(var(--p2),.76)); border:1.5px solid rgba(var(--t2),.42); border-radius:20px; padding:18px 22px; box-shadow:0 14px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.gbtn{background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border:0; border-radius:14px; padding:9px 22px; min-height:46px; font:800 20px var(--font-display); cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none}
.gbtn:hover{filter:brightness(1.06)} .gbtn:active{transform:scale(.97)}
.sbtn{background:rgba(var(--t1),.16); color:var(--ink); border:1px solid rgba(var(--t2),.45); border-radius:14px; padding:8px 18px; min-height:46px; font:700 19px var(--font-display); cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.sbtn:hover{background:rgba(var(--t1),.28)} .sbtn svg,.gbtn svg{width:21px; height:21px}

  /* ================= scene 2: chemical reactions ================= */
  SC.reactions=(function(){

  /* ================= scene 3: the periodic table ================= */
  SC.periodic=(function(){

function pauseBg(){ if(host.bgPrev!==undefined) return; host.bgPrev=BG.tier(); try{host.bgSaved=localStorage.getItem('l31fx')}catch(e){host.bgSaved=null} BG.setTier(0); bgKey() }
function resumeBg(){ if(host.bgPrev===undefined) return; BG.setTier(host.bgPrev); bgKey(); if(host.bgSaved===null) BG.auto(true); host.bgPrev=undefined }

/* online the lesson is a page of the site; in the single-file copy (no server) the lesson text is inside this page and goes in through srcdoc, which keeps it same-origin */
function setFrame(L,n){
  var f=$('#lf'), t=window.OFFLINE_LESSONS&&OFFLINE_LESSONS[L.page];
  if(t){ f.removeAttribute('src'); f.srcdoc=t.replace('<head>','<head><script>try{location.hash="#s'+n+'"}catch(e){}<\/script>') }
  else { f.removeAttribute('srcdoc'); f.src=L.page+'#s'+n }
}
function showLesson(L){
  var d=D(), today=PL.todayISO();
  if(pending){ ctx={classId:pending.classId,date:today,period:pending.period||0,lesson:L.id,slide:0}; pending=null }
  else if(host.id!==L.id){ var cid=d.ui.lastClass&&PL.findClass(d,d.ui.lastClass)?d.ui.lastClass:(d.classes[0]?d.classes[0].id:''); ctx={classId:cid,date:today,period:0,lesson:L.id,slide:0} }
  ctx.lesson=L.id;
  if(ctx.classId&&PL.findClass(d,ctx.classId)) change(function(s){PL.setLastLesson(s,ctx.classId,L.id); s.ui.lastClass=ctx.classId; s.ui.course=L.course});
  $('#pg').classList.add('hide'); $('#lv').classList.remove('hide'); pauseBg(); layoutFrame();
  $$('[data-nav]').forEach(function(b){b.classList.remove('on')});
  if(host.id!==L.id){ host.id=L.id; host.w=null; host.d=null; ctx.slide=host.slides[L.id]||1; setFrame(L,ctx.slide) }
  host.restAsk=0; renderDrawer(); startPoll(); document.title=ar(L.code)+' '+L.title;
  /* when the lesson page can not be reached from here (the site opened as plain files), a button of our own opens the drawer */
  setTimeout(function(){ if(host.id===L.id&&!host.d) floatBtn(true) },2500);
}
function floatBtn(on){
  var b=$('#fbtn');
  if(!on){ if(b) b.remove(); return }
  if(b) return; b=document.createElement('button'); b.id='fbtn'; b.type='button'; b.className='gbtn'; b.style.cssText='position:absolute;left:14px;bottom:14px;z-index:20'; b.innerHTML=ic('users')+'الصف';
  b.addEventListener('click',toggleDrawer); $('#lv').firstChild.appendChild(b);
}
function hideLesson(){
  if($('#lv').classList.contains('hide')) return;
  stopPoll(); floatBtn(false); $('#lv').classList.add('hide'); $('#pick').classList.add('hide'); resumeBg();
  if(document.fullscreenElement&&document.exitFullscreen) try{document.exitFullscreen().catch(function(){})}catch(e){}
  $('#lf').removeAttribute('srcdoc'); $('#lf').src='about:blank'; host.id=''; host.w=null; host.d=null; document.title='منصة الدروس';
}
/* the slide the lesson shows: read from its progress bar (works in both ways of loading), else from its address */
function readSlide(){
  try{
    var segs=host.d&&host.d.querySelectorAll('#prog .seg'); if(segs&&segs.length){ for(var i=0;i<segs.length;i++) if(segs[i].classList.contains('cur')) return i+1 }
    var m=/#s(\d+)/.exec((host.w&&host.w.location.hash)||''); return m?+m[1]:0;
  }catch(e){return 0}
}
function startPoll(){ stopPoll(); host.poll=setInterval(function(){ var n=readSlide(); if(n&&n!==ctx.slide){ctx.slide=n; host.slides[ctx.lesson]=n; renderCtx()} },600) }
function stopPoll(){clearInterval(host.poll); host.poll=0}
function focusLesson(){ try{ if(host.w) host.w.focus() }catch(e){} }
function hostFullscreen(){ try{ var p=document.fullscreenElement?document.exitFullscreen():$('#lv').requestFullscreen(); if(p&&p.catch) p.catch(function(){toast('تعذّر ملء الشاشة من هذه الصفحة. استخدم F11 في المتصفح.')}) }catch(e){} }
function toggleDrawer(){ host.open=!host.open; $('#drawer').classList.toggle('open',host.open); layoutFrame(); updateClassBtn(); if(!host.open) focusLesson() }
/* the lesson player needs about 1000 px of width (its top bar and footer), so when the drawer leaves less the frame keeps that width and is scaled down to fit */
var MINW=1100;
function layoutFrame(){
  var wrap=$('#lfWrap'), f=$('#lf'); if(!wrap||!f) return; var W=wrap.clientWidth, H=wrap.clientHeight; if(!W||!H) return;
  var s=Math.min(1,W/MINW); f.style.width=(s<1?MINW:W)+'px'; f.style.height=(H/s)+'px'; f.style.transform=s<1?'scale('+s+')':'';
}

/* the lesson page is ours (same site): add a "class" button to its top bar, send its home button to the platform, keep full screen on the whole host */
function patchLesson(){
  var f=$('#lf'), w, d; try{w=f.contentWindow; d=f.contentDocument}catch(e){return}
  if(!d||!d.body||!d.querySelector('.app')||!host.id) return;
  host.w=w; host.d=d; floatBtn(false);
  var top=d.querySelector('header.top');
  if(top&&!d.getElementById('bClass')){
    var b=d.createElement('button'); b.type='button'; b.className='tbtn'; b.id='bClass'; b.setAttribute('aria-label','لوحة الصف');
    b.innerHTML='<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">'+PATH.users+'</svg><span></span>';
    top.insertBefore(b,d.getElementById('bNote')||null); b.addEventListener('click',toggleDrawer);
  }
  var hm=d.getElementById('bHome'); if(hm&&!hm.__p){hm.__p=1; hm.addEventListener('click',function(e){e.preventDefault(); e.stopPropagation(); var l=LESSONS[host.id], m=l&&/^([a-z]+)(\d+)$/.exec(l.course); go(m?termHash(m[2],m[1],l.sem):'home')},true)}
  var fs=d.getElementById('bFs'); if(fs&&!fs.__p){fs.__p=1; fs.addEventListener('click',function(e){e.stopImmediatePropagation(); e.preventDefault(); hostFullscreen()},true)}
  if(!d.__p){d.__p=1; d.addEventListener('keydown',function(e){ if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(input|textarea|select)$/i.test((e.target&&e.target.tagName)||'')){e.stopImmediatePropagation(); e.preventDefault(); hostFullscreen()} },true)}
  updateClassBtn(); focusLesson();
}
function updateClassBtn(){
  if(!host.d) return; var b=host.d.getElementById('bClass'); if(!b) return;
  var v=ctx.classId?PL.sessionView(D(),ctx):null, n=v?v.totals.students-v.totals.unrecorded:0;
  b.querySelector('span').textContent='الصف'+(v&&n?' '+ar(n):''); b.style.outline=host.open?'2px solid var(--accent)':'';
}

   '<div id="dEmpty" class="empty hide"><p>ما أضفت شعبة بعد. أضف شعبتك مرة واحدة وتبقى جاهزة في كل درس.</p><button class="gbtn" type="button" data-act="newclass">'+ic('plus')+'إضافة شعبة</button><button class="sbtn" type="button" data-act="import">'+ic('up2')+'استيراد نسخة</button></div>'+
   '<div id="dBody" style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">'+

   '<div class="tools"><label class="sq">'+ic('search')+'<input id="dQ" type="search" placeholder="ابحث باسم الطالب" aria-label="بحث"></label><button class="ib" type="button" id="bRand" aria-label="اختر طالباً" title="اختر طالباً">'+ic('dice')+'</button></div>'+
   '<div class="slist" id="slist"></div><div class="dr-f"><button class="sbtn" type="button" id="bRest">لم يشارك لمن تبقّى</button></div></div></div></div>';

  $('#drawer').addEventListener('change',onDrawerChange);
  $('#dQ').addEventListener('input',function(e){host.query=e.target.value; renderList()});

function renderCtx(){
  var l=LESSONS[ctx.lesson]; $('#dLs').textContent=(l?ar(l.code):'')+(ctx.slide?' · شريحة '+ar(ctx.slide):''); $('#dLs').title=l?l.title:''; updateClassBtn();
}
function renderDrawer(){
  if(!$('#dClass')) buildDrawer();
  var d=D(), has=d.classes.length>0; $('#dEmpty').classList.toggle('hide',has); $('#dBody').style.display=has?'flex':'none'; $('#dClass').style.display=has?'':'none';
  $('#bEye').innerHTML=ic(d.ui.hideBehavior?'eyeoff':'eye'); $('#bEye').classList.toggle('on',d.ui.hideBehavior);
  if(!has){updateClassBtn(); return}
  if(!PL.findClass(d,ctx.classId)) ctx.classId=d.ui.lastClass&&PL.findClass(d,d.ui.lastClass)?d.ui.lastClass:d.classes[0].id;
  $('#dClass').innerHTML=d.classes.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===ctx.classId?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
  $('#dDate').value=ctx.date; $('#dDate').max=PL.todayISO(); $('#dPer').value=String(ctx.period||0);
  renderCtx(); renderList();
}
function renderList(){
  var d=D(), v=PL.sessionView(d,ctx); if(!v) return;
  $('#sPart').textContent=ar(v.totals.participating); $('#sSkip').textContent=ar(v.totals.didNot); $('#sRest').textContent=ar(v.totals.unrecorded);
  var rest=$('#bRest'); rest.disabled=!v.totals.unrecorded; rest.textContent=host.restAsk?'تأكيد: «لم يشارك» لـ '+ar(v.totals.unrecorded)+' طلاب':'لم يشارك لمن تبقّى'; rest.classList.toggle('on',!!host.restAsk);
  var q=PL.normAr(host.query), hide=d.ui.hideBehavior;
  var html=v.rows.map(function(r){
    var s=r.student; if(q&&PL.normAr(s.name).indexOf(q)<0) return '';
    var cls='stu'+(r.n>0?' has':(r.n===0?' zero':'')), cnt=r.n===null?'—':(r.n===0?'لا':ar(r.n));
    var recs=hide?'':r.recs.map(function(x){return '<button type="button" class="tag '+(x.kind==='positive'?'good':x.kind==='negative'?'bad':'')+'" data-rm="'+esc(x.id)+'" title="احذف التسجيل">'+esc(x.reason||x.note)+' ×</button>'}).join('');
    var rs='';
    if(host.openRow&&host.openRow.sid===s.id){
      var kind=host.openRow.kind;
      rs='<div class="rs">'+PL.REASONS[kind].map(function(t){return '<button type="button" data-sid="'+esc(s.id)+'" data-kind="'+kind+'" data-reason="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>'+
         '<div class="cust"><input type="text" maxlength="80" placeholder="سبب آخر" aria-label="سبب آخر" data-cust="'+esc(s.id)+'"><button type="button" class="sbtn mini" data-cust-ok="'+esc(s.id)+'" data-kind="'+kind+'">حفظ</button></div>';
    }
    return '<div class="'+cls+'" data-sid="'+esc(s.id)+'"><button class="nm" type="button" data-a="tap" aria-label="'+esc(s.name)+': شارك"><span class="nt"><span>'+esc(s.name)+'</span><span class="prev">قبل: '+ar(r.before.participated)+'/'+ar(r.before.recorded)+'</span></span><span class="cnt" title="'+(r.n===0?'لم يشارك':'')+'">'+cnt+'</span></button>'+
      '<div class="acts"><button type="button" data-a="minus" aria-label="تراجع">'+ic('minus')+'</button><button type="button" data-a="skip" aria-label="لم يشارك">'+ic('skip')+'</button><button class="pos" type="button" data-a="pos" aria-label="سلوك حسن">'+ic('up')+'</button><button class="neg dn" type="button" data-a="neg" aria-label="سلوك غير حسن">'+ic('up')+'</button></div>'+
      '<div class="recs">'+recs+'</div>'+rs+'</div>';
  }).join('');
  $('#slist').innerHTML=html||'<p class="hint" style="padding:12px">'+(q?'لا يوجد طالب بهذا الاسم.':'لا طلاب في هذه الشعبة.')+'</p>';
  updateClassBtn();
}
function sidOf(el){var r=el.closest('[data-sid]'); return r?r.getAttribute('data-sid'):''}
function onDrawerChange(e){
  var t=e.target, d=D();
  if(t.id==='dClass'){ ctx.classId=t.value; host.openRow=null; change(function(s){s.ui.lastClass=ctx.classId; PL.setLastLesson(s,ctx.classId,ctx.lesson)}); renderDrawer() }
  else if(t.id==='dDate'){ if(PL.validDate(t.value)&&t.value<=PL.todayISO()){ctx.date=t.value; host.openRow=null; renderList()} else {t.value=ctx.date; toast('اختر تاريخاً لا يتجاوز اليوم.')} }
  else if(t.id==='dPer'){ ctx.period=+t.value||0; host.openRow=null; renderList() }
}
function addRecord(sid,kind,reason){
  var r=null; change(function(s){r=PL.addRec(s,ctx,sid,kind,reason,'')}); host.openRow=null; if(!r) toast('تعذّر تسجيل الملاحظة.'); renderList();
}
function onDrawerClick(e){
  var b=e.target.closest('button'); if(!b) return; var pointer=e.detail>0;
  if(b.id==='bX'){toggleDrawer(); return}
  if(b.id==='bEye'){ change(function(s){s.ui.hideBehavior=!s.ui.hideBehavior}); renderDrawer(); toast(D().ui.hideBehavior?'تسجيلات السلوك مخفية عن الشاشة وتبقى محفوظة.':'تسجيلات السلوك ظاهرة.'); if(pointer) focusLesson(); return }
  if(b.id==='bRand'){ pickRandom(); return }
  if(b.id==='bRest'){
    if(!host.restAsk){ host.restAsk=1; renderList(); setTimeout(function(){ if(host.restAsk){host.restAsk=0; renderList()} },4000); return }
    var n=0; host.restAsk=0; change(function(s){n=PL.markRest(s,ctx)}); renderList(); toast('سُجّل «لم يشارك» لـ '+ar(n)+' من الطلاب.'); if(pointer) focusLesson(); return;
  }
  if(b.hasAttribute('data-rm')){
    var id=b.getAttribute('data-rm'), sess=PL.getSession(D(),ctx,false), rec=sess&&sess.recs.filter(function(x){return x.id===id})[0], sc=Object.assign({},ctx);
    if(rec){ var keep=JSON.parse(JSON.stringify(rec)); change(function(s){PL.delRec(s,sc,id)}); renderList(); toast('حُذف التسجيل.',function(){change(function(s){var ss=PL.getSession(s,sc,true); ss.recs.push(keep)}); renderList()}) }
    return;
  }
  if(b.hasAttribute('data-reason')){ addRecord(b.getAttribute('data-sid'),b.getAttribute('data-kind'),b.getAttribute('data-reason')); if(pointer) focusLesson(); return }
  if(b.hasAttribute('data-cust-ok')){ var sid=b.getAttribute('data-cust-ok'), inp=$('[data-cust="'+sid+'"]'); if(inp&&inp.value.trim()) addRecord(sid,b.getAttribute('data-kind'),inp.value); return }
  if(b.hasAttribute('data-act')){ return }
  var a=b.getAttribute('data-a'); if(!a) return; var sid2=sidOf(b); if(!sid2) return;
  var sess2=PL.getSession(D(),ctx,false), cur=sess2&&sess2.part[sid2]!==undefined?sess2.part[sid2]:null;
  if(a==='tap'){ change(function(s){PL.setPart(s,ctx,sid2,(cur||0)+1)}); host.openRow=null }
  else if(a==='minus'){ change(function(s){PL.setPart(s,ctx,sid2,cur>1?cur-1:null)}) }
  else if(a==='skip'){ change(function(s){PL.setPart(s,ctx,sid2,cur===0?null:0)}) }
  else if(a==='pos'||a==='neg'){ var kind=a==='pos'?'positive':'negative'; host.openRow=(host.openRow&&host.openRow.sid===sid2&&host.openRow.kind===kind)?null:{sid:sid2,kind:kind} }
  renderList(); if(pointer&&(a==='tap'||a==='minus'||a==='skip')) focusLesson();
}

/* "choose a student": a random one among those not recorded yet */
function pickRandom(){
  var v=PL.sessionView(D(),ctx); if(!v) return;
  var pool=v.rows.filter(function(r){return r.n===null}); if(!pool.length) pool=v.rows; if(!pool.length) return;
  var box=$('#pick'), who=$('#who'), t=0, target=pool[Math.floor(Math.random()*pool.length)], red=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  box.classList.remove('hide'); box.classList.add('rolling'); $('#pickBtns').classList.add('hide');
  (function step(){ t++; who.textContent=pool[Math.floor(Math.random()*pool.length)].student.name;
    if(t<(red?1:16)){ setTimeout(step,60+t*14) } else { who.textContent=target.student.name; box.classList.remove('rolling'); $('#pickBtns').classList.remove('hide'); box.setAttribute('data-who',target.student.id); $('#pickYes').focus() } })();
}
function bindPick(){
  $('#pickYes').addEventListener('click',function(){ var sid=$('#pick').getAttribute('data-who'), sess=PL.getSession(D(),ctx,false), cur=sess&&sess.part[sid]!==undefined?sess.part[sid]:null; change(function(s){PL.setPart(s,ctx,sid,(cur||0)+1)}); $('#pick').classList.add('hide'); renderList(); focusLesson() });
  $('#pickNo').addEventListener('click',pickRandom);
  $('#pickX').addEventListener('click',function(){$('#pick').classList.add('hide'); focusLesson()});
}

/* ---------- teacher's records: my classes, summary, student report ---------- */
function subHead(title,desc){return '<header><h1 class="h1">'+title+'</h1><p class="sub">'+desc+'</p></header><div class="seg2" role="tablist"><button class="pill" type="button" data-sub="classes">شعبي</button><button class="pill" type="button" data-sub="summary">ملخص الشعبة</button><button class="pill" type="button" data-sub="student">تقرير الطالب</button></div>'}
function noClassesCard(){return '<div class="glass empty"><b class="h2">لا توجد شعب بعد</b><p>أضف شعبتك بلصق أسماء الطلاب، أو استورد نسخة من موقع «الإدارة الصفية» القديم.</p><div class="row"><button class="gbtn" type="button" data-act="newclass">'+ic('plus')+'إضافة شعبة</button><button class="sbtn" type="button" data-act="import">'+ic('up2')+'استيراد نسخة</button></div></div>'}
/* download names are plain ASCII: Arabic names are lost by some browsers and file systems; the Arabic text is inside the file */
function slug(s){return PL.normAr(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'class'}
function dateAr(iso){return ar(String(iso).replace(/-/g,'/'))}
function lastDate(d,cid){var m=''; Object.keys(d.sessions).forEach(function(k){var s=d.sessions[k]; if(s.classId===cid&&s.date>m) m=s.date}); return m}
function classOptions(sel){return D().classes.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}

function renderClasses(){

  h+='<div class="cgrid">'+d.classes.map(function(c){
    var sum=PL.classSummary(d,c.id), last=lastDate(d,c.id), rate=sum.total.rate;

     '<div class="row"><button class="gbtn" type="button" data-sumof="'+esc(c.id)+'">ملخص الشعبة</button><button class="sbtn" type="button" data-start="'+esc(c.id)+'" data-per="0">'+ic('play')+'ابدأ حصة</button><button class="sbtn" type="button" data-editc="'+esc(c.id)+'" aria-label="تعديل الشعبة">'+ic('edit')+'تعديل</button></div></div>'}).join('')+
   '<div class="glass ccard add" role="button" tabindex="0" data-act="newclass">'+ic('plus')+'<b style="font:800 22px var(--font-display);color:var(--ink)">شعبة جديدة</b><span>الصق الأسماء سطراً سطراً</span></div></div>';
  var days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'], idx={}; d.classes.forEach(function(c,i){idx[c.id]=i%3});
  var tt='<div></div>'; for(var p=1;p<=8;p++) tt+='<div class="ph">ح'+ar(p)+'</div>';
