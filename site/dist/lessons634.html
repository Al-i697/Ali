          '<ul><li><b>في الكأس:</b> '+m.pass+'</li><li><b>على الورقة:</b> '+m.left+'</li></ul><p class="fwhy">'+m.why+'</p>';
        res.classList.remove('hide'); res.classList.add('pop');
        $r('#fAgain').classList.remove('hide'); busy=false;
        root.setAttribute('data-done',cur);
        if(onPour) onPour(cur,good);
      },4700);
    }
    $$r('.fchip').forEach(function(c){ c.addEventListener('click',function(){ if(busy) return; cur=c.getAttribute('data-m'); $$r('.fchip').forEach(function(x){ x.classList.toggle('on',x===c) }); reset() }) });
    $$r('.fp').forEach(function(b){ b.addEventListener('click',function(){ if(busy||poured) return; pred=b.getAttribute('data-p'); $$r('.fp').forEach(function(x){ x.classList.toggle('on',x===b) }) }) });
    $r('#fPour').addEventListener('click',pour);
    $r('#fAgain').addEventListener('click',function(){ if(busy) return; reset() });
    reset();
  }

  /* ================= put the steps in order (the closing activity) ================= */
  function orderHTML(steps,showOrder,intro){
    var cards=showOrder.map(function(i){ return '<button type="button" class="ocard" data-k="'+i+'"><span>'+steps[i]+'</span></button>' }).join('');
    var slots=steps.map(function(_,i){ return '<div class="oslot" data-n="'+i+'"><i>'+(i+1)+'</i><span class="ot"></span></div>' }).join('');
    return '<div class="ord"><div class="ocol"><div class="oh">'+(intro||'اضغط الخطوات بالترتيب الصحيح')+'</div><div class="ocards">'+cards+'</div></div><div class="ocol"><div class="oh">ترتيب العمل</div><div class="oslots">'+slots+'</div></div></div><div class="fb ofb"></div>';
  }
  function bindOrder(root,steps,onDone){
    var next=0, fb=root.querySelector('.ofb');
    Array.prototype.forEach.call(root.querySelectorAll('.ocard'),function(c){
      c.addEventListener('click',function(){
        if(c.classList.contains('used')) return;
        var k=+c.getAttribute('data-k');
        if(k===next){
          c.classList.add('used'); var sl=root.querySelector('.oslot[data-n="'+next+'"]'); sl.classList.add('on'); sl.querySelector('.ot').textContent=steps[k]; next++;
          say(fb,next<steps.length?'✓ أحسنت، ما الخطوة التي بعدها؟':'✓ ممتاز! هذه هي الطريقة كاملة','ok');
          if(next===steps.length&&onDone) onDone();
        }else{ c.classList.add('bad-b','shake'); setTimeout(function(){ c.classList.remove('bad-b','shake') },420); say(fb,'فكّر: ماذا نفعل أولاً قبل هذه الخطوة؟','bad') }
      });
    });
  }

  /* ================= label the diagram: tap a name, then tap its number on the picture =================
     items: [{t:'name', x:'42%', y:'30%', tx:'50%', ty:'30%'}]  (x,y = the number's spot; tx,ty = where the name appears once it is right; all as % of the picture box) */
  function labelHTML(svg,items,hint){
    var mk=items.map(function(l,i){ return '<button type="button" class="lmk" data-k="'+i+'" style="left:'+l.x+';top:'+l.y+'" aria-label="الرقم '+(i+1)+'">'+(i+1)+'</button><span class="ltxt" data-k="'+i+'" style="left:'+l.tx+';top:'+l.ty+'">'+l.t+'</span>' }).join('');
    return '<div class="lbl"><div class="lsvg"><div class="lwrap">'+svg+mk+'</div></div><div class="lside"><div class="oh">'+(hint||'اضغط الاسم ثم اضغط رقمه على الرسم')+'</div><div class="lchips">'+
      items.map(function(l,i){ return '<button type="button" class="lchip" data-k="'+i+'">'+l.t+'</button>' }).join('')+'</div><div class="fb lfb"></div></div></div>';
  }
  function bindLabel(root,items,onDone){
    var sel=null, got=0, fb=root.querySelector('.lfb');
    var chips=Array.prototype.slice.call(root.querySelectorAll('.lchip'));
    chips.forEach(function(c){ c.addEventListener('click',function(){ if(c.classList.contains('used')) return; chips.forEach(function(x){ x.classList.remove('sel') }); sel=c; c.classList.add('sel') }) });
    Array.prototype.forEach.call(root.querySelectorAll('.lmk'),function(m){
      m.addEventListener('click',function(){
        if(m.classList.contains('done')) return;
        if(!sel){ say(fb,'اختر اسماً أولاً','bad'); return }
        var k=+m.getAttribute('data-k');
        if(+sel.getAttribute('data-k')===k){
          m.classList.add('done'); sel.classList.add('used'); sel.classList.remove('sel');
          var t=root.querySelector('.ltxt[data-k="'+k+'"]'); if(t) t.classList.add('on'); sel=null; got++;
          say(fb,got<items.length?'✓ صحيح':'✓ ممتاز! سمّيت كل الأجزاء','ok'); if(got===items.length&&onDone) onDone();
        }else{ m.classList.add('shake'); setTimeout(function(){ m.classList.remove('shake') },420); say(fb,'ليس هذا الرقم، حاول مرة أخرى','bad') }
      });
    });
  }

  /* ================= a printable worksheet (one A4 page), opened from a button in the lesson index =================
     S6.worksheet({btn:'…', title:'…', sub:'…', cols:['…'], rows:[['…']], blocks:[{h:'…', n:3}], figure:'<svg…>'}) — black-and-white friendly; «طباعة» prints only the sheet. */
  function worksheet(o){
    var _b=boot;
    boot=function(){
      _b.apply(this,arguments);
      var sh=document.querySelector('#idx .sheet'), h3=sh&&sh.querySelector('h3');
      if(h3){
        h3.insertAdjacentHTML('afterend','<button class="wsbtn" id="bWs" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>'+o.btn+'</button>');
        document.getElementById('bWs').addEventListener('click',function(){ var ix=document.getElementById('idx'); if(ix) ix.classList.remove('open'); open() });
      }
    };
    function html(){
      var th=o.cols.map(function(c){ return '<th>'+c+'</th>' }).join('');
      var tr=o.rows.map(function(r){ return '<tr>'+r.map(function(c,i){ return '<td'+(i===0?' class="w1"':'')+'>'+c+'</td>' }).join('')+'</tr>' }).join('');
      var bl=o.blocks.map(function(b){ var ln=''; for(var i=0;i<b.n;i++) ln+='<div class="wl"></div>'; return '<div class="wb"><b>'+b.h+'</b>'+ln+'</div>' }).join('');
      return '<div class="wsbox"><header><div><div class="wh1">'+o.title+'</div><div class="wh2">'+o.sub+'</div></div><div class="wfig">'+(o.figure||'')+'</div></header>'+
        '<div class="wname">الاسم: ............................................ الصف والشعبة: ................</div>'+
        '<table class="wt"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table>'+bl+'</div>';
    }
    function open(){
      var ov=document.getElementById('wsov');
      if(!ov){
        ov=document.createElement('div'); ov.id='wsov'; ov.className='wsov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label',o.title);
        ov.innerHTML='<div class="wsbar"><button type="button" class="wprint">طباعة</button><button type="button" class="wclose">إغلاق</button></div><div class="wsheet"></div>';
        document.body.appendChild(ov);
        ov.querySelector('.wclose').addEventListener('click',close);
        ov.querySelector('.wprint').addEventListener('click',function(){ try{ window.print() }catch(e){} });
        ov.addEventListener('click',function(e){ if(e.target===ov) close() });
        document.addEventListener('keydown',function(e){ if(e.key==='Escape') close() });
      }
      ov.querySelector('.wsheet').innerHTML=html(); ov.classList.add('on'); document.documentElement.classList.add('ws-open');
    }
    function close(){ var ov=document.getElementById('wsov'); if(ov) ov.classList.remove('on'); document.documentElement.classList.remove('ws-open') }
    return {open:open,close:close,html:html};
  }
  return {worksheet:worksheet,INK:INK,cloud:cloud,nbox:nbox,sticky:sticky,down:down,fig:fig,shuf:shuf,FLAB:FLAB,flabHTML:flabHTML,bindFlab:bindFlab,orderHTML:orderHTML,bindOrder:bindOrder,labelHTML:labelHTML,bindLabel:bindLabel};
})();

/* ---------- the page of the book next to every activity, exercise, example or question taken from the books (teacher's request, November 2026).
   A small badge above the slide's title: «كتاب الطالب ص61» or «كتاب النشاط ص38–39».
   Each lesson lists its slides in src/pages.js:  var BOOKPG={ slideId:'كتاب الطالب ص61', ... };
   Slides of our own (explanations from the teacher's deck, exit tickets) carry none.  The numbers are checked against the books, never copied from a note.
   Pages are written with Western digits (one numeral style); bdi keeps "38–39" in reading order inside the Arabic line. ---------- */
(function(){
  var ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z"/></svg>';
  var _s=slide;
  slide=function(o){
    var oi=o.init;
    o.init=function(el){
      var pg=(typeof BOOKPG!=='undefined')&&BOOKPG[o.id];
      if(pg){ var hd=el.querySelector('.hd'); if(hd&&!hd.querySelector('.pgb')){ var b=document.createElement('span'); b.className='pgb'; b.setAttribute('data-pg',pg); b.innerHTML=ICON+pg.replace(/(\d+(?:–\d+)?)/g,'<bdi dir="ltr">$1</bdi>'); hd.appendChild(b) } }
      if(oi) return oi.apply(this,arguments);
    };
    _s(o);
  };
})();

/* ---------- shared "definition" card and "how to" strip (teacher's request, November 2026).
   A definition used to be one more sentence inside an ordinary panel, often in the same paragraph as the instructions for using it.
   Now it is its own card: a gold «تعريف» tag, the term in Arabic and English, and the book's wording on its own line; the steps for using it sit in a separate numbered strip.
     dfcHTML({t:'المُول', en:'Mole', h:'كمية من مادة …', sm:true})       -> definition card (sm: a smaller card for crowded slides)
     howHTML('طريقة الحساب', ['اعدّ الذرات','اضرب في Ar','اجمع'])          -> numbered steps, one chip per step
   Three more cards of the same family (teacher's request: one look for each kind of content), each with its own colour and tag:
     lawHTML({t:'قانون المول', eq:'n = m ÷ M<sub>r</sub>', h:'…', sm:true})   -> «قانون» (blue): the title, the equation large and on its own line, a line of explanation. body:'<html>' replaces eq+h (used where the equation is filled in by a click)
     warnHTML({t:'انتبه إلى الوحدات', h:'…'})                              -> «انتبه» (orange): a common slip; eq:'…' adds a large equation line
     remHTML({t:'…', items:['…','…']})                                 -> «تذكّر» (violet): a reminder, as one sentence (h) or a short list (items)
   The wording of a definition is the book's (student book «مصطلحات علمية» boxes, activity-book glossary), not ours; the page goes in BOOKPG. ---------- */
function dfcHTML(o){
  return '<div class="dfc'+(o.sm?' sm':'')+(o.cls?' '+o.cls:'')+'"><div class="dh"><span class="dt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>تعريف</span>'+
    '<b class="dn">'+o.t+'</b>'+(o.en?'<i class="de" dir="ltr">'+o.en+'</i>':'')+'</div><p class="dx">'+o.h+'</p></div>';
}
function howHTML(label,steps,cls){
  return '<div class="how'+(cls?' '+cls:'')+'"><span class="hl">'+label+'</span>'+steps.map(function(s,i){return '<span class="hs"><i class="num">'+(i+1)+'</i><span class="ht">'+s+'</span></span>'+(i<steps.length-1?'<span class="ha" aria-hidden="true">◀</span>':'')}).join('')+'</div>';
}
var CARD_TAGS={
  law:['قانون','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>'],
  warn:['انتبه','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.8 20h18.4zM12 10v4.5M12 17.4v.1"/></svg>'],
  rem:['تذكّر','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.6L7 20z"/></svg>']
};
function cardHTML(kind,o){
  var tg=CARD_TAGS[kind], inner=o.body||((o.eq?'<div class="eqx" dir="ltr">'+o.eq+'</div>':'')+(o.items?'<ul class="dx">'+o.items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':(o.h?'<p class="dx">'+o.h+'</p>':'')));
  return '<div class="dfc '+kind+(o.xs?' xs':(o.sm?' sm':''))+(o.cls?' '+o.cls:'')+'"'+(o.id?' id="'+o.id+'"':'')+'><div class="dh"><span class="dt">'+tg[1]+tg[0]+'</span>'+(o.t?'<b class="dn">'+o.t+'</b>':'')+'</div>'+inner+'</div>';
}
function lawHTML(o){ return cardHTML('law',o) }
function warnHTML(o){ return cardHTML('warn',o) }
function remHTML(o){ return cardHTML('rem',o) }

/* the kind of every slide, shown with one fixed colour and one fixed word (teacher's request, November 2026):
   تمهيد (lead-in) · شرح (explanation) · مثال (worked example) · نشاط (activity or lab) · تدريب (questions to answer) · امتحان (past exams) · تذكرة خروج · الواجب.
   Where it shows: a pill above the title (opposite corner to the page badge), a coloured line under each segment of the progress bar,
   the word in the footer, and a colour key plus a small tag on every row of the lesson index.
   The kind is worked out from the slide's id, title and tag; a lesson can override any slide with  var KINDS={slideId:'act',...}  in src/pages.js.
   Shared by every lesson: build(..., kinds=True) in _core/tools/u4build.py adds this file and u4/kinds.css. */
(function(){
  var K={
    intro:['تمهيد'],
    learn:['شرح'],
    ex:['مثال'],
    act:['نشاط'],
    ask:['تدريب'],
    exam:['امتحان'],
    exit:['تذكرة خروج'],
    hw:['الواجب']
  };
  var ORDER=['intro','learn','ex','act','ask','exam','exit','hw'];
  /* suggested minutes for a slide of each kind (used in the teacher notes) */
  var MIN={intro:3,learn:4,ex:6,act:10,ask:6,exam:6,exit:3,hw:1};
  function kindOf(o){
    var id=o.id||'', t=o.title||'', tg=o.tag||'';
    if(typeof KINDS!=='undefined'&&KINDS[id]) return KINDS[id];
    if(id==='goals') return 'intro';
    if(id==='hw') return 'hw';
    if(/^(tk\d*|final)$/.test(id)||/^تذكرة/.test(t)) return 'exit';
    if(/^(past|exq|noo)/.test(id)||/امتحان/.test(t)||/امتحان/.test(tg)) return 'exam';
    if(/^lab/.test(id)||/^(نشاط|المختبر)/.test(t)||/سباق|مسابقة/.test(t+' '+tg)) return 'act';
    if(/^مثال/.test(t)) return 'ex';
    if(/^(سؤال|أسئلة|السؤال|السؤالان|تمرين|ورقة العمل|كتاب النشاط|كتاب الطالب)/.test(t)||/^eou/.test(id)) return 'ask';
    return o.ch===0?'intro':'learn';
  }
  var _s=slide;
  slide=function(o){
    var k=kindOf(o); o.kind=k;
    var oi=o.init;
    o.init=function(el){
      var hd=el.querySelector('.hd');
      if(hd&&!hd.querySelector('.kd')){
        var b=document.createElement('span'); b.className='kd'; b.setAttribute('data-k',k); b.setAttribute('data-kd',K[k][0]);
        b.innerHTML='<i></i><span>'+K[k][0]+'</span>'; hd.appendChild(b);
      }
      if(oi) return oi.apply(this,arguments);
    };
    _s(o);
  };
  /* the bar, the footer and the index (built by boot) */
  var _boot=boot;
  boot=function(){
    _boot.apply(this,arguments);
    $$('.seg',PROG).forEach(function(b,j){ var s=SLIDES[j]; if(s&&s.kind){ b.setAttribute('data-k',s.kind); b.title=(s.title||'الغلاف')+' · '+K[s.kind][0] } });
    var sh=$('.sheet',IDX);
    if(sh){
      var used={}; SLIDES.forEach(function(s){ if(s.kind) used[s.kind]=1 });
      var key='<div class="kkey" aria-label="ألوان أنواع الشرائح">'+ORDER.filter(function(k){return used[k]}).map(function(k){return '<span data-k="'+k+'"><i></i>'+K[k][0]+'</span>'}).join('')+'</div>';
      var tot=0; SLIDES.forEach(function(s){ if(s.kind) tot+=MIN[s.kind]||0 });
      key+='<p class="ktot">الزمن المقترح للدرس كاملاً نحو <b>'+ar(tot)+'</b> دقيقة (تقريبي، يكفي أكثر من حصة: اختر منه ما يناسب حصتك).</p>';
      var h3=$('h3',sh); if(h3) h3.insertAdjacentHTML('afterend',key);
      $$('.it',sh).forEach(function(b){ var s=SLIDES[+b.getAttribute('data-i')]; if(s&&s.kind){ b.setAttribute('data-k',s.kind); b.insertAdjacentHTML('beforeend','<b class="kl">'+K[s.kind][0]+'</b>') } });
    }
    paintChrome();
  };
  var _pc=paintChrome;
  paintChrome=function(){
    _pc.apply(this,arguments);
    var s=SLIDES[CUR], sm=WHERE&&WHERE.querySelector('small');
    if(s&&s.kind&&sm&&!/^\s*(تمهيد|شرح|مثال|نشاط|تدريب|امتحان|تذكرة خروج|الواجب) ·/.test(sm.textContent)) sm.textContent=K[s.kind][0]+' · '+sm.textContent;
    /* the suggested time for a slide of this kind, at the top of the teacher note (a rough guide, ours: «من عندي») */
    var h4=NOTE&&NOTE.querySelector('h4'); if(s&&s.kind&&h4&&!NOTE.querySelector('.tmin')) h4.insertAdjacentHTML('afterend','<p class="tmin">⏱ الزمن المقترح: <b>'+mins(MIN[s.kind])+'</b> <small>(تقريبي)</small></p>');
  };
  function mins(m){ return m===1?'دقيقة':(m===2?'دقيقتان':ar(m)+(m<=10?' دقائق':' دقيقة')) }
  window.SLIDEKIND={K:K,ORDER:ORDER,MIN:MIN,of:kindOf};
})();

/* The student's one-page summary of the lesson, printable (teacher's request, November 2026).
   A «ملخص الطالب للطباعة» button in the lesson index (or the key S) opens the page; «طباعة» prints it on one A4 sheet.
   Nothing is written twice: the page is assembled from what the lesson already says —
     the goals (the goals slide), the lesson's own summary bullets («خلاصة الدرس» on the last slide), the definition / law / warning / reminder cards of the slides,
     the homework (last slide) and the pages of the books used (BOOKPG).
   Laws that appear only as a clickable triangle (no static card) are listed in src/pages.js:  var SUMLAWS=[['قانون المول','n = m ÷ M','…'],…]
   Shared by every lesson: build(..., summary=True) in _core/tools/u4build.py adds this file and u4/summary.css (it needs book=True for the cards). */
(function(){
  function parse(s){ var t=document.createElement('div'); try{ t.innerHTML=(typeof s.html==='function')?s.html():'' }catch(e){} return t }
  function clean(h){ return h.replace(/\sstyle="[^"]*"/g,'').replace(/\sclass="(ptn|num|fx[^"]*)"/g,'').replace(/<(button|span class="ck")[^>]*>/g,'').replace(/<\/button>/g,'') }
  function cardsOf(root,kind){
    var out=[]; root.querySelectorAll('.dfc.'+kind).forEach(function(c){
      var n=c.querySelector('.dn'), en=c.querySelector('.de'), eq=c.querySelector('.eqx'), xs=c.querySelectorAll('.dx'), tag=c.querySelector('.dt');
      if(!n&&!eq&&!xs.length) return;
      var items=[]; xs.forEach(function(x){ if(x.tagName==='UL') x.querySelectorAll('li').forEach(function(l){items.push(l.innerHTML)}); else items.push(x.innerHTML.replace(/<span class="eg">[\s\S]*?<\/span>/g,'')) });
      if(kind==='law'&&!eq&&!items.length) return;
      if(items.length===1&&/^\s*؟?\s*$/.test(items[0].replace(/<[^>]+>/g,''))) return;
      out.push({t:n?n.innerHTML:'',en:en?en.textContent:'',eq:eq?eq.innerHTML:'',items:items,tag:tag?tag.textContent.trim():''});
    });
    return out;
  }
  function collect(){
    var D={goals:[],bul:[],defs:[],laws:[],warn:[],rem:[],hw:[],pages:{sb:[],ab:[]}}, seen={};
    SLIDES.forEach(function(s){
      var r=parse(s), id=s.id;
      if(id==='goals') r.querySelectorAll('.gi').forEach(function(g){ var sp=g.querySelectorAll('span'); D.goals.push(clean((sp[sp.length-1]||g).innerHTML)) });
      if(id==='hw'){
        var pl=r.querySelectorAll('.panel'); if(pl[0]) pl[0].querySelectorAll('li').forEach(function(l){ D.bul.push(clean(l.innerHTML)) });
        r.querySelectorAll('.stp').forEach(function(p){ var sp=p.querySelectorAll('span'); D.hw.push(clean((sp[sp.length-1]||p).innerHTML)) });
      }
      [['def','defs'],['law','laws'],['warn','warn'],['rem','rem']].forEach(function(k){
        var cs=(k[0]==='def')?cardsOf(r,'dfc').filter(function(c){return c.tag==='تعريف'}):cardsOf(r,k[0]);
        cs.forEach(function(c){ var key=k[0]+'|'+c.t+'|'+c.eq+'|'+c.items.join('|'); if(!seen[key]){ seen[key]=1; D[k[1]].push(c) } });
      });
    });
    if(typeof SUMLAWS!=='undefined') SUMLAWS.forEach(function(l){ D.laws.push({t:l[0],en:'',eq:l[1],items:l[2]?[l[2]]:[],tag:'قانون'}) });
    if(typeof BOOKPG!=='undefined'){
      var set={sb:{},ab:{}};
      Object.keys(BOOKPG).forEach(function(k){
        var m=/(الطالب|النشاط)\s*ص\s*(\d+)(?:\s*[–-]\s*(\d+))?/.exec(BOOKPG[k].replace(/<[^>]+>/g,'')); if(!m) return;
        var t=set[m[1]==='الطالب'?'sb':'ab'], a=+m[2], b=+(m[3]||m[2]); for(var i=a;i<=b;i++) t[i]=1;
      });
      /* the pages used, merged into ranges: 62, 63, 64, 65 -> 62–65 */
      ['sb','ab'].forEach(function(w){
        var ps=Object.keys(set[w]).map(Number).sort(function(x,y){return x-y}), out=[], i=0;
        while(i<ps.length){ var j=i; while(j+1<ps.length&&ps[j+1]===ps[j]+1) j++; out.push(ps[i]===ps[j]?String(ps[i]):ps[i]+'–'+ps[j]); i=j+1 }
        D.pages[w]=out;
      });
    }
    return D;
  }
  function sec(title,cls,inner){ return inner?'<section class="ss '+cls+'"><h3>'+title+'</h3>'+inner+'</section>':'' }

/* ---------- teacher tools in the player (teacher's request, November 2026): pen, highlighter, eraser, laser pointer, timer, blank screen.
   The «أدوات» button in the top bar opens a small dock on the left edge of the slide; every tool also has a key (physical keys, so the Arabic layout works too):
     P pen · H highlighter · E eraser · L laser · T timer · B blank screen · C clear the slide's drawing · Ctrl+Z undo · Esc leave the tool
   Drawings belong to the slide they were made on (kept in memory until the page is closed) and are stored in stage coordinates (1280×720), so they scale with the stage.
   While the pen, highlighter or eraser is on, the slide itself is not clickable; press Esc or the same tool again to go back to the slide. The laser and the timer never block the slide. ---------- */
var TOOLS=(function(){
  var COLS=['#FFD54A','#FF5A4E','#4DD0FF','#6BE58A','#FFFFFF'], COLN=['أصفر','أحمر','أزرق','أخضر','أبيض'];
  var S={tool:'',col:0,open:false}, strokes={}, undone={}, cv,cx,dock,dot,tmr,blank,toast,btn, cur=0, live=null, tt=0;
  var T={total:180,left:180,end:0,iv:0,run:false,over:false};
  var NAMES={pen:'القلم',hl:'التظليل',er:'الممحاة',laser:'المؤشر الليزري'};
  var IC={
    pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
    hl:'<path d="M9 15l7.5-7.5 3 3L12 18H9z"/><path d="M5 21h7"/>',
    er:'<path d="M7 18l-3-3 9.5-9.5 6 6L12 18z"/><path d="M12 18h8"/>',
    laser:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
    undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/>',
    clear:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
    timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.6 2M9 3h6"/>',
    blank:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
    tools:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>'
  };

  function el(h){var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild}
  function pad(n){return (n<10?'0':'')+n}

  /* ----- drawing ----- */
  function list(){return strokes[cur]||(strokes[cur]=[])}

    all.forEach(function(s){
      if(!s.p.length) return;
      cx.save(); cx.lineCap='round'; cx.lineJoin='round'; cx.strokeStyle=s.c; cx.lineWidth=s.w; cx.globalAlpha=s.h?0.38:1;

  }
  function pt(e){var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*1280/r.width,(e.clientY-r.top)*720/r.height]}
  function down(e){
    if(!S.tool||S.tool==='laser'||e.button>0) return;
    e.preventDefault(); try{cv.setPointerCapture(e.pointerId)}catch(x){}
    var p=pt(e);
    if(S.tool==='er'){ live={er:true}; erase(p); return }
    live={c:COLS[S.col],w:S.tool==='hl'?30:5,h:S.tool==='hl',p:[p]}; paint();
  }
  function move(e){
    if(!live) return;
    var p=pt(e);
    if(live.er){ erase(p); return }

  function up(){

  /* ----- tools on / off ----- */
  function setTool(t){

    dock.querySelector('[data-t="timer"]').classList.toggle('act',!tmr.hidden);
    dock.querySelectorAll('.sw').forEach(function(s,i){s.classList.toggle('act',i===S.col)});
  }

  /* ----- laser ----- */
  function laserMove(e){
    if(S.tool!=='laser') return;
    var r=dot.parentNode.getBoundingClientRect();
    dot.style.transform='translate('+(e.clientX-r.left)+'px,'+(e.clientY-r.top)+'px)'; dot.classList.add('on');
  }

  /* ----- timer ----- */
  function showT(){
    var m=Math.floor(T.left/60), s=T.left%60;
    tmr.querySelector('.tt').textContent=pad(m)+':'+pad(s);
    tmr.classList.toggle('low',T.left<=10&&T.left>0&&T.run); tmr.classList.toggle('over',T.over);
    tmr.querySelector('[data-a="go"]').innerHTML=svgPlay(T.run);
    tmr.querySelector('.tl').textContent=T.over?'انتهى الوقت':(T.run?'جارٍ العدّ':'المؤقت');
  }
  function svgPlay(run){return run?'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'}
  function tick(){
    var left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
    if(left!==T.left){ T.left=left; showT() }
    if(left<=0){ stopT(); T.over=true; showT(); beep() }
  }
  function startT(){
    if(T.left<=0){ T.left=T.total } T.over=false; T.end=Date.now()+T.left*1000; T.run=true; clearInterval(T.iv); T.iv=setInterval(tick,200); showT();
  }
  function stopT(){ T.run=false; clearInterval(T.iv); showT() }
  function setT(sec){ stopT(); T.total=T.left=sec; T.over=false; showT() }
  function beep(){
    try{
      var A=window.AudioContext||window.webkitAudioContext; if(!A) return; var c=new A();
      [0,0.38,0.76].forEach(function(d){var o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.0001,c.currentTime+d); g.gain.exponentialRampToValueAtTime(0.35,c.currentTime+d+0.03); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d+0.3); o.start(c.currentTime+d); o.stop(c.currentTime+d+0.32)});
      setTimeout(function(){try{c.close()}catch(x){}},1600);
    }catch(x){}
  }
  function toggleTimer(){
    tmr.hidden=!tmr.hidden; if(tmr.hidden){ stopT() } else { showT(); if(!S.open) openDock(true) }

  function dragTimer(e){
    if(e.target.closest('button')) return;

  function setBlank(on){ blank.hidden=!on; document.body.classList.toggle('tl-blank',on) }

  /* ----- keys: physical keys, in the capture phase so the player's own handler does not also act on them ----- */
  function key(e){

/* one numeral style on the slides: Western digits (as in the answer boxes, the formulas and the student book). The slide sources and the
   feedback lines still contain Arabic-Indic digits in many places, so every text node that appears inside the stage is converted as it arrives,
   together with the Arabic decimal point, thousands comma and percent sign that go with those digits (1٫5 -> 1.5, ٢٥٪ -> 25%).
   The player's own bar and the teacher notes (outside the stage) keep their style. Teacher's request: "الأرقام لازم متماثلة".
   Shared by every lesson: build(..., digits=True) in _core/tools/u4build.py adds this file. */
(function(){
  var RE=/[٠-٩٪٫٬]/;
  function conv(s){
    return s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632})
            .replace(/(\d)٫(?=\d)/g,'$1.').replace(/(\d)٬(?=\d)/g,'$1,').replace(/٪/g,'%')
  }
  function fix(n){
    if(n.nodeType===3){ if(RE.test(n.nodeValue)) n.nodeValue=conv(n.nodeValue); return }
    if(n.nodeType!==1) return;
    var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT), t;
    while((t=w.nextNode())){ if(RE.test(t.nodeValue)) t.nodeValue=conv(t.nodeValue) }
  }
  function start(){
    var st=document.getElementById('stage'); if(!st){ setTimeout(start,50); return }
    fix(st);
    new MutationObserver(function(ms){ ms.forEach(function(m){ if(m.type==='characterData') fix(m.target); else Array.prototype.forEach.call(m.addedNodes,fix) }) })
      .observe(st,{childList:true,characterData:true,subtree:true});
  }
  start();
})();


})();
