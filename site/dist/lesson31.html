/* ---- drag & drop (pointer events; works with mouse, pen and touch whiteboards) ---- */
function drag(item,o){
  var sx=0, sy=0, moved=false, S=1, hot=null;
  function zoneAt(e){
    item.style.pointerEvents='none';
    var el=document.elementFromPoint(e.clientX,e.clientY);
    item.style.pointerEvents='';
    return el&&el.closest?el.closest(o.zone):null;
  }
  item.addEventListener('pointerdown',function(e){
    if(e.button>0||item.classList.contains('locked')) return;
    e.preventDefault();
    try{item.setPointerCapture(e.pointerId)}catch(x){}
    S=stageScale(); sx=e.clientX; sy=e.clientY; moved=false;
    item.classList.remove('back'); item.classList.add('drag');
  });
  item.addEventListener('pointermove',function(e){
    if(!item.classList.contains('drag')) return;
    var dx=(e.clientX-sx)/S, dy=(e.clientY-sy)/S;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    item.style.transform='translate('+dx+'px,'+dy+'px)';
    var z=zoneAt(e); if(z!==hot){ if(hot) hot.classList.remove('hot'); hot=z; if(hot) hot.classList.add('hot') }
  });
  function end(e){
    if(!item.classList.contains('drag')) return;
    item.classList.remove('drag');
    var z=moved?zoneAt(e):null;
    if(hot){hot.classList.remove('hot'); hot=null}
    if(!moved){ item.style.transform=''; if(o.tap) o.tap(item); return }
    var ok=false;
    if(z&&o.drop) ok=o.drop(item,z);
    if(ok){item.style.transform=''}
    else{item.classList.add('back'); item.style.transform=''; later(function(){item.classList.remove('back')},300)}
  }
  item.addEventListener('pointerup',end);
  item.addEventListener('pointercancel',end);
}

/* ---- ticket: a few quick questions, one at a time, with a score ---- */
function ticketHTML(items){
  return '<div class="tk"><div class="tkbar"><div class="rounds">'+items.map(function(_,i){return '<span class="rd">'+ar(i+1)+'</span>'}).join('')+'</div><span class="sm muted">سؤال واحد في كل مرة</span></div>'+

      return '<div class="tq" data-i="'+i+'"><h4><i>'+ar(i+1)+'</i><span>'+it.q+'</span></h4>'+body+'<div class="fb"></div></div>';
    }).join('')+
    '<div><button class="btn acc hide" type="button" id="tkn">السؤال التالي ▸</button></div>'+
    '<div class="score hide"><span>نتيجتك</span><b class="num"></b><span class="msg"></span></div></div>';
}
function bindTicket(el,items,key){
  var got=0, idx=0, qs=$$('.tq',el), rds=$$('.rd',el), nb=$('#tkn',el);
  function show(i){
    idx=i; qs.forEach(function(q,j){q.classList.toggle('cur',j===i)});
    rds.forEach(function(r,j){r.className='rd'+(j<i?' done':(j===i?' cur':''))});
    nb.classList.add('hide');
  }
  function finish(first){
    if(first) got++;
    SC[key]={got:got,total:items.length};
    if(idx<items.length-1){ nb.textContent='السؤال التالي ▸'; nb.classList.remove('hide'); nb.classList.add('pop') }
    else { nb.textContent='اعرض النتيجة ▸'; nb.classList.remove('hide'); nb.classList.add('pop') }
  }
  nb.addEventListener('click',function(){
    if(idx<items.length-1){ show(idx+1) }
    else{
      qs.forEach(function(q){q.classList.remove('cur')}); nb.classList.add('hide'); rds.forEach(function(r){r.className='rd done'});
      var s=$('.score',el); s.classList.remove('hide'); s.classList.add('pop');
      $('b',s).textContent=got+' / '+items.length;
      $('.msg',s).textContent = got===items.length?'ممتاز! الفكرة واضحة 🎉':(got>=items.length-1?'قريب جداً 👏':'نراجع النقاط اللي أخطأنا فيها 💪');
    }
  });
  qs.forEach(function(q,i){
    var it=items[i], fb=$('.fb',q);
    if(it.type==='num'){
      bindNum($('.nin',q),it.ans,it.tol||0.01,function(ok,v,tries){
        if(ok){say(fb,'✓ '+(it.why||'صح'),'ok'); finish(tries===0)}
        else say(fb,it.hint||'راجع الحساب وحاول مرة ثانية','bad');
      });
    }else bindMcq(q,it.opts,fb,finish);
  });
  show(0);
}

/* ---- sphere helpers for SVG models ---- */
var ELC={P:['#E8A33D','#3a2300'],K:['#C9A6EE','#2a0e4a'],H:['#F2F5F5','#243b3f'],C:['#3A3F45','#fff'],N:['#3F6FD8','#fff'],O:['#E0453A','#fff'],Cl:['#5CBF4A','#06290f'],Br:['#9B4A2F','#fff'],F:['#8ED26B','#10300a'],I:['#7B4FA3','#fff'],Na:['#A878E0','#1e0a3a'],Si:['#8E959C','#fff'],B:['#E9A4A0','#40100c'],Al:['#9FB4C7','#0b1e30'],Mg:['#6FA8E4','#06223d'],He:['#F5A93A','#4a2a00']};
var GR={H:1,C:1,N:1,O:1,Cl:1,Br:1,F:1,I:1,Na:1,Si:1,B:1,Al:1,Mg:1,He:1,P:1,K:1};
function sph(x,y,r,sym,o){
  o=o||{}; var c=ELC[sym]||['#ccc','#000'], fs=o.fs||Math.max(14,r*.9);
  return '<g class="sph" data-el="'+sym+'" '+(o.id?'data-id="'+o.id+'" ':'')+'><circle class="s" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(GR[sym]?'url(#g'+sym+')':c[0])+'" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>'+(o.label===false?'':'<text direction="ltr" x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-family="Baloo Bhaijaan 2,Tajawal,sans-serif" font-weight="800" font-size="'+fs+'" fill="'+c[1]+'" style="pointer-events:none">'+(o.text||sym)+'</text>')+'</g>';
}
function bond(x1,y1,x2,y2,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#9aa9ac" stroke-width="'+(w||9)+'" stroke-linecap="round"/>'}

/* ---- navigation ---- */
var APP, STAGE, VIEW, NOTE, IDX, PROG, BTN_N, BTN_P, WHERE;
function build(i){
  var s=SLIDES[i]; if(s.el) return s.el;
  var el=document.createElement('section'); el.className='slide'; el.setAttribute('data-id',s.id); el.setAttribute('data-pal',PALID[s.id]||PALCH[s.ch]||'emerald');
  var head = s.bare ? '' : '<div class="hd"><span class="chip">'+CHAPTERS[s.ch]+'</span><h2>'+s.title+'</h2>'+(s.tag?'<span class="tag"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'+s.tag+'</span>':'')+'</div>';
  el.innerHTML=head+(s.bare?s.html():'<div class="body">'+s.html()+'</div>');
  if(s.cls) el.classList.add(s.cls);
  if(typeof STK!=='undefined'&&LESSON.stk) STK.deco(el,LESSON.stk[s.id]);
  STAGE.appendChild(el); s.el=el;
  if(LESSON.pts&&LESSON.pts[s.id]){ s.pts=$$(LESSON.pts[s.id],el); s.pn=s.pts.length; s.pts.forEach(function(e){e.classList.add('ptn')}) }
  if(s.init) s.init(el,s);
  if(typeof SKIN!=='undefined') SKIN.slide(el);   /* after init, so text that init fills in is covered too */
  return el;
}
/* ---- points that appear one click at a time, like a slide show: LESSON.pts={slideId:'css selector of the points'}.
   Next shows the next point (and only then moves on to the next slide); Previous hides the last point.
   Arriving from before starts with all points hidden, coming back from the next slide shows them all (so does ?pts=all, used by the tests). ---- */
var PT_FX=['flyB','float','flyR','zoom'];
function ptReset(s,dir){
  if(!s.pts) return;
  s.pn=(dir<0||/[?&]pts=all/.test(location.search))?s.pts.length:0;
  s.pts.forEach(function(e,j){ e.classList.toggle('pt-h',j>=s.pn) });
}
function ptMore(s){ return !!(s&&s.pts&&s.pn<s.pts.length) }
function ptReveal(s){
  var e=s.pts[s.pn], eff=PT_FX[s.pn%PT_FX.length]; s.pn++;
  e.classList.remove('pt-h'); e.classList.add('fx','e-'+eff); e.style.setProperty('--fd','560ms'); e.style.setProperty('--fdl','0ms');
  var done=function(ev){ if(ev&&ev.target!==e) return; e.classList.remove('fx','e-'+eff); e.style.removeProperty('--fd'); e.style.removeProperty('--fdl'); e.removeEventListener('animationend',done) };
  e.addEventListener('animationend',done); setTimeout(done,900);
  paintChrome();
}
function ptHide(s){ s.pn--; s.pts[s.pn].classList.add('pt-h'); paintChrome() }
function show(i,dir){
  if(i<0||i>=SLIDES.length||i===CUR) return;
  if(typeof STK!=='undefined') STK.navigated();
  var prev=CUR, s=SLIDES[i], el=build(i), pl=MOT.plan(i,prev,BG.tier());
  ptReset(s,dir);
  el.classList.remove('off');
  if(prev>=0){
    var pe=SLIDES[prev].el; pe.classList.remove('on'); pe.classList.add('off'); MOT.mark(pe,pl,dir);
    (function(p){var t=p._tk=(p._tk||0)+1; later(function(){if(p._tk===t){p.classList.remove('off'); MOT.unmark(p)}},pl.ms)})(pe);
    if(SLIDES[prev].leave) SLIDES[prev].leave(pe);
    if(typeof STK!=='undefined') STK.leave(pe);
  }
  MOT.mark(el,pl,dir); void el.offsetWidth; el.classList.add('on');
  (function(e){var t=e._tk=(e._tk||0)+1; later(function(){if(e._tk===t) MOT.unmark(e)},pl.ms+60)})(el);
  CUR=i;
  STAGE.classList.toggle('lab',s.theme==='lab');
  var pal=PALID[s.id]||PALCH[s.ch]||'emerald';
  BG.go(BGID[s.id]||BGMAP[s.ch]||'atomic',pal,dir);
  APP.setAttribute('data-pal',pal);
  MOT.enter(el,pl);
  if(typeof STK!=='undefined') STK.arrive(el);
  if(s.enter) s.enter(el);
  paintChrome();
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
}
function next(){ var s=SLIDES[CUR]; if(ptMore(s)){ ptReveal(s); return } if(CUR<SLIDES.length-1) show(CUR+1,1) }
function prevS(){ var s=SLIDES[CUR]; if(s&&s.pts&&s.pn>0){ ptHide(s); return } if(CUR>0) show(CUR-1,-1) }
function paintChrome(){
  var s=SLIDES[CUR];
  $$('.seg',PROG).forEach(function(b,j){b.classList.toggle('cur',j===CUR); b.classList.toggle('done',j<CUR); b.classList.toggle('act',!!SLIDES[j].tag && j!==CUR)});
  BTN_P.disabled=CUR===0&&!(s.pts&&s.pn>0); BTN_N.disabled=CUR===SLIDES.length-1&&!ptMore(s);
  WHERE.innerHTML='<b>'+(s.title||LESSON.short)+'</b><small>'+CHAPTERS[s.ch]+' · '+ar(CUR+1)+' من '+ar(SLIDES.length)+(s.pts&&s.pts.length?' · النقاط '+ar(s.pn)+'/'+ar(s.pts.length):'')+'</small>';
  NOTE.innerHTML='<h4>ملاحظة المعلم</h4>'+(s.note||'<p>لا توجد ملاحظة لهذه الشريحة.</p>');
  $$('.it',IDX).forEach(function(b,j){b.classList.toggle('cur',j===CUR)});
}
function fit(){

  STAGE.style.setProperty('--s',Math.min(w/1280,h/720).toFixed(4));
}

    (typeof STK!=='undefined'?STK.btn():'')+

  });
  sh.innerHTML=html;
  $$('.it',sh).forEach(function(b){b.addEventListener('click',function(){var i=+b.getAttribute('data-i'); IDX.classList.remove('open'); show(i,i>CUR?1:-1)})});
  IDX.addEventListener('click',function(e){if(e.target===IDX) IDX.classList.remove('open')});
  BTN_N.addEventListener('click',next); BTN_P.addEventListener('click',prevS);
  $('#bFx').addEventListener('click',function(){BG.cycle()});
  $('#bNote').addEventListener('click',function(){NOTE.classList.toggle('open')});
  $('#bIdx').addEventListener('click',function(){IDX.classList.toggle('open')});
  $('#bFs').addEventListener('click',function(){
    try{ var pr=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); if(pr&&pr.catch) pr.catch(function(){}) }catch(x){}
  });
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName; if(t==='INPUT'||t==='TEXTAREA') return;
    var k=e.key;
    if(k==='ArrowLeft'||k==='PageDown'||k===' '){e.preventDefault(); next()}
    else if(k==='ArrowRight'||k==='PageUp'){e.preventDefault(); prevS()}
    else if(k==='Home'){show(0,-1)} else if(k==='End'){show(SLIDES.length-1,1)}
    else if(k==='n'||k==='N'||k==='ن'){NOTE.classList.toggle('open')}
    else if(k==='g'||k==='G'||k==='ل'){IDX.classList.toggle('open')}
    else if(k==='f'||k==='F'||k==='ب'){$('#bFs').click()}
    else if(k==='Escape'){IDX.classList.remove('open'); NOTE.classList.remove('open')}
  });
  window.addEventListener('resize',fit); fit();
  var h=0; try{ var m=/^#s(\d+)$/.exec(location.hash); if(m) h=Math.min(SLIDES.length,Math.max(1,+m[1]))-1 }catch(e){}
  show(h,1);
}

/* a shaded sphere, optionally with a label */
function ball(x,y,r,grad,label,ink,fs){
  return '<circle class="s" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#g'+grad+')" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>'+
    (label?'<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" direction="ltr" font-family="Cairo,Tajawal,sans-serif" font-weight="800" font-size="'+(fs||r*.9)+'" fill="'+(ink||'#0b1a2e')+'" style="pointer-events:none">'+label+'</text>':'');
}
var NUC=[[0,0],[22,6],[-20,10],[8,-22],[-6,24],[24,-16],[-24,-14],[2,2],[30,22],[-30,24],[14,34],[-14,-34],[32,-2],[-34,2],[12,-38],[-10,40]];
function nucleus(cx,cy,list,r){ /* list: array of gradient names */
  var s=''; list.forEach(function(g,i){var p=NUC[i%NUC.length]; s+=ball(cx+p[0]*r/15,cy+p[1]*r/15,r,g)}); return s;
}
function orbit(cx,cy,rx,ry,rot,op){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" transform="rotate('+(rot||0)+' '+cx+' '+cy+')" fill="none" stroke="'+CY+'" stroke-opacity="'+(op||.75)+'" stroke-width="2.4"/>'}
function grid(w,h,step,op){var s='';for(var x=0;x<=w;x+=step)s+='M'+x+' 0V'+h;for(var y=0;y<=h;y+=step)s+='M0 '+y+'H'+w;return '<path d="'+s+'" stroke="'+CY+'" stroke-opacity="'+(op||.08)+'" stroke-width="1" fill="none"/>'}

/* ---------- living backgrounds: a WebGL light field plus one canvas scene per chemistry theme ----------

   Everything is vanilla: no libraries, no per-frame allocations, paused when the tab is hidden. */
var BG=(function(){
  var view,root,glc,c2,ctx,gl,wipe,uni={};
  var W=0,H=0,S=1,U=1,tier=2,Q=1,auto=true,raf=0,last=0,lastGL=0,T=0,started=false,sa=1;

  var st={ema:0,n:0,frames:0,gl:false,iv:0,ivn:0,pf:0};
  var PI2=Math.PI*2, SC={};

  function hx(s){return [parseInt(s.substr(1,2),16)/255,parseInt(s.substr(3,2),16)/255,parseInt(s.substr(5,2),16)/255]}
  /* shader shape per scene, colours per palette */
  var SCN={atomic:[2.0,.040,1.7],reactions:[2.4,.055,2.0],periodic:[1.7,.030,1.2],bonds:[2.2,.045,1.8],organic:[2.0,.038,1.5],bubbles:[2.2,.050,1.9],doodles:[1.5,.028,1.1],waves:[2.0,.040,1.6],hexes:[1.8,.035,1.3]};
  var PAL={
    emerald:{a:'#032419',b:'#08563f',c:'#1bab82',m:'90,240,190',s:'190,255,230',s2:'120,235,225'},
    navy:   {a:'#030c20',b:'#0a2a5c',c:'#1d62bd',m:'96,190,255',s:'190,225,255',s2:'130,210,255'},
    ember:  {a:'#0d0603',b:'#3a1606',c:'#b95a1b',m:'255,150,70',s:'255,214,180',s2:'255,190,110'},
    gold:   {a:'#050608',b:'#14161b',c:'#41391f',m:'236,236,244',s:'235,235,242',s2:'240,214,130'},
    violet: {a:'#0b0620',b:'#2a1259',c:'#6c3fc4',m:'190,150,255',s:'222,205,255',s2:'170,140,255'}
  };
  Object.keys(PAL).forEach(function(k){var p=PAL[k]; p.A=hx(p.a); p.B=hx(p.b); p.C=hx(p.c)});
  var PC=PAL.emerald,curPal='emerald',prevPal=null;
  function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
  function lerp(a,b,m){return a+(b-a)*m}

  /* ---- cached sprites ---- */
  var SPR={};
  function glow(rgb){var k='g'+rgb;if(SPR[k])return SPR[k];var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');var r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba('+rgb+',1)');r.addColorStop(.22,'rgba('+rgb+',.42)');r.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=r;g.fillRect(0,0,64,64);return SPR[k]=c}
  function ballSpr(rgb){var k='b'+rgb;if(SPR[k])return SPR[k];var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');var p=rgb.split(',').map(Number);var r=g.createRadialGradient(24,22,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,.95)');r.addColorStop(.35,'rgba('+rgb+',.95)');r.addColorStop(1,'rgba('+Math.round(p[0]*.35)+','+Math.round(p[1]*.4)+','+Math.round(p[2]*.4)+',.9)');g.fillStyle=r;g.beginPath();g.arc(32,32,30,0,PI2);g.fill();return SPR[k]=c}
  function txtSpr(str,px,rgb,blur){
    var c=document.createElement('canvas'),g=c.getContext('2d'),f='italic 600 '+px+'px "STIX Two Text",Georgia,serif';
    g.font=f; var w=Math.ceil(g.measureText(str).width+px*.8),h=Math.ceil(px*1.7);
    c.width=Math.ceil(w*S);c.height=Math.ceil(h*S); g=c.getContext('2d'); g.scale(S,S);
    if(blur&&'filter' in g) g.filter='blur('+blur.toFixed(1)+'px)';
    g.font=f; g.fillStyle='rgb('+rgb+')'; g.textBaseline='middle'; g.fillText(str,px*.4,h/2);
    return {c:c,w:w,h:h};
  }
  function G(x,y,r,rgb,al){ctx.globalAlpha=al*sa;ctx.drawImage(glow(rgb),x-r,y-r,r*2,r*2)}
  function B(x,y,r,rgb,al){ctx.globalAlpha=al*sa;ctx.drawImage(ballSpr(rgb),x-r,y-r,r*2,r*2)}

  /* ---- drifting sparkles shared by every scene ---- */
  function mkDust(r,n){
    var p=[],i; n=Math.round(n*Q);
    for(i=0;i<n;i++)p.push({x:r()*W,y:r()*H,s:(.6+r()*1.5)*U,v:3+r()*9,tw:.6+r()*1.6,ph:r()*6,g:r()<.25});
    return {
      step:function(dt){for(var i=0;i<p.length;i++){var q=p[i];q.y-=q.v*dt*U;if(q.y<-4){q.y=H+4;q.x=Math.random()*W}}},
      draw:function(){for(var i=0;i<p.length;i++){var q=p[i];ctx.globalAlpha=sa*(.10+.34*(.5+.5*Math.sin(T*q.tw+q.ph)));ctx.fillStyle=q.g?'#ffe39a':'rgb('+PC.s+')';ctx.beginPath();ctx.arc(q.x+ox*.1,q.y,q.s,0,PI2);ctx.fill()}}
    };
  }

  /* ================= scene 1: atomic structure ================= */
  SC.atomic=(function(){
    var atoms=[],dust;
    function init(){
      var r=rng(11),def=[[.90,.74,300],[.05,.16,200],[.48,1.04,170]],i,j;
      dust=mkDust(r,34); atoms=[];
      for(i=0;i<def.length;i++){
        var a={x:def[i][0]*W,y:def[i][1]*H,R:def[i][2]*U,k:.22+.12*i,ph:r()*6,o:[]},n=Math.max(2,Math.round(4*Q));
        for(j=0;j<n;j++)a.o.push({rx:a.R*(.5+.13*j+r()*.08),ry:a.R*(.16+.07*j+r()*.05),rot:r()*3.14,rs:(r()-.5)*.07,f:r()*PI2,sp:(.45+r()*.35)*(j%2?-1:1),gold:j%3===1});
        atoms.push(a);
      }
    }
    function step(dt){for(var i=0;i<atoms.length;i++){var a=atoms[i];for(var j=0;j<a.o.length;j++){var o=a.o[j];o.rot+=o.rs*dt;o.f+=o.sp*dt}}dust.step(dt)}
    function draw(){
      var i,j,k,b,l;
      for(i=0;i<atoms.length;i++){
        var a=atoms[i],cx=a.x+ox*a.k,cy=a.y+oy*a.k,br=.8+.2*Math.sin(T*1.3+a.ph);
        G(cx,cy,a.R*.62,'255,205,110',.26*br); G(cx,cy,a.R*.16,'255,236,190',.7*br); G(cx,cy,a.R*.05,'255,255,255',.9);
        ctx.globalAlpha=1; ctx.lineWidth=1.1*U; ctx.strokeStyle='rgba(255,226,150,'+(.16*br*sa).toFixed(3)+')'; ctx.beginPath();
        for(k=0;k<6;k++){var ang=T*.03+k*Math.PI/3,len=a.R*(k%2?.38:.55);ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*len,cy+Math.sin(ang)*len)} ctx.stroke();
        for(j=0;j<a.o.length;j++){
          var o=a.o[j],cr=Math.cos(o.rot),sr=Math.sin(o.rot);
          ctx.globalAlpha=1; ctx.strokeStyle='rgba('+PC.s+','+(.12*sa).toFixed(3)+')'; ctx.lineWidth=1.2*U; ctx.beginPath(); ctx.ellipse(cx,cy,o.rx,o.ry,o.rot,0,PI2); ctx.stroke();
          var dir=o.sp>0?1:-1,span=Math.abs(o.sp)*.9/14,col=o.gold?'255,214,128':'255,255,255';
          ctx.strokeStyle='rgba('+col+','+(.5*sa).toFixed(3)+')'; ctx.lineWidth=1.8*U;
          for(b=0;b<4;b++){
            ctx.globalAlpha=(1-b*.25); ctx.beginPath();
            for(l=0;l<=4;l++){var f=o.f-dir*(b*4+l)*span,ex=o.rx*Math.cos(f),ey=o.ry*Math.sin(f),px=cx+ex*cr-ey*sr,py=cy+ex*sr+ey*cr;l?ctx.lineTo(px,py):ctx.moveTo(px,py)}
            ctx.stroke();
          }
          var hx_=o.rx*Math.cos(o.f),hy_=o.ry*Math.sin(o.f);
          G(cx+hx_*cr-hy_*sr,cy+hx_*sr+hy_*cr,9*U,col,.85);
        }
      }
      dust.draw();
    }
    return {init:init,step:step,draw:draw};
  })();

  /* ================= scene 2: chemical reactions ================= */
  SC.reactions=(function(){
    var bub,mol,fl,sp,eq,dust,COL,
        EQS=['2Mg + O₂ → 2MgO','2H₂ + O₂ → 2H₂O','CH₄ + 2O₂ → CO₂ + 2H₂O','N₂ + 3H₂ → 2NH₃','Zn + 2HCl → ZnCl₂ + H₂','CaCO₃ → CaO + CO₂'];
    function init(){
      var r=rng(23),i; COL=[PC.m,'255,255,255','255,205,110',PC.s2]; dust=mkDust(r,26); bub=[]; mol=[]; eq=[]; fl=[]; sp=[];
      for(i=0;i<Math.round(22*Q);i++)bub.push({x:r()*W,y:r()*H,r:(4+r()*14)*U,v:(14+r()*34)*U,sw:(6+r()*14)*U,f:r()*6,s:.4+r()*.8});
      for(i=0;i<Math.round(12*Q);i++)mol.push({x:W*(.1+.8*r()),y:H*(.1+.8*r()),vx:(r()-.5)*40*U,vy:(r()-.5)*40*U,a:r()*6,w:(r()-.5)*.5,k:r()<.5?2:3,c:Math.floor(r()*4),s:(9+r()*5)*U,cd:0});
      for(i=0;i<5;i++){var d=.5+r()*.5;eq.push({s:txtSpr(EQS[i],Math.round(24+d*26),PC.s,(1-d)*3),x:r()*W,y:H*(.12+.76*r()),v:(5+d*9)*U*(r()<.5?1:-1),d:d,al:.035+d*.05})}
    }
    function atomsOf(m){
      if(m.k===2){var c=Math.cos(m.a)*m.s*.95,s=Math.sin(m.a)*m.s*.95;return [[m.x-c,m.y-s,m.s],[m.x+c,m.y+s,m.s]]}

      return [[m.x,m.y,m.s*1.15],[m.x+Math.cos(u1)*L,m.y+Math.sin(u1)*L,m.s*.7],[m.x+Math.cos(u2)*L,m.y+Math.sin(u2)*L,m.s*.7]];
    }
    function step(dt){
      var i,j,m,n,q;
      for(i=0;i<bub.length;i++){q=bub[i];q.y-=q.v*dt;q.f+=dt*q.s;if(q.y<-q.r*2){q.y=H+q.r*2;q.x=Math.random()*W}}
      for(i=0;i<mol.length;i++){m=mol[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.a+=m.w*dt;m.cd=Math.max(0,m.cd-dt);
        if(m.x<W*.04||m.x>W*.96)m.vx*=-1; if(m.y<H*.06||m.y>H*.92)m.vy*=-1}
      for(i=0;i<mol.length;i++)for(j=i+1;j<mol.length;j++){
        m=mol[i];n=mol[j];var dx=m.x-n.x,dy=m.y-n.y,R=(m.s+n.s)*1.7;
        if(dx*dx+dy*dy<R*R&&m.cd<=0&&n.cd<=0){
          var tx=m.vx,ty=m.vy;m.vx=n.vx;m.vy=n.vy;n.vx=tx;n.vy=ty;m.cd=n.cd=1.2;
          var cx=(m.x+n.x)/2,cy=(m.y+n.y)/2;fl.push({x:cx,y:cy,a:0});
          for(q=0;q<7;q++){var an=Math.random()*PI2,v=(30+Math.random()*60)*U;sp.push({x:cx,y:cy,vx:Math.cos(an)*v,vy:Math.sin(an)*v,l:0})}
        }
      }
      for(i=fl.length-1;i>=0;i--){fl[i].a+=dt/1.0;if(fl[i].a>=1)fl.splice(i,1)}
      for(i=sp.length-1;i>=0;i--){q=sp[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.l+=dt/.9;if(q.l>=1)sp.splice(i,1)}
      for(i=0;i<eq.length;i++){q=eq[i];q.x+=q.v*dt;if(q.x>W+q.s.w)q.x=-q.s.w;else if(q.x<-q.s.w)q.x=W}

    function wave(yb,amp,ph,al,col){

    }

/* ---- Mr flow blocks (deck slides 12 and 13) ---- */
function flowBlock(c,i,mode){
  var rows=c.parts.map(function(p,j){
    var tag=p[2]?'<small style="color:var(--muted);font-size:14px">'+p[2]+'</small>':'';
    var left=mode==='count'?'<input class="cin" inputmode="numeric" autocomplete="off" aria-label="عدد ذرات '+p[0]+'">':'<span class="num" style="font-weight:800">'+p[1]+'</span>';
    var right=mode==='count'?'<span class="res"></span>':'<input class="cin pw" inputmode="decimal" autocomplete="off" aria-label="الناتج" style="margin-inline-start:auto;width:88px">';
    return '<div class="fr" data-j="'+j+'">'+left+'<span class="arv">×</span><b>'+p[0]+'</b>'+tag+'<span class="arv num">('+AR_T[p[0]]+')</span><span class="arv">=</span>'+right+'</div>';
  }).join('');
  return '<div class="fblk" data-i="'+i+'"><div class="fsum gbox"><span class="mf" style="font-size:25px">M<sub>r</sub> =</span>'+ninHTML('m'+i,'','sm')+'<div class="fb" style="min-height:0;font-size:15px;line-height:1.2"></div></div><span class="arw">◀</span><div class="frows">'+rows+'</div><span class="arw">◀</span>'+
    '<div class="fcmp frm brk"><div class="ff">'+c.f+'</div><small>'+c.name+'</small>'+(c.note?'<small style="color:var(--cyan)">'+c.note+'</small>':'')+'</div></div>';
}
function bindFlow(el,C,mode){
  $$('.fblk',el).forEach(function(blk,i){
    var c=C[i];
    $$('.fr',blk).forEach(function(r,j){
      var inp=$('.cin',r), p=c.parts[j], want=mode==='count'?p[1]:p[1]*AR_T[p[0]], done=false;
      function ok(){ if(done) return; done=true; inp.classList.add('ok-b'); inp.readOnly=true; if(mode==='count'){var rs=$('.res',r); rs.textContent=p[1]*AR_T[p[0]]; rs.classList.add('pop')} }
      inp.addEventListener('input',function(){ var v=nz(inp.value); inp.classList.remove('bad-b'); if(v!==null&&Math.abs(v-want)<0.001) ok() });
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!done){var v=nz(inp.value); if(v===null||Math.abs(v-want)>=0.001){inp.classList.add('bad-b','shake'); later(function(){inp.classList.remove('shake')},340)}} });
    });
    var fb=$('.fsum .fb',blk);
    bindNum($('.nin',blk),c.mr,0.01,function(ok){ if(ok) say(fb,'✓','ok'); else say(fb,'اجمع الناتج','bad') });
  });
}

var AR_T={H:1,C:12,N:14,O:16,F:19,Na:23,Mg:24,Al:27,S:32,Cl:35.5,Fe:56,Cu:63.5,Ca:40,K:39,Br:80};

/* one Mr card: count each element, then add */
function mrCardHTML(c,i,compact){
  var rows=c.parts.map(function(p,j){
    return '<div class="mrr" data-j="'+j+'"><div><b>'+p[0]+'</b>'+(p[2]?'<small>'+p[2]+'</small>':'')+'</div><input class="cin" inputmode="numeric" autocomplete="off" aria-label="عدد ذرات '+p[0]+'"><span class="num" style="white-space:nowrap">× '+AR_T[p[0]]+' <span class="res"></span></span></div>';
  }).join('');
  return '<div class="mrc" data-i="'+i+'"><h4><b class="eq">'+c.f+'</b><span>'+c.name+'</span></h4>'+
    (compact?'':'<div class="sm muted" style="font-size:18px">عدد الذرات في الصيغة × Ar</div>')+rows+
    '<div class="tot">M<sub>r</sub> = '+ninHTML('m'+i,'','sm')+'</div><div class="fb" style="min-height:24px;font-size:18px;text-align:center"></div></div>';

function bindMrCard(card,c){
  var rows=$$('.mrr',card), got=0;
  rows.forEach(function(r,j){
    var inp=$('.cin',r), res=$('.res',r), p=c.parts[j], done=false;
    function ok(){ if(done) return; done=true; inp.classList.add('ok-b'); inp.readOnly=true; res.textContent='= '+(p[1]*AR_T[p[0]]); res.style.color='var(--ok)'; res.classList.add('pop'); got++; }
    inp.addEventListener('input',function(){ var v=nz(inp.value); inp.classList.remove('bad-b'); if(v===p[1]) ok() });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!done){var v=nz(inp.value); if(v!==p[1]){inp.classList.add('bad-b','shake'); later(function(){inp.classList.remove('shake')},340)}} });
  });
  var fb=$('.fb',card);
  bindNum($('.nin',card),c.mr,0.01,function(ok){ if(ok) say(fb,'✓ '+c.sum,'ok'); else say(fb,'اجمع النواتج: '+(got<rows.length?'أكمل عدّ الذرات أولاً':'اجمع القيم الظاهرة'),'bad') });
}
