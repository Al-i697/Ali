@keyframes waveH{0%,60%,100%{transform:rotate(0)} 70%{transform:rotate(-16deg)} 80%{transform:rotate(8deg)} 90%{transform:rotate(-8deg)}}
.stk svg .nose{transform-box:fill-box; transform-origin:center; animation:noseW 3s ease-in-out infinite}
@keyframes noseW{0%,80%,100%{transform:scale(1)} 88%{transform:scale(1.12,.92)}}
/* calm and still modes, hidden slides */
html[data-fx="1"] .stk.placed,html[data-fx="1"] .stk.free{animation:stkIn .75s cubic-bezier(.2,1.45,.35,1) var(--sd,0s) backwards}

.frm,.panel:not(.dark),.rcard,.tq{background:rgba(var(--d2),.40)!important;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.rcard.on{background:rgba(40,120,80,.40)!important}
html[data-fx="0"] .frm,html[data-fx="0"] .panel,html[data-fx="0"] .rcard,html[data-fx="0"] .tq{-webkit-backdrop-filter:none;backdrop-filter:none}
/* the small cyan instruction lines sit straight on the photo: give them a plate */
div[style*="var(--cyan)"]{background:rgba(3,11,18,.84);color:#cdeff7!important;padding:1px 12px;border-radius:10px;width:fit-content}
.rcard .rq{color:#e9f4f6}
.rcards.two .rcard{padding:7px 12px}
.rcards.two{gap:8px}

/* ---- unit 4 additions: reaction arrows with conditions, lab bench ---- */
.rarr{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px;line-height:1.1;vertical-align:middle}
.rarr b{font-size:36px;font-weight:700;line-height:1}
.rarr i{font-style:normal;color:#FFE6A0;font-size:17px;font-weight:700;min-height:20px;white-space:nowrap}
.eqrow{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;flex-wrap:nowrap;font-size:30px;font-weight:800}
.eqrow .pl{font-size:30px}
.eqrow .mslot{min-width:150px;min-height:54px}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}}
.shaking{animation:shk .5s ease-in-out 3;transform-origin:50% 100%}
html[data-fx="0"] .shaking{animation:none}
/* the sample bottles of 4-2 are buttons: the selector says so, because the player's own bottom bar is a <footer class="bot"> and must keep its row layout */
button.bot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 10px;border-radius:16px;background:rgba(var(--d2),.55);border:2px solid rgba(255,255,255,.18);cursor:pointer;color:inherit;font:inherit}
button.bot:hover{border-color:var(--gold)} button.bot.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(228,188,75,.25)} button.bot.used{opacity:.7}
button.bot b{font-size:30px;font-family:var(--font-display);color:var(--gold)} button.bot span{font-size:15px;color:var(--muted)}
.obs{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:20px} .obs th{font-size:17px;color:var(--muted);font-weight:700;text-align:center} .obs td{background:rgba(var(--d2),.55);padding:5px 10px;text-align:center;font-weight:700} .obs td:first-child{border-radius:0 12px 12px 0;color:var(--gold);font-size:24px;font-family:var(--font-display)} .obs td:last-child{border-radius:12px 0 0 12px}
.dotc{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-inline-end:6px}

.rcards.tight{gap:7px} .rcards.tight .rcard{padding:8px 14px} .rcards.tight .rt{gap:1px} .rcards.tight .rt b{font-size:23px} .rcards.tight .rx{font-size:19px;line-height:1.35} .rcards.tight .rq{font-size:16px}
.obs td.cl{padding:3px 6px} .obs .cb{display:flex;gap:6px;justify-content:center} .obs .cb .btn{min-height:34px;padding:0 10px;font-size:17px}
.obs tr.ok td{box-shadow:inset 0 0 0 2px var(--ok)}

.slide.tightq .tq .opt{min-height:0;padding:5px 14px;font-size:21px;gap:12px} .slide.tightq .tq h4{font-size:22px;line-height:1.35} .slide.tightq .tq .opt .ix{width:34px;height:34px;font-size:19px}

/* ---- the fractionating tower ---- */
.twrw{display:flex;align-items:flex-end;gap:10px;direction:ltr}
.furn{display:flex;flex-direction:column;align-items:center;gap:2px;width:128px;flex:none;margin-bottom:6px}
.furn .furl,.furn .cru{font-size:15px;font-weight:700;color:var(--muted);text-align:center;direction:rtl;line-height:1.2}
.furn .cru{color:var(--gold);font-size:16px}
.twcol{display:flex;flex-direction:column;gap:3px;padding:3px 6px;border:4px solid #9fb4b8;border-radius:34px 34px 16px 16px;background:rgba(var(--d2),.4)}
.twrow{display:flex;align-items:center;gap:12px}
.lv{width:300px;height:44px;border:0;color:#0d1e26;font-family:var(--font-display);font-weight:800;font-size:18px;cursor:pointer;transition:filter .2s,transform .2s,box-shadow .2s;position:relative;direction:rtl}
.lv:hover{filter:brightness(1.12)} .lv.on{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(228,188,75,.55);transform:scale(1.03);z-index:1}
.lv.seen::before{content:'✓';position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:800;color:#0d3b1e}
.twrow .tt{width:112px;font-size:18px;font-weight:700;color:var(--gold);text-align:start}
.lv .nm.hide,.tt.hide{visibility:hidden}
.tw2{display:inline-flex;align-items:center;gap:4px}

.cls.sm .btn{min-height:38px;padding:0 14px;font-size:18px}

/* ---- points that appear one click at a time (engine.js, LESSON.pts) ---- */
.pt-h{opacity:0!important; visibility:hidden!important; pointer-events:none!important}

/* ===== "photo" look: a still photograph behind, solid coloured cards in front (loaded after lesson.css when a lesson is built with skin='photo') ===== */

/* card colours per palette: deep and saturated, so white text stays clear and the card never melts into the picture */
:root,[data-pal="emerald"]{--cardA:#0f6a52; --cardB:#08463a; --edge:rgba(130,238,200,.55); --muted:#dcf5ec}
[data-pal="navy"]{--cardA:#16459a; --cardB:#0b2c6b; --edge:rgba(160,205,255,.55); --muted:#dbe7fc}
[data-pal="ember"]{--cardA:#b34a1a; --cardB:#80300f; --edge:rgba(255,196,150,.62); --muted:#fff0e1}
[data-pal="gold"]{--cardA:#70530e; --cardB:#4a3607; --edge:rgba(246,216,125,.62); --muted:#f0e6c8}
[data-pal="violet"]{--cardA:#4e2eb2; --cardB:#32197e; --edge:rgba(205,180,255,.6); --muted:#ebe2fd}

/* the picture: two layers that cross-fade, a shade that keeps the title and the edges calm */
.pbg{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:linear-gradient(160deg,var(--f3),var(--ground) 55%,var(--f4))}
.pbl{position:absolute; inset:0; background:center/cover no-repeat; opacity:0; transition:opacity 1000ms ease; filter:saturate(1.04)}
.pbl.on{opacity:1}
.pshade{position:absolute; inset:0; z-index:5; background:
  linear-gradient(180deg,rgba(var(--d1),.46) 0,rgba(var(--d1),.2) 22%,rgba(var(--d1),.14) 62%,rgba(var(--d1),.4) 100%),
  radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(0,0,0,.34) 100%); transition:opacity 600ms}   /* above the picture layers (z-index 1-2); light on purpose, the cards and plates carry the text */
.pbg.off .pbl{opacity:0!important}
.pbg.light .pshade{opacity:.12}
.pbg.dim .pshade{background:linear-gradient(180deg,rgba(var(--d1),.84),rgba(var(--d1),.76))}   /* a picture that carries its own labels is pushed back so they do not fight the slide's text */

/* solid cards (prefixed with .app so they win over the older, more specific glass rules) */
.app .panel,.app .frm,.app .mod,.app .qd,.app .rc,.app .mrc,.app .pq,.app .goal,.app .tq,.app .sent,.app .stp,.app .rcard,.app .panel:not(.dark){
  background:linear-gradient(160deg,var(--cardA),var(--cardB))!important; -webkit-backdrop-filter:none!important; backdrop-filter:none!important;
  border:1.5px solid var(--edge); border-radius:18px;
  box-shadow:0 12px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18)}
.app .rcard{border:0; box-shadow:inset 0 0 0 2px var(--edge), 0 8px 20px rgba(0,0,0,.4)}   /* inset ring instead of a border, so the cards keep their old height */
.app .rcard:hover{box-shadow:inset 0 0 0 2px #F6C945, 0 8px 20px rgba(0,0,0,.4)}
.app .rcard.on{background:linear-gradient(160deg,#17724a,#0c4a31)!important; box-shadow:inset 0 0 0 2px rgba(166,242,138,.8), 0 8px 20px rgba(0,0,0,.4)}
.app .panel .panel,.app .panel .frm,.app .frm .panel,.app .frm .frm,.app .qd .panel,.app .mod .panel,.app .panel:not(.dark) .panel:not(.dark){background:rgba(0,0,0,.26)!important; border-color:rgba(255,255,255,.2); box-shadow:none}
.app .panel.dark,.app .frm.gold,.app .stp.final,.app .team.b,.app .score{background:linear-gradient(160deg,#8a640c,#5a3f06)!important; border-color:rgba(255,222,130,.8)}
.app .frm>.fh{background:#F6C945; color:#241800; border-bottom:0; border-radius:15px 15px 0 0}
.app .frm.gold>.fh{background:#FFE08A}
.app .opt,.app .pr,.app .pill{background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.3); box-shadow:none}
.app .opt:hover{background:rgba(255,255,255,.2)}
.app .ls{background:rgba(0,0,0,.28)}

/* the title reads over any picture */
.hd h2{text-shadow:0 2px 12px rgba(0,0,0,.75)}

/* small plates that used to be see-through: solid dark so the picture never runs behind text */
.app .lstep,.app .tile,.app .pf,.app .qr:not(.ok),.app .cls,.app .tray,.app .mtray,.app .mslot,.app .zone{background:rgba(var(--d2),.9)!important; -webkit-backdrop-filter:none!important; backdrop-filter:none!important}
.app .tile{background:linear-gradient(160deg,var(--cardA),var(--cardB))!important; border:1.5px solid var(--edge)}
.app .mchip{background:rgba(255,255,255,.16)!important}
.app .mchip.gold{background:linear-gradient(145deg,#F3D27A,#D9A92B)!important; color:#171100}   /* the coloured chips (limiting / excess) keep their colours */
.app .mchip.blue{background:linear-gradient(145deg,#3f78b0,#245283)!important; color:#fff}
.app input{background:rgba(var(--d1),.9)}

/* the title and loose text sit on quiet plates (box-shadow instead of padding, so no layout moves) */
.app .hd h2 .tp{background:rgba(var(--d1),.6); box-shadow:0 0 0 9px rgba(var(--d1),.6); border-radius:12px; -webkit-box-decoration-break:clone; box-decoration-break:clone; text-shadow:0 2px 10px rgba(0,0,0,.7)}
.app .onpic{background:rgba(var(--d1),.66); box-shadow:0 0 0 6px rgba(var(--d1),.66); border-radius:8px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
.app .opt .ix,.app .pr .t .ix{background:rgba(0,0,0,.3); color:#fff}
.app .opt.solo{background:linear-gradient(160deg,var(--cardA),var(--cardB))!important; border:1.5px solid var(--edge); box-shadow:0 8px 20px rgba(0,0,0,.4)}   /* answer buttons that stand alone on the photograph */
/* step lists that fade the steps not reached yet: keep them solid (dimmed by brightness, not by see-through) */
.app .lstep[style*=".42"]{opacity:1!important; background:rgba(var(--d2),.92)!important; color:rgba(255,255,255,.66)}
/* buttons and sample bottles that used to be see-through: solid, so they read over any picture */
.app .btn:not(.acc):not(.tab),.app button.bot{background:rgba(var(--d2),.92); box-shadow:inset 0 0 0 1.5px rgba(var(--t1),.5)}
.app .rn{background:#F6C945!important; color:#241800!important}   /* numbered / ticked badges: solid gold with dark ink */

/* living-engine builds (skin 'cards'): the scrim of the background engine is lighter, so the sharp photographs show through; the cards and plates carry the text */
.app .bgscrim{background:linear-gradient(180deg,rgba(var(--d1),.34) 0,rgba(var(--d1),.06) 22%,rgba(var(--d1),.04) 68%,rgba(var(--d1),.3) 100%),radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.34) 100%)}

/* ===== page-of-the-book badge (u4/bookpg.js) ===== */
/* a small badge in the top margin above the slide's header, so it never moves the slide's content */
.hd .pgb{position:absolute; left:0; top:-30px; height:27px; padding:0 13px 0 11px; border-radius:999px; display:inline-flex; align-items:center; gap:7px; font-size:17px; font-weight:800; line-height:1; white-space:nowrap; background:rgba(6,12,26,.78); border:1.5px solid var(--cyan); color:#fff; z-index:3}
.hd .pgb svg{width:16px; height:16px; fill:var(--cyan); flex:none}

/* ===== definition card and how-to strip (u4/defn.js) ===== */
.dfc{position:relative; display:flex; flex-direction:column; gap:8px; padding:12px 24px 14px; border-radius:16px; border:2px solid var(--gold); border-inline-start-width:9px; background:linear-gradient(135deg,rgba(228,188,75,.28),rgba(228,188,75,.10)),linear-gradient(rgba(12,10,22,.86),rgba(12,10,22,.86)); box-shadow:0 0 26px rgba(228,188,75,.22)}
.dfc .dh{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.dfc .dt{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px 0 12px; border-radius:999px; background:var(--gold); color:#171100; font-weight:800; font-size:18px}
.dfc .dt svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.dfc .dn{font-family:var(--font-display); font-size:36px; font-weight:800; color:var(--gold); line-height:1.1}
.dfc .de{font-family:var(--font-math); font-style:italic; font-size:24px; color:var(--muted); font-weight:600}
.dfc .dx{margin:0; font-size:29px; line-height:1.55; font-weight:600; color:var(--ink)}
.dfc .dx b{color:var(--gold); font-weight:800}
.dfc.sm{gap:5px; padding:8px 20px 10px}
.dfc.sm .dt{height:28px; font-size:16px}
.dfc.sm .dn{font-size:30px}
.dfc.sm .de{font-size:21px}
.dfc.sm .dx{font-size:24px; line-height:1.45}
.dfc.xs{gap:3px; padding:6px 16px 8px}
.dfc.xs .dt{height:24px; font-size:14px; padding:0 11px 0 9px}
.dfc.xs .dn{font-size:25px}
.dfc.xs .de{font-size:17px}
.dfc.xs .dx{font-size:20px; line-height:1.4}
.dfc .eg{display:block; margin-top:4px; color:var(--cyan); font-size:.86em; font-weight:700}
.how{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.how .hl{font-weight:800; font-size:20px; color:var(--cyan)}
.how .hs{display:inline-flex; align-items:center; gap:9px; min-height:40px; padding:4px 16px 4px 8px; border-radius:999px; background:rgba(var(--d2),.7); border:1.5px solid rgba(var(--t2),.5); font-size:23px; font-weight:700}
.how .hs i{flex:none; width:28px; height:28px; border-radius:50%; background:var(--cyan); color:#06121c; font-style:normal; font-weight:800; font-size:18px; display:inline-flex; align-items:center; justify-content:center}
.how .ha{color:var(--muted); font-size:14px}

/* ===== law / warning / reminder cards (same family as the definition card, u4/defn.js) ===== */
.dfc.law{border-color:var(--cyan); background:linear-gradient(135deg,rgba(80,200,240,.26),rgba(80,200,240,.08)),linear-gradient(rgba(12,10,22,.86),rgba(12,10,22,.86)); box-shadow:0 0 26px rgba(80,200,240,.16)}
.dfc.law .dt{background:var(--cyan); color:#06121c}
.dfc.law .dn{color:var(--cyan)}
.dfc.warn{border-color:#FF9B5A; background:linear-gradient(135deg,rgba(255,155,90,.30),rgba(255,155,90,.09)),linear-gradient(rgba(12,10,22,.86),rgba(12,10,22,.86)); box-shadow:0 0 26px rgba(255,155,90,.16)}
.dfc.warn .dt{background:#FF9B5A; color:#1f0e00}
.dfc.warn .dn{color:#FFB27E}
.dfc.rem{border-color:#B79CFF; background:linear-gradient(135deg,rgba(183,156,255,.28),rgba(183,156,255,.09)),linear-gradient(rgba(12,10,22,.86),rgba(12,10,22,.86)); box-shadow:0 0 26px rgba(183,156,255,.16)}
.dfc.rem .dt{background:#B79CFF; color:#150a2e}
.dfc.rem .dn{color:#CDB9FF}
.dfc .eqx{font-family:var(--font-math); font-size:40px; font-weight:700; line-height:1.3; color:var(--gold); text-align:center; padding:2px 0}
.dfc.sm .eqx{font-size:32px}
.dfc.xs .eqx{font-size:26px}
.dfc ul.dx{padding-inline-start:26px; display:flex; flex-direction:column; gap:3px}
.dfc.sm ul.dx{font-size:22px}
.dfc.xs ul.dx{font-size:19px}
.dfc .bigeq{margin:0}
.dfc.lawbox{min-height:150px; justify-content:center; align-items:stretch}

/* ===== predict, then discover (u4/predict.js) ===== */
.dfc.pred{border-color:#35D0BA; background:linear-gradient(135deg,rgba(53,208,186,.26),rgba(53,208,186,.08)),linear-gradient(rgba(12,10,22,.9),rgba(12,10,22,.9)); box-shadow:0 0 30px rgba(53,208,186,.2)}
.dfc.pred .dt{background:#35D0BA; color:#04201b}
.dfc.pred .dn{color:#6FE6D2}
.predbox{position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; background:rgba(6,10,22,.66); opacity:0; transition:opacity .2s ease-out}
.predbox.on{opacity:1}
.predbox[hidden]{display:none}
.predbox .dfc{width:min(900px,88%); gap:14px; padding:18px 28px 16px}
.predbox .pq{font-size:30px; line-height:1.55}
.predbox .pwhy{display:block; margin-top:10px; font-size:25px; color:var(--muted); font-weight:600}
.predbox .pops{display:flex; flex-direction:column; gap:10px}
.predbox .pop{display:flex; align-items:center; gap:14px; text-align:start; padding:9px 18px 9px 14px; border-radius:14px; border:2px solid rgba(var(--t2),.5); background:rgba(var(--d2),.75); color:var(--ink); font-family:inherit; font-weight:700; font-size:26px; line-height:1.4; cursor:pointer; transition:border-color .15s, background-color .15s}
.predbox .pop:hover,.predbox .pop:focus-visible{border-color:#35D0BA; background:rgba(53,208,186,.16); outline:none}
.predbox .pop i{flex:none; width:36px; height:36px; border-radius:50%; background:#35D0BA; color:#04201b; font-style:normal; font-weight:800; font-size:21px; display:inline-flex; align-items:center; justify-content:center}
.predbox .pfoot{display:flex; justify-content:flex-start; min-height:30px}
.predbox .pskip{background:none; border:0; color:var(--muted); font-family:inherit; font-size:19px; cursor:pointer; text-decoration:underline; padding:4px 6px}
.predbox.verdict .pskip{background:#35D0BA; color:#04201b; text-decoration:none; font-weight:800; padding:6px 22px; border-radius:999px; font-size:20px}
/* the small chip at the top centre of the slide while the lab runs */
.hd .pdc{position:absolute; left:50%; transform:translateX(-50%); top:-34px; height:28px; display:inline-flex; align-items:center; gap:8px; padding:0 14px; border-radius:14px; border:2px solid #35D0BA; background:rgba(8,12,26,.82); color:#fff; font-weight:800; font-size:16px; line-height:1; white-space:nowrap; z-index:2}
.hd .pdc i{width:10px; height:10px; border-radius:50%; background:#35D0BA}
.hd .pdc[data-s=ok]{border-color:#82DB6E} .hd .pdc[data-s=ok] i{background:#82DB6E}
.hd .pdc[data-s=no]{border-color:#FFA35A} .hd .pdc[data-s=no] i{background:#FFA35A}

/* slide kinds: one fixed colour per kind (see u4/kinds.js) */
[data-k=intro]{--k:#5BC0EB; --kb:#1d374d}
[data-k=learn]{--k:#9AA9FF; --kb:#2a3251}
[data-k=ex]{--k:#35D0BA; --kb:#143a42}
[data-k=act]{--k:#82DB6E; --kb:#253d31}
[data-k=ask]{--k:#F2C14E; --kb:#3e372a}
[data-k=exam]{--k:#FF7C98; --kb:#41283a}
[data-k=exit]{--k:#FFA35A; --kb:#41302d}
[data-k=hw]{--k:#CBC5E8; --kb:#35384c}
/* the pill above the title, opposite corner to the page badge */
.hd .kd{position:absolute; right:0; top:-34px; height:28px; display:inline-flex; align-items:center; gap:8px; padding:0 15px 0 13px; border-radius:15px; background:var(--kb,#161b2c); border:2px solid var(--k); color:#fff; font-weight:800; font-size:16px; line-height:1; white-space:nowrap; z-index:2}
.hd .kd i{width:11px; height:11px; border-radius:50%; background:var(--k); flex:0 0 auto}
/* a coloured line under every segment of the progress bar */
.prog .seg[data-k]::before{content:""; position:absolute; inset-inline:16%; bottom:-7px; height:4px; border-radius:2px; background:var(--k); opacity:1; pointer-events:none}
/* the lesson index: colour key + a small tag on every row */
.kkey{display:flex; flex-wrap:wrap; gap:8px 10px; margin:2px 0 14px}
.kkey span{display:inline-flex; align-items:center; gap:7px; padding:3px 11px 3px 10px; border-radius:13px; border:1.5px solid var(--k); font-size:14px; font-weight:700; line-height:1.4}
.kkey span i{width:9px; height:9px; border-radius:50%; background:var(--k)}
.idx .it[data-k]{border-inline-start:4px solid var(--k)}
.idx .it .kl{margin-inline-start:auto; padding:1px 9px; border-radius:11px; border:1.5px solid var(--k); font-size:12.5px; font-weight:700; line-height:1.5; flex:0 0 auto}
@media (max-width:760px){ .hd .kd{height:23px; font-size:13px; padding:0 10px} }
.kkey+.ktot{margin:-6px 0 14px; font-size:14.5px; opacity:.85}
.note .tmin{margin:0 0 8px; font-size:15px; opacity:.9}
.note .tmin small{opacity:.8}
/* the footer line is now longer (the kind word comes first): it must never push the Next button out of the screen */
.where{min-width:0; overflow:hidden}
.where small{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* the student's one-page summary (u4/summary.js): a preview on screen, one A4 sheet on paper */
.sumov{position:fixed; inset:0; z-index:200; display:none; flex-direction:column; align-items:center; gap:12px; padding:14px 12px 20px; background:rgba(4,8,18,.9); overflow:auto}

/* ---- drag & drop (pointer events; works with mouse, pen and touch whiteboards) ---- */
function drag(item,o){
  var sx=0, sy=0, moved=false, S=1, hot=null;
  function zoneAt(e){
    item.style.pointerEvents='none';
    var el=document.elementFromPoint(e.clientX,e.clientY);
    item.style.pointerEvents='';
    return el&&el.closest?el.closest(o.zone):null;
  }
  item.addEventListener('pointerdown',function(e){
    if(e.button>0||item.classList.contains('locked')) return;
    e.preventDefault();
    try{item.setPointerCapture(e.pointerId)}catch(x){}
    S=stageScale(); sx=e.clientX; sy=e.clientY; moved=false;
    item.classList.remove('back'); item.classList.add('drag');
  });
  item.addEventListener('pointermove',function(e){
    if(!item.classList.contains('drag')) return;
    var dx=(e.clientX-sx)/S, dy=(e.clientY-sy)/S;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    item.style.transform='translate('+dx+'px,'+dy+'px)';
    var z=zoneAt(e); if(z!==hot){ if(hot) hot.classList.remove('hot'); hot=z; if(hot) hot.classList.add('hot') }
  });
  function end(e){
    if(!item.classList.contains('drag')) return;
    item.classList.remove('drag');
    var z=moved?zoneAt(e):null;
    if(hot){hot.classList.remove('hot'); hot=null}
    if(!moved){ item.style.transform=''; if(o.tap) o.tap(item); return }
    var ok=false;
    if(z&&o.drop) ok=o.drop(item,z);
    if(ok){item.style.transform=''}
    else{item.classList.add('back'); item.style.transform=''; later(function(){item.classList.remove('back')},300)}
  }
  item.addEventListener('pointerup',end);
  item.addEventListener('pointercancel',end);
}

var PT_FX=['flyB','float','flyR','zoom'];

  if(!s.pts) return;

  return '<circle class="s" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#g'+grad+')" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>'+
    (label?'<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" direction="ltr" font-family="Cairo,Tajawal,sans-serif" font-weight="800" font-size="'+(fs||r*.9)+'" fill="'+(ink||'#0b1a2e')+'" style="pointer-events:none">'+label+'</text>':'');
}
var NUC=[[0,0],[22,6],[-20,10],[8,-22],[-6,24],[24,-16],[-24,-14],[2,2],[30,22],[-30,24],[14,34],[-14,-34],[32,-2],[-34,2],[12,-38],[-10,40]];
function nucleus(cx,cy,list,r){ /* list: array of gradient names */
  var s=''; list.forEach(function(g,i){var p=NUC[i%NUC.length]; s+=ball(cx+p[0]*r/15,cy+p[1]*r/15,r,g)}); return s;
}
function orbit(cx,cy,rx,ry,rot,op){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" transform="rotate('+(rot||0)+' '+cx+' '+cy+')" fill="none" stroke="'+CY+'" stroke-opacity="'+(op||.75)+'" stroke-width="2.4"/>'}
function grid(w,h,step,op){var s='';for(var x=0;x<=w;x+=step)s+='M'+x+' 0V'+h;for(var y=0;y<=h;y+=step)s+='M0 '+y+'H'+w;return '<path d="'+s+'" stroke="'+CY+'" stroke-opacity="'+(op||.08)+'" stroke-width="1" fill="none"/>'}

var BG=(function(){
  var view,root,glc,c2,ctx,gl,wipe,uni={};

  var st={ema:0,n:0,frames:0,gl:false,iv:0,ivn:0,pf:0};
  var PI2=Math.PI*2, SC={};

  function hx(s){return [parseInt(s.substr(1,2),16)/255,parseInt(s.substr(3,2),16)/255,parseInt(s.substr(5,2),16)/255]}
  /* shader shape per scene, colours per palette */

  var PAL={
    emerald:{a:'#032419',b:'#08563f',c:'#1bab82',m:'90,240,190',s:'190,255,230',s2:'120,235,225'},
    navy:   {a:'#030c20',b:'#0a2a5c',c:'#1d62bd',m:'96,190,255',s:'190,225,255',s2:'130,210,255'},
    ember:  {a:'#0d0603',b:'#3a1606',c:'#b95a1b',m:'255,150,70',s:'255,214,180',s2:'255,190,110'},
    gold:   {a:'#050608',b:'#14161b',c:'#41391f',m:'236,236,244',s:'235,235,242',s2:'240,214,130'},
    violet: {a:'#0b0620',b:'#2a1259',c:'#6c3fc4',m:'190,150,255',s:'222,205,255',s2:'170,140,255'}

  Object.keys(PAL).forEach(function(k){var p=PAL[k]; p.A=hx(p.a); p.B=hx(p.b); p.C=hx(p.c)});
  var PC=PAL.emerald,curPal='emerald',prevPal=null;
  function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

  function ballSpr(rgb){var k='b'+rgb;if(SPR[k])return SPR[k];var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');var p=rgb.split(',').map(Number);var r=g.createRadialGradient(24,22,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,.95)');r.addColorStop(.35,'rgba('+rgb+',.95)');r.addColorStop(1,'rgba('+Math.round(p[0]*.35)+','+Math.round(p[1]*.4)+','+Math.round(p[2]*.4)+',.9)');g.fillStyle=r;g.beginPath();g.arc(32,32,30,0,PI2);g.fill();return SPR[k]=c}
  function txtSpr(str,px,rgb,blur){

  function mkDust(r,n){

      draw:function(){for(var i=0;i<p.length;i++){var q=p[i];ctx.globalAlpha=sa*(.10+.34*(.5+.5*Math.sin(T*q.tw+q.ph)));ctx.fillStyle=q.g?'#ffe39a':'rgb('+PC.s+')';ctx.beginPath();ctx.arc(q.x+ox*.1,q.y,q.s,0,PI2);ctx.fill()}}
    };
  }

  /* ================= scene 1: atomic structure ================= */
  SC.atomic=(function(){
    var atoms=[],dust;
    function init(){
      var r=rng(11),def=[[.90,.74,300],[.05,.16,200],[.48,1.04,170]],i,j;

      for(i=0;i<def.length;i++){
        var a={x:def[i][0]*W,y:def[i][1]*H,R:def[i][2]*U,k:.22+.12*i,ph:r()*6,o:[]},n=Math.max(2,Math.round(4*Q));
        for(j=0;j<n;j++)a.o.push({rx:a.R*(.5+.13*j+r()*.08),ry:a.R*(.16+.07*j+r()*.05),rot:r()*3.14,rs:(r()-.5)*.07,f:r()*PI2,sp:(.45+r()*.35)*(j%2?-1:1),gold:j%3===1});

    function draw(){
      var i,j,k,b,l;
      for(i=0;i<atoms.length;i++){
        var a=atoms[i],cx=a.x+ox*a.k,cy=a.y+oy*a.k,br=.8+.2*Math.sin(T*1.3+a.ph);
        G(cx,cy,a.R*.62,'255,205,110',.26*br); G(cx,cy,a.R*.16,'255,236,190',.7*br); G(cx,cy,a.R*.05,'255,255,255',.9);
        ctx.globalAlpha=1; ctx.lineWidth=1.1*U; ctx.strokeStyle='rgba(255,226,150,'+(.16*br*sa).toFixed(3)+')'; ctx.beginPath();
        for(k=0;k<6;k++){var ang=T*.03+k*Math.PI/3,len=a.R*(k%2?.38:.55);ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*len,cy+Math.sin(ang)*len)} ctx.stroke();
        for(j=0;j<a.o.length;j++){
          var o=a.o[j],cr=Math.cos(o.rot),sr=Math.sin(o.rot);
          ctx.globalAlpha=1; ctx.strokeStyle='rgba('+PC.s+','+(.12*sa).toFixed(3)+')'; ctx.lineWidth=1.2*U; ctx.beginPath(); ctx.ellipse(cx,cy,o.rx,o.ry,o.rot,0,PI2); ctx.stroke();
          var dir=o.sp>0?1:-1,span=Math.abs(o.sp)*.9/14,col=o.gold?'255,214,128':'255,255,255';
          ctx.strokeStyle='rgba('+col+','+(.5*sa).toFixed(3)+')'; ctx.lineWidth=1.8*U;
          for(b=0;b<4;b++){
            ctx.globalAlpha=(1-b*.25); ctx.beginPath();
            for(l=0;l<=4;l++){var f=o.f-dir*(b*4+l)*span,ex=o.rx*Math.cos(f),ey=o.ry*Math.sin(f),px=cx+ex*cr-ey*sr,py=cy+ex*sr+ey*cr;l?ctx.lineTo(px,py):ctx.moveTo(px,py)}
            ctx.stroke();

  })();

  /* ================= scene 2: chemical reactions ================= */
  SC.reactions=(function(){
    var bub,mol,fl,sp,eq,dust,COL,
        EQS=['2Mg + O₂ → 2MgO','2H₂ + O₂ → 2H₂O','CH₄ + 2O₂ → CO₂ + 2H₂O','N₂ + 3H₂ → 2NH₃','Zn + 2HCl → ZnCl₂ + H₂','CaCO₃ → CaO + CO₂'];
    function init(){
      var r=rng(23),i; COL=[PC.m,'255,255,255','255,205,110',PC.s2]; dust=mkDust(r,26); bub=[]; mol=[]; eq=[]; fl=[]; sp=[];
      for(i=0;i<Math.round(22*Q);i++)bub.push({x:r()*W,y:r()*H,r:(4+r()*14)*U,v:(14+r()*34)*U,sw:(6+r()*14)*U,f:r()*6,s:.4+r()*.8});
      for(i=0;i<Math.round(12*Q);i++)mol.push({x:W*(.1+.8*r()),y:H*(.1+.8*r()),vx:(r()-.5)*40*U,vy:(r()-.5)*40*U,a:r()*6,w:(r()-.5)*.5,k:r()<.5?2:3,c:Math.floor(r()*4),s:(9+r()*5)*U,cd:0});
      for(i=0;i<5;i++){var d=.5+r()*.5;eq.push({s:txtSpr(EQS[i],Math.round(24+d*26),PC.s,(1-d)*3),x:r()*W,y:H*(.12+.76*r()),v:(5+d*9)*U*(r()<.5?1:-1),d:d,al:.035+d*.05})}
    }
    function atomsOf(m){
      if(m.k===2){var c=Math.cos(m.a)*m.s*.95,s=Math.sin(m.a)*m.s*.95;return [[m.x-c,m.y-s,m.s],[m.x+c,m.y+s,m.s]]}
      var u1=m.a+.9,u2=m.a-.9,L=m.s*1.5;
      return [[m.x,m.y,m.s*1.15],[m.x+Math.cos(u1)*L,m.y+Math.sin(u1)*L,m.s*.7],[m.x+Math.cos(u2)*L,m.y+Math.sin(u2)*L,m.s*.7]];
    }
    function step(dt){
      var i,j,m,n,q;
      for(i=0;i<bub.length;i++){q=bub[i];q.y-=q.v*dt;q.f+=dt*q.s;if(q.y<-q.r*2){q.y=H+q.r*2;q.x=Math.random()*W}}
      for(i=0;i<mol.length;i++){m=mol[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.a+=m.w*dt;m.cd=Math.max(0,m.cd-dt);
        if(m.x<W*.04||m.x>W*.96)m.vx*=-1; if(m.y<H*.06||m.y>H*.92)m.vy*=-1}
      for(i=0;i<mol.length;i++)for(j=i+1;j<mol.length;j++){
        m=mol[i];n=mol[j];var dx=m.x-n.x,dy=m.y-n.y,R=(m.s+n.s)*1.7;

        }
      }
      for(i=fl.length-1;i>=0;i--){fl[i].a+=dt/1.0;if(fl[i].a>=1)fl.splice(i,1)}
      for(i=sp.length-1;i>=0;i--){q=sp[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.l+=dt/.9;if(q.l>=1)sp.splice(i,1)}

    }
    function wave(yb,amp,ph,al,col){
      ctx.beginPath();ctx.moveTo(0,H);
      for(var x=0;x<=W+20;x+=20)ctx.lineTo(x,yb+amp*Math.sin(x*.006/U+T*ph)+amp*.5*Math.sin(x*.013/U-T*ph*1.3));
      ctx.lineTo(W+20,H);ctx.closePath();
      var g=ctx.createLinearGradient(0,yb-amp,0,H);g.addColorStop(0,'rgba('+col+','+(al*sa).toFixed(3)+')');g.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=g;ctx.globalAlpha=1;ctx.fill();
    }

      wave(H*.90,10*U,.7,.20,PC.m); wave(H*.93,8*U,-.5,.09,'255,205,110');
      ctx.lineWidth=1.3*U;
      for(i=0;i<bub.length;i++){q=bub[i];var bx=q.x+Math.sin(q.f)*q.sw+ox*.15;
        ctx.globalAlpha=.20*sa;ctx.strokeStyle='rgb('+PC.s+')';ctx.beginPath();ctx.arc(bx,q.y,q.r,0,PI2);ctx.stroke();
        ctx.globalAlpha=.32*sa;ctx.beginPath();ctx.arc(bx,q.y,q.r*.72,3.6,4.5);ctx.stroke()}
      for(i=0;i<mol.length;i++){
        m=mol[i];var at=atomsOf(m),col=COL[m.c];
        ctx.globalAlpha=.5*sa;ctx.strokeStyle='rgb('+col+')';ctx.lineWidth=2*U;ctx.beginPath();
        for(j=1;j<at.length;j++){ctx.moveTo(at[0][0]+ox*.2,at[0][1]);ctx.lineTo(at[j][0]+ox*.2,at[j][1])}ctx.stroke();
        for(j=0;j<at.length;j++){G(at[j][0]+ox*.2,at[j][1],at[j][2]*2.6,col,.22);B(at[j][0]+ox*.2,at[j][1],at[j][2],j?COL[(m.c+1)%4]:col,.62)}

  /* ================= scene 3: the periodic table ================= */
  SC.periodic=(function(){
    var cells=[],base,bright,cw,ch,gx,gy,dust,shim=[],nextShim=0;
    var ROWS=[
     [[1,'H',1],[18,'He',2]],
     [[1,'Li',3],[2,'Be',4],[13,'B',5],[14,'C',6],[15,'N',7],[16,'O',8],[17,'F',9],[18,'Ne',10]],
     [[1,'Na',11],[2,'Mg',12],[13,'Al',13],[14,'Si',14],[15,'P',15],[16,'S',16],[17,'Cl',17],[18,'Ar',18]],
     'K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr'.split(' ').map(function(s,i){return [i+1,s,19+i]}),
     'Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe'.split(' ').map(function(s,i){return [i+1,s,37+i]}),
     'Cs Ba La Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn'.split(' ').map(function(s,i){return [i+1,s,i<3?55+i:69+i]}),
     'Fr Ra Ac Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ').map(function(s,i){return [i+1,s,i<3?87+i:101+i]})
    ];

    function paint(cv,bri){

      g.textAlign='center';g.textBaseline='middle';

        g.fillStyle='rgba('+tint(e.c)+','+(bri?.20:.07)+')';g.strokeStyle=bri?'rgba(255,236,180,.95)':'rgba('+PC.s+',.8)';g.lineWidth=1.2*U;
        g.beginPath();g.roundRect?g.roundRect(e.x,e.y,cw-4*U,ch-4*U,6*U):g.rect(e.x,e.y,cw-4*U,ch-4*U);g.fill();g.stroke();
        g.fillStyle=bri?'#fff':'rgba('+PC.s+',.9)';g.font='700 '+Math.round(ch*.36)+'px Cairo,Arial,sans-serif';g.fillText(e.s,e.x+(cw-4*U)/2,e.y+(ch-4*U)*.55);
        g.font='600 '+Math.round(ch*.15)+'px Cairo,Arial,sans-serif';g.textAlign='left';g.fillText(e.z,e.x+7*U,e.y+13*U);g.textAlign='center';

    function init(){

      for(i=0;i<ROWS.length;i++)for(j=0;j<ROWS[i].length;j++){var e=ROWS[i][j];cells.push({c:e[0],s:e[1],z:e[2],x:gx+(e[0]-1)*cw+2*U,y:gy+i*ch+2*U,cx:gx+(e[0]-.5)*cw,cy:gy+(i+.5)*ch})}

    function step(dt){
      dust.step(dt);

    }
    function hl(i,a){var e=cells[i],dx=(e.x+ox*.2),dy=(e.y+oy*.2),w=(cw-4*U),h=(ch-4*U);
      ctx.globalAlpha=a*sa;ctx.drawImage(bright,e.x*S,e.y*S,w*S,h*S,dx,dy,w,h)}

      var i,R,d,I,a;

  /* ================= scene 4: chemical bonds ================= */
  SC.bonds=(function(){
    var at,dust,COL,DM=150;
    function init(){
      var r=rng(41),i; COL=[PC.m,'255,255,255','255,205,110',PC.s2]; dust=mkDust(r,22); at=[];
      for(i=0;i<Math.round(26*Q);i++){var sp=(6+r()*12)*U,an=r()*PI2;at.push({x:r()*W,y:r()*H,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:(5+r()*7)*U,c:Math.floor(r()*4),ph:r()*6})}

/* the structural formula of a straight chain of n carbons: o.b bond orders (n-1), o.u / o.d atoms above / below each carbon (null = none), o.l / o.r atom at the left / right end; every atom and bond is drawn */
function chainSVG(n,o){
  o=o||{}; var g=58, pad=54, W=2*pad+(n-1)*g, H=132, y0=66, s='', i, x, A=function(t){return t==='H'?12:(t==='Br'||t==='OH')?16:12};
  for(i=0;i<n-1;i++){ x=pad+i*g; var b=(o.b&&o.b[i])||1; s+= b===2?bnd(x,y0-3.5,x+g,y0-3.5,4)+bnd(x,y0+3.5,x+g,y0+3.5,4):bnd(x,y0,x+g,y0,5) }
  for(i=0;i<n;i++){ x=pad+i*g; if(o.u&&o.u[i]) s+=bnd(x,y0,x,y0-42,4); if(o.d&&o.d[i]) s+=bnd(x,y0,x,y0+42,4) }
  if(o.l) s+=bnd(pad,y0,pad-38,y0,4); if(o.r) s+=bnd(pad+(n-1)*g,y0,pad+(n-1)*g+38,y0,4);
  for(i=0;i<n;i++){ x=pad+i*g; if(o.u&&o.u[i]) s+=atm(x,y0-42,A(o.u[i]),o.u[i]); if(o.d&&o.d[i]) s+=atm(x,y0+42,A(o.d[i]),o.d[i]) }
  if(o.l) s+=atm(pad-38,y0,A(o.l),o.l); if(o.r) s+=atm(pad+(n-1)*g+38,y0,A(o.r),o.r);
  for(i=0;i<n;i++){ x=pad+i*g; s+=atm(x,y0,17,'C') }
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="'+(o.w||W)+'" aria-hidden="true" style="direction:ltr;overflow:visible">'+s+'</svg>';
  return (o.w&&o.w<190)?noTxt(out):out;
}
/* hydrogens of the straight-chain 1-alkene with n carbons (C1=C2): the places [carbon index, 'u'|'d'|'r'] */
function eneH(n){

function eneSVG(n,o){

/* Unit-1 lessons: the right answer must not always be the first choice.
   Every group of choices (.opts) is shuffled when its slide is built, the same way every time (seeded by the slide id and the group's place),
   and the letters (أ ب ج د هـ) are renumbered. The answers are bound by data-i, so only the order on screen changes. */
function shuffleOpts(el,id){
  var R=rnd(id.split('').reduce(function(a,c){return (a*31+c.charCodeAt(0))%2147483000},7)+1), L='أبجدهـ';
  $$('.opts',el).forEach(function(box){
    var kids=Array.prototype.slice.call(box.children), i, j, t;
    if(kids.length<2) return;
    for(i=kids.length-1;i>0;i--){ j=Math.floor(R()*(i+1)); t=kids[i]; kids[i]=kids[j]; kids[j]=t }
    kids.forEach(function(k,n){ box.appendChild(k); var ix=k.querySelector('.ix'); if(ix) ix.textContent=L[n] });
  });
}
var _slide=slide;
slide=function(o){ var oi=o.init; o.init=function(el){ shuffleOpts(el,o.id); if(oi) oi.apply(this,arguments) }; _slide(o) };

/* ---------- the card look: helper that keeps loose text readable over any background (photo or live scene).
   Used by lessons built with skin 'photo' (still pictures) or 'cards' (the living background engine). ---------- */
/* text that sits straight on the photograph (not inside a card) gets a quiet dark plate, so it stays readable over any picture.
   Called by the player for every slide it builds; the class 'onpic' is styled in skin_photo.css (no padding, so nothing moves). */
var SKIN=(function(){
  var CARD='.panel,.frm,.mod,.qd,.rc,.mrc,.pq,.goal,.tq,.sent,.stp,.rcard,.tile,.opt,.btn,.qr,.cls,.tray,.mtray,.mslot,.pf,.zone,.pill,.chip,.callout,.gbar,.ls,.gi,.team,.score,.tag,.fb,.hd,.nav,.steps,.rd,button,input,select,table,svg,.ptn,.tb';
  /* text that already sits on a surface with its own colour (a card, a badge, a band) must not get a plate */
  function opaque(e){
    var c=getComputedStyle(e); if(c.backgroundImage&&c.backgroundImage!=='none') return true;
    var m=/rgba?\(([^)]+)\)/.exec(c.backgroundColor); if(!m) return false; var v=m[1].split(','); return (v.length>3?+v[3]:1)>=.45;
  }
  function onSurface(p,top){ for(var e=p;e&&e!==top;e=e.parentElement) if(opaque(e)) return true; return false }
  function slide(el){
    /* the title gets a plate that hugs its text */
    var h=el.querySelector('.hd h2'); if(h&&!h.querySelector('.tp')) h.innerHTML='<span class="tp">'+h.innerHTML+'</span>';
    /* answer buttons that are not inside a card stand straight on the picture: they become solid cards themselves */
    var BOX='.panel,.frm,.mod,.qd,.rc,.mrc,.pq,.goal,.tq,.sent,.stp,.rcard,.tile,.qr,.cls,.tray,.mtray,.zone';
    Array.prototype.forEach.call(el.querySelectorAll('.opt'),function(o){ if(!o.parentElement.closest(BOX)) o.classList.add('solo') });
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),t,seen=[];
    while((t=w.nextNode())){
      if(!t.nodeValue.trim()) continue;
      var p0=t.parentElement; if(!p0||p0.closest(CARD)||onSurface(p0,el)) continue;
      var p=p0;
      while(p&&p!==el&&/^(inline|inline-block|contents)$/.test(getComputedStyle(p).display)) p=p.parentElement;
      if(p&&p!==el&&p.querySelector(CARD)) p=p0;   /* the container also holds buttons or cards: plate only the text itself */
      if(!p||p===el||p.classList.contains('body')||seen.indexOf(p)>=0||(p!==p0&&p.querySelector(CARD))) continue;
      seen.push(p); p.classList.add('onpic');
    }
  }
  return {slide:slide};
})();

/* ---------- the page of the book next to every activity, exercise, example or question taken from the books (teacher's request, November 2026).
   A small badge above the slide's title: «كتاب الطالب ص61» or «كتاب النشاط ص38–39».
   Each lesson lists its slides in src/pages.js:  var BOOKPG={ slideId:'كتاب الطالب ص61', ... };
   Slides of our own (explanations from the teacher's deck, exit tickets) carry none.  The numbers are checked against the books, never copied from a note.
   Pages are written with Western digits (one numeral style); bdi keeps "38–39" in reading order inside the Arabic line. ---------- */
(function(){
  var ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z"/></svg>';
  var _s=slide;
  slide=function(o){
    var oi=o.init;
    o.init=function(el){
      var pg=(typeof BOOKPG!=='undefined')&&BOOKPG[o.id];
      if(pg){ var hd=el.querySelector('.hd'); if(hd&&!hd.querySelector('.pgb')){ var b=document.createElement('span'); b.className='pgb'; b.setAttribute('data-pg',pg); b.innerHTML=ICON+pg.replace(/(\d+(?:–\d+)?)/g,'<bdi dir="ltr">$1</bdi>'); hd.appendChild(b) } }
      if(oi) return oi.apply(this,arguments);
    };
    _s(o);
  };
})();

/* ---------- shared "definition" card and "how to" strip (teacher's request, November 2026).
   A definition used to be one more sentence inside an ordinary panel, often in the same paragraph as the instructions for using it.
   Now it is its own card: a gold «تعريف» tag, the term in Arabic and English, and the book's wording on its own line; the steps for using it sit in a separate numbered strip.
     dfcHTML({t:'المُول', en:'Mole', h:'كمية من مادة …', sm:true})       -> definition card (sm: a smaller card for crowded slides)
     howHTML('طريقة الحساب', ['اعدّ الذرات','اضرب في Ar','اجمع'])          -> numbered steps, one chip per step
   Three more cards of the same family (teacher's request: one look for each kind of content), each with its own colour and tag:
     lawHTML({t:'قانون المول', eq:'n = m ÷ M<sub>r</sub>', h:'…', sm:true})   -> «قانون» (blue): the title, the equation large and on its own line, a line of explanation. body:'<html>' replaces eq+h (used where the equation is filled in by a click)
     warnHTML({t:'انتبه إلى الوحدات', h:'…'})                              -> «انتبه» (orange): a common slip; eq:'…' adds a large equation line
     remHTML({t:'…', items:['…','…']})                                 -> «تذكّر» (violet): a reminder, as one sentence (h) or a short list (items)
   The wording of a definition is the book's (student book «مصطلحات علمية» boxes, activity-book glossary), not ours; the page goes in BOOKPG. ---------- */
function dfcHTML(o){
  return '<div class="dfc'+(o.sm?' sm':'')+(o.cls?' '+o.cls:'')+'"><div class="dh"><span class="dt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>تعريف</span>'+
    '<b class="dn">'+o.t+'</b>'+(o.en?'<i class="de" dir="ltr">'+o.en+'</i>':'')+'</div><p class="dx">'+o.h+'</p></div>';
}
function howHTML(label,steps,cls){
  return '<div class="how'+(cls?' '+cls:'')+'"><span class="hl">'+label+'</span>'+steps.map(function(s,i){return '<span class="hs"><i class="num">'+(i+1)+'</i><span class="ht">'+s+'</span></span>'+(i<steps.length-1?'<span class="ha" aria-hidden="true">◀</span>':'')}).join('')+'</div>';
}
var CARD_TAGS={
  law:['قانون','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>'],
  warn:['انتبه','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.8 20h18.4zM12 10v4.5M12 17.4v.1"/></svg>'],
  rem:['تذكّر','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.6L7 20z"/></svg>']
};
function cardHTML(kind,o){
  var tg=CARD_TAGS[kind], inner=o.body||((o.eq?'<div class="eqx" dir="ltr">'+o.eq+'</div>':'')+(o.items?'<ul class="dx">'+o.items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':(o.h?'<p class="dx">'+o.h+'</p>':'')));
  return '<div class="dfc '+kind+(o.xs?' xs':(o.sm?' sm':''))+(o.cls?' '+o.cls:'')+'"'+(o.id?' id="'+o.id+'"':'')+'><div class="dh"><span class="dt">'+tg[1]+tg[0]+'</span>'+(o.t?'<b class="dn">'+o.t+'</b>':'')+'</div>'+inner+'</div>';
}
function lawHTML(o){ return cardHTML('law',o) }
function warnHTML(o){ return cardHTML('warn',o) }
function remHTML(o){ return cardHTML('rem',o) }

/* the kind of every slide, shown with one fixed colour and one fixed word (teacher's request, November 2026):
   تمهيد (lead-in) · شرح (explanation) · مثال (worked example) · نشاط (activity or lab) · تدريب (questions to answer) · امتحان (past exams) · تذكرة خروج · الواجب.
   Where it shows: a pill above the title (opposite corner to the page badge), a coloured line under each segment of the progress bar,
   the word in the footer, and a colour key plus a small tag on every row of the lesson index.
   The kind is worked out from the slide's id, title and tag; a lesson can override any slide with  var KINDS={slideId:'act',...}  in src/pages.js.
   Shared by every lesson: build(..., kinds=True) in _core/tools/u4build.py adds this file and u4/kinds.css. */
(function(){
  var K={
    intro:['تمهيد'],
    learn:['شرح'],
    ex:['مثال'],
    act:['نشاط'],
    ask:['تدريب'],
    exam:['امتحان'],
    exit:['تذكرة خروج'],
    hw:['الواجب']
  };
  var ORDER=['intro','learn','ex','act','ask','exam','exit','hw'];
  /* suggested minutes for a slide of each kind (used in the teacher notes) */
  var MIN={intro:3,learn:4,ex:6,act:10,ask:6,exam:6,exit:3,hw:1};
  function kindOf(o){
    var id=o.id||'', t=o.title||'', tg=o.tag||'';
    if(typeof KINDS!=='undefined'&&KINDS[id]) return KINDS[id];
    if(id==='goals') return 'intro';
    if(id==='hw') return 'hw';
    if(/^(tk\d*|final)$/.test(id)||/^تذكرة/.test(t)) return 'exit';
    if(/^(past|exq|noo)/.test(id)||/امتحان/.test(t)||/امتحان/.test(tg)) return 'exam';
    if(/^lab/.test(id)||/^(نشاط|المختبر)/.test(t)||/سباق|مسابقة/.test(t+' '+tg)) return 'act';
    if(/^مثال/.test(t)) return 'ex';

/* «توقّع ثم اكتشف» for the virtual labs and activities (teacher's request, November 2026).
   When a lab slide opens, a card asks for a prediction first (the class says it, the teacher taps it). The lab then runs as usual;
   when its result appears the card comes back with the verdict: the prediction, the right answer and the reason.
   A lesson lists its predictions in src/pages.js:
     var PREDICT={ lab:{q:'…؟', opts:['…','…','…'], ok:1, why:'…', when:'#gb'}, … }
   when: a selector of the element that appears (loses class "hide") when the result is ready, usually the green bar #gb; or the lab fires  el.dispatchEvent(new Event('pred:done'))  itself.
   Not shown in test mode (?pts=all), so the lesson test suites keep running the labs directly; add ?pred=1 to see it there.
   Shared by every lesson: build(..., predict=True) in _core/tools/u4build.py adds this file (it needs book=True: the card family lives in u4/defn.js and u4/book.css). */
(function(){
  var q=''; try{ q=location.search }catch(e){}
  var OFF=/[?&]pts=all/.test(q)&&!/[?&]pred=1/.test(q);
  var _s=slide;
  slide=function(o){
    var P=(typeof PREDICT!=='undefined')&&PREDICT[o.id];
    if(P&&!OFF){
      var oi=o.init, oe=o.enter;
      o.init=function(el){
        var r=oi?oi.apply(this,arguments):undefined;
        attach(el,P);
        return r;
      };
      o.enter=function(el){
        if(el._pred&&el._pred.state==='new') el._pred.open();
        if(oe) return oe.apply(this,arguments);
      };
    }
    _s(o);
  };
  function attach(el,P){
    var hd=el.querySelector('.hd');
    var S={state:'new',pick:-1};
    var box=null, ops=null, chipEl=null;
    /* the card is built on the first arrival, after the card skin has run over the slide (so its text is not wrapped in a reading plate) */
    function ensure(){
      if(box) return;
      box=document.createElement('div'); box.className='predbox'; box.hidden=true;
      box.innerHTML='<div class="dfc pred"><div class="dh"><span class="dt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 20.5h5"/></svg>توقّع</span><b class="dn">قبل أن نبدأ</b></div>'+
        '<p class="dx pq">'+P.q+'</p><div class="pops"></div><div class="pfoot"><button type="button" class="pskip">تخطَّ</button></div></div>';
      ops=box.querySelector('.pops');
      P.opts.forEach(function(t,i){
        var b=document.createElement('button'); b.type='button'; b.className='pop'; b.setAttribute('data-i',i);
        b.innerHTML='<i>'+'أبجدهو'.charAt(i)+'</i><span>'+t+'</span>'; ops.appendChild(b);
        b.addEventListener('click',function(){ S.pick=i; S.state='asked'; close(); chip(); watch() });
      });
      box.querySelector('.pskip').addEventListener('click',function(){ S.state='skipped'; close() });
      el.appendChild(box);
    }
    function chip(){
      if(!hd) return; chipEl=hd.querySelector('.pdc'); if(!chipEl){ chipEl=document.createElement('span'); chipEl.className='pdc'; hd.appendChild(chipEl) }
      chipEl.setAttribute('data-s','asked'); chipEl.innerHTML='<i></i><span>توقّعك: '+short(P.opts[S.pick])+'</span>';
    }
    function short(t){ t=t.replace(/<[^>]+>/g,''); return t.length>26?t.slice(0,25)+'…':t }
    function open(){ if(S.state!=='new') return; ensure(); box.hidden=false; void box.offsetWidth; box.classList.add('on') }
    function close(){ box.classList.remove('on'); setTimeout(function(){ if(!box.classList.contains('on')) box.hidden=true },200) }
    function verdict(){
      if(S.state!=='asked') return; S.state='done';
      var good=S.pick===P.ok;
      if(chipEl){ chipEl.setAttribute('data-s',good?'ok':'no'); chipEl.innerHTML='<i></i><span>'+(good?'توقّعك صحيح':'الصحيح غير توقّعك')+'</span>' }
      box.classList.add('verdict'); box.querySelector('.dt').lastChild.nodeValue=good?'توقّعك صحيح':'النتيجة';
      box.querySelector('.dn').textContent=good?'أحسنت':'قارن مع توقّعك';
      box.querySelector('.pq').innerHTML=(good?'':'<b>توقّعت:</b> '+P.opts[S.pick]+'<br>')+'<b>النتيجة:</b> '+P.opts[P.ok]+'<span class="pwhy">'+P.why+'</span>';
      ops.style.display='none';
      var sk=box.querySelector('.pskip'); sk.textContent='حسناً'; sk.onclick=function(){ close() };
      box.hidden=false; void box.offsetWidth; box.classList.add('on');
    }
    function watch(){
      if(S.watching) return; S.watching=true;
      el.addEventListener('pred:done',verdict);
      var t=P.when&&el.querySelector(P.when);
      if(t) new MutationObserver(function(){ if(!t.classList.contains('hide')&&getComputedStyle(t).display!=='none') verdict() }).observe(t,{attributes:true,attributeFilter:['class','style']});
    }
    el._pred={get state(){return S.state},open:open,verdict:verdict};
    if(el.classList.contains('on')) open();
  }
})();

/* The student's one-page summary of the lesson, printable (teacher's request, November 2026).
   A «ملخص الطالب للطباعة» button in the lesson index (or the key S) opens the page; «طباعة» prints it on one A4 sheet.
   Nothing is written twice: the page is assembled from what the lesson already says —
     the goals (the goals slide), the lesson's own summary bullets («خلاصة الدرس» on the last slide), the definition / law / warning / reminder cards of the slides,
     the homework (last slide) and the pages of the books used (BOOKPG).
   Laws that appear only as a clickable triangle (no static card) are listed in src/pages.js:  var SUMLAWS=[['قانون المول','n = m ÷ M','…'],…]

(function(){
  function parse(s){ var t=document.createElement('div'); try{ t.innerHTML=(typeof s.html==='function')?s.html():'' }catch(e){} return t }
  function clean(h){ return h.replace(/\sstyle="[^"]*"/g,'').replace(/\sclass="(ptn|num|fx[^"]*)"/g,'').replace(/<(button|span class="ck")[^>]*>/g,'').replace(/<\/button>/g,'') }
  function cardsOf(root,kind){
    var out=[]; root.querySelectorAll('.dfc.'+kind).forEach(function(c){
      var n=c.querySelector('.dn'), en=c.querySelector('.de'), eq=c.querySelector('.eqx'), xs=c.querySelectorAll('.dx'), tag=c.querySelector('.dt');
      if(!n&&!eq&&!xs.length) return;
      var items=[]; xs.forEach(function(x){ if(x.tagName==='UL') x.querySelectorAll('li').forEach(function(l){items.push(l.innerHTML)}); else items.push(x.innerHTML.replace(/<span class="eg">[\s\S]*?<\/span>/g,'')) });
      if(kind==='law'&&!eq&&!items.length) return;
      if(items.length===1&&/^\s*؟?\s*$/.test(items[0].replace(/<[^>]+>/g,''))) return;
      out.push({t:n?n.innerHTML:'',en:en?en.textContent:'',eq:eq?eq.innerHTML:'',items:items,tag:tag?tag.textContent.trim():''});
    });
    return out;
  }
  function collect(){
    var D={goals:[],bul:[],defs:[],laws:[],warn:[],rem:[],hw:[],pages:{sb:[],ab:[]}}, seen={};
    SLIDES.forEach(function(s){
      var r=parse(s), id=s.id;
      if(id==='goals') r.querySelectorAll('.gi').forEach(function(g){ var sp=g.querySelectorAll('span'); D.goals.push(clean((sp[sp.length-1]||g).innerHTML)) });
      if(id==='hw'){
        var pl=r.querySelectorAll('.panel'); if(pl[0]) pl[0].querySelectorAll('li').forEach(function(l){ D.bul.push(clean(l.innerHTML)) });
        r.querySelectorAll('.stp').forEach(function(p){ var sp=p.querySelectorAll('span'); D.hw.push(clean((sp[sp.length-1]||p).innerHTML)) });
      }
      [['def','defs'],['law','laws'],['warn','warn'],['rem','rem']].forEach(function(k){
        var cs=(k[0]==='def')?cardsOf(r,'dfc').filter(function(c){return c.tag==='تعريف'}):cardsOf(r,k[0]);
        cs.forEach(function(c){ var key=k[0]+'|'+c.t+'|'+c.eq+'|'+c.items.join('|'); if(!seen[key]){ seen[key]=1; D[k[1]].push(c) } });
      });
    });
    if(typeof SUMLAWS!=='undefined') SUMLAWS.forEach(function(l){ D.laws.push({t:l[0],en:'',eq:l[1],items:l[2]?[l[2]]:[],tag:'قانون'}) });
    if(typeof BOOKPG!=='undefined'){
      var set={sb:{},ab:{}};
      Object.keys(BOOKPG).forEach(function(k){
        var m=/(الطالب|النشاط)\s*ص\s*(\d+)(?:\s*[–-]\s*(\d+))?/.exec(BOOKPG[k].replace(/<[^>]+>/g,'')); if(!m) return;
        var t=set[m[1]==='الطالب'?'sb':'ab'], a=+m[2], b=+(m[3]||m[2]); for(var i=a;i<=b;i++) t[i]=1;
      });
      /* the pages used, merged into ranges: 62, 63, 64, 65 -> 62–65 */
      ['sb','ab'].forEach(function(w){
        var ps=Object.keys(set[w]).map(Number).sort(function(x,y){return x-y}), out=[], i=0;
        while(i<ps.length){ var j=i; while(j+1<ps.length&&ps[j+1]===ps[j]+1) j++; out.push(ps[i]===ps[j]?String(ps[i]):ps[i]+'–'+ps[j]); i=j+1 }
        D.pages[w]=out;
      });
    }
    return D;
  }
  function sec(title,cls,inner){ return inner?'<section class="ss '+cls+'"><h3>'+title+'</h3>'+inner+'</section>':'' }
  function cardHTML(c,kind){

  }

    s+=sec('القوانين','laws','<div class="sg">'+D.laws.map(function(c){return cardHTML(c,'law')}).join('')+'</div>');
    s+=sec('انتبه وتذكّر','tips','<div class="sg">'+D.warn.map(function(c){return cardHTML(c,'warn')}).join('')+D.rem.map(function(c){return cardHTML(c,'rem')}).join('')+'</div>');
    s+=sec('للتدرّب','prac','<ul>'+D.hw.map(function(g){return '<li>'+g+'</li>'}).join('')+'</ul>'+((D.pages.sb.length||D.pages.ab.length)?'<p class="spg">'+(D.pages.sb.length?'كتاب الطالب ص'+pg(D.pages.sb):'')+(D.pages.sb.length&&D.pages.ab.length?' · ':'')+(D.pages.ab.length?'كتاب النشاط ص'+pg(D.pages.ab):'')+'</p>':''));
    s+='<footer>الاسم: ................................. الشعبة: ........</footer></div>';
    return s;
  }
  function open(){

  }
  function close(){ var ov=document.getElementById('sumov'); if(ov) ov.classList.remove('on'); document.documentElement.classList.remove('sum-open') }
  var _boot=boot;
  boot=function(){
    _boot.apply(this,arguments);
    /* the button is in the lesson index (the top bar has no room left at the width the platform gives a lesson beside the class drawer) and on the key S */
    var sh=document.querySelector('#idx .sheet'), h3=sh&&sh.querySelector('h3');
    if(h3){ h3.insertAdjacentHTML('afterend','<button class="sumbtn" id="bSum" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>ملخص الطالب للطباعة <kbd>S</kbd></button>'); document.getElementById('bSum').addEventListener('click',function(){ var ix=document.getElementById('idx'); if(ix) ix.classList.remove('open'); open() }) }

/* ---------- teacher tools in the player (teacher's request, November 2026): pen, highlighter, eraser, laser pointer, timer, blank screen.
   The «أدوات» button in the top bar opens a small dock on the left edge of the slide; every tool also has a key (physical keys, so the Arabic layout works too):
     P pen · H highlighter · E eraser · L laser · T timer · B blank screen · C clear the slide's drawing · Ctrl+Z undo · Esc leave the tool
   Drawings belong to the slide they were made on (kept in memory until the page is closed) and are stored in stage coordinates (1280×720), so they scale with the stage.
   While the pen, highlighter or eraser is on, the slide itself is not clickable; press Esc or the same tool again to go back to the slide. The laser and the timer never block the slide. ---------- */
var TOOLS=(function(){
  var COLS=['#FFD54A','#FF5A4E','#4DD0FF','#6BE58A','#FFFFFF'], COLN=['أصفر','أحمر','أزرق','أخضر','أبيض'];
  var S={tool:'',col:0,open:false}, strokes={}, undone={}, cv,cx,dock,dot,tmr,blank,toast,btn, cur=0, live=null, tt=0;
  var T={total:180,left:180,end:0,iv:0,run:false,over:false};
  var NAMES={pen:'القلم',hl:'التظليل',er:'الممحاة',laser:'المؤشر الليزري'};
  var IC={
    pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
    hl:'<path d="M9 15l7.5-7.5 3 3L12 18H9z"/><path d="M5 21h7"/>',
    er:'<path d="M7 18l-3-3 9.5-9.5 6 6L12 18z"/><path d="M12 18h8"/>',
    laser:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
    undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/>',
    clear:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
    timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.6 2M9 3h6"/>',
    blank:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
    tools:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>'
  };
  function svg(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'}
  function el(h){var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild}
  function pad(n){return (n<10?'0':'')+n}
  function say(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove('on')},2600) }

  /* ----- drawing ----- */
  function list(){return strokes[cur]||(strokes[cur]=[])}
  function paint(){
    cx.clearRect(0,0,1280,720);
    var all=list().concat(live&&!live.er?[live]:[]);
    all.forEach(function(s){
      if(!s.p.length) return;
      cx.save(); cx.lineCap='round'; cx.lineJoin='round'; cx.strokeStyle=s.c; cx.lineWidth=s.w; cx.globalAlpha=s.h?0.38:1;
      cx.beginPath(); cx.moveTo(s.p[0][0],s.p[0][1]);
      if(s.p.length===1) cx.lineTo(s.p[0][0]+0.01,s.p[0][1]);
      for(var i=1;i<s.p.length-1;i++){ var a=s.p[i], b=s.p[i+1]; cx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2) }
      if(s.p.length>1){ var z=s.p[s.p.length-1]; cx.lineTo(z[0],z[1]) }

    });
  }
  function pt(e){var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*1280/r.width,(e.clientY-r.top)*720/r.height]}
  function down(e){
    if(!S.tool||S.tool==='laser'||e.button>0) return;
    e.preventDefault(); try{cv.setPointerCapture(e.pointerId)}catch(x){}
    var p=pt(e);
    if(S.tool==='er'){ live={er:true}; erase(p); return }
    live={c:COLS[S.col],w:S.tool==='hl'?30:5,h:S.tool==='hl',p:[p]}; paint();
  }
  function move(e){
    if(!live) return;

    if(live.er){ erase(p); return }
    var q=live.p[live.p.length-1]; if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])<1.5) return;

  }
  function up(){

  }
  function erase(p){

  function clearAll(){

  }

  /* ----- tools on / off ----- */
  function setTool(t){

/* a term: Arabic name with its English form (the book gives both) */
function tm(a,e){ return '<b>'+a+'</b>'+(e?' <span class="en">'+e+'</span>':'') }

/* an ion or a gas formula in running text: ion('NO3','−') -> NO3 with its subscript and charge; ion('Mg','2+') */
function ion(f,ch){ return '<span class="ion" dir="ltr">'+sub(f)+(ch?'<sup>'+ch+'</sup>':'')+'</span>' }

/* a photograph of the book inside a card, with its caption */
function phHTML(key,cap,w,h){ return '<figure class="phf"><img src="'+PHOTO[key]+'" alt="" style="width:'+(w||260)+'px'+(h?';height:'+h+'px':'')+'"><figcaption>'+cap+'</figcaption></figure>' }

/* a picture that follows the points: its parts carry data-s="n" and show when n points are showing (or fewer) */
function ptSync(el){
  var pts=$$('[data-pt]',el);
  function upd(){
    var n=pts.filter(function(p){return !p.classList.contains('pt-h')}).length;
    $$('[data-s]',el).forEach(function(g){ g.classList.toggle('on',+g.getAttribute('data-s')<=n) });
  }
  if(window.MutationObserver){ var mo=new MutationObserver(upd); pts.forEach(function(p){ mo.observe(p,{attributes:true,attributeFilter:['class']}) }) }
  upd();
}

/* show every part of a picture that follows the points (for slides where the points are not used) */
function allOn(el){ $$('[data-s]',el).forEach(function(g){ g.classList.add('on') }) }

/* Explanation slide, the way the teacher teaches it: a lead-in question first (right column), then the points one click at a time (middle column),
   and, when the slide has a picture, the picture in its own column on the left (it can follow the points: ptSync).
   o: {id,ch,title,tag,lead:{q,opts:[{t,ok,why}],gbar},fig:html under the question,fig2:html in the picture column,fw:its width,pts:[html or {html}],lw:width of the question column,sync:true,init,note} */
/* where the right choice of a lead-in question sits (first, middle or last): a fixed rotation so it is not always in the same place (teacher's rule); o.lead.at overrides */
var AT_SEQ=[1,2,0,0,2,1,2,0,1], AT_N=0;
function placeOk(root,opts,at){
  var box=$('.opts',root); if(!box) return;
  var ok=-1; opts.forEach(function(x,i){ if(x.ok) ok=i });
  var kids=Array.prototype.slice.call(box.children), me=kids.filter(function(k){return +k.getAttribute('data-i')===ok})[0];
  if(!me) return;
  box.removeChild(me); var rest=Array.prototype.slice.call(box.children);
  if(at>=rest.length) box.appendChild(me); else box.insertBefore(me,rest[at]);
  Array.prototype.slice.call(box.children).forEach(function(k,n){ var ix=k.querySelector('.ix'); if(ix) ix.textContent='أبجدهـ'[n] });
}
function explain(o){
  var at=(o.lead&&o.lead.at!=null)?o.lead.at:AT_SEQ[AT_N++%AT_SEQ.length];
  slide({id:o.id,ch:o.ch,title:o.title,tag:o.tag,
   html:function(){
    var L='';
    if(o.lead){
      L+='<div class="panel lq'+((o.fig||o.leadTop)?' cmp':'')+'" style="padding:14px 18px;gap:8px"><div class="q">'+o.lead.q+'</div>'+optsHTML(o.lead.opts)+'<div class="fb" style="min-height:26px"></div></div>';
      if(o.lead.gbar) L+='<div class="gbar hide" id="gb" style="font-size:21px">'+o.lead.gbar+'</div>';
    }
    if(o.fig) L+=o.fig;
    var P='<div class="col" style="flex:1;min-width:0;gap:'+(o.gap||10)+'px;justify-content:center">'+(o.leadTop?L:'')+o.pts.map(function(h){return typeof h==='string'?'<div class="panel pb" data-pt'+(o.fs?' style="font-size:'+o.fs+'px"':'')+'>'+h+'</div>':h.html}).join('')+'</div>';
    var F=o.fig2?'<div class="col" style="width:'+(o.fw||430)+'px;flex:none;gap:10px;justify-content:center">'+o.fig2+'</div>':'';
    return '<div style="display:flex;gap:20px;flex:1;align-items:stretch">'+(L&&!o.leadTop?'<div class="col" style="width:'+(o.lw||440)+'px;flex:none;gap:12px;justify-content:center">'+L+'</div>':'')+P+F+'</div>';
   },
   init:function(el){
    if(o.lead){ bindMcq($('.lq',el),o.lead.opts,$('.fb',el),function(){ unhide(el) }); placeOk($('.lq',el),o.lead.opts,at) }
    if(o.sync) ptSync(el);
    if(o.init) o.init(el);
   },
   note:o.note});
}

/* text: t is a string or an array of lines, centred on (x,y); c an optional class (lt = Latin, sm = smaller, dk = dark ink) */
function tt(x,y,t,c,fs){
  var a=Array.isArray(t)?t:[t], f=fs?Math.round(fs*1.28):0, g=f?f*1.2:20, s='';
  a.forEach(function(l,i){ s+='<text x="'+x+'" y="'+(y+(i-(a.length-1)/2)*g)+'"'+(c?' class="'+c+'"':'')+(f?' style="font-size:'+f+'px"':'')+'>'+l+'</text>' });

function pill(x,y,t,f,c,fs){ var w=Math.max(34,String(t).length*8+16); return rc(x-w/2,y-12,w,24,f||'rgba(255,255,255,.2)','rgba(255,255,255,.55)',12)+tt(x,y,t,'lt '+(c||''),fs||12) }

 pts:['في دورة الكربون يُثبَّت ثاني أكسيد الكربون (جزيء غير عضوي من الطور غير الحيوي) خلال التمثيل الضوئي إلى <b>جلوكوز</b>.',
  'يُحوَّل الجلوكوز لاحقاً إلى جزيئات أخرى يحتاج إليها المنتج (مثل <b>النشا</b>)، وبذلك يكون قد <b>تم تمثيله غذائياً</b> وصار جزءاً من الطور الحيوي.',
  'تنتقل المغذيات في الطور الحيوي من كائن حي إلى آخر عن طريق <b>التغذية</b>، أي على طول السلسلة الغذائية من المنتجات إلى المستهلكات.',
  'يفقد كل كائن بعض هذه المغذيات بالتبرز والإخراج، وبعضها يبقى داخل المركبات العضوية حتى يموت. وتوجد المغذيات في هذا الطور على شكل <b>مركبات عضوية</b> مثل الكربوهيدرات والدهون والبروتينات.'],

  '<div class="chip3 ab" data-s="1">ثاني أكسيد الكربون '+ion('CO2')+'<small>طور غير حيوي</small></div><div class="fa" data-s="1">▼ التمثيل الضوئي</div>'+
  '<div class="chip3 bi" data-s="1">الجلوكوز<small>طور حيوي</small></div><div class="fa" data-s="2">▼ يتحول إلى</div>'+
  '<div class="chip3 bi" data-s="2">النشا في المنتج</div><div class="fa" data-s="3">▼ التغذية</div>'+
  '<div class="chip3 bi" data-s="3">المستهلكات</div><div class="fa" data-s="4">▼ التبرز والإخراج والموت</div>'+
  '<div class="chip3 ab" data-s="4">المحلّلات ← عودة إلى الطور غير الحيوي</div></div>',fw:340,sync:true,fs:22,gap:12,
 note:'<ul><li>كتاب الطالب ص١٠٢ («الطور الحيوي»): النقاط من نص الكتاب بتصرف يسير. الكربون مثال في الكتاب نفسه: «في دورة الكربون يتم تثبيت ثاني أكسيد الكربون ... خلال عملية التمثيل الضوئي إلى الجلوكوز ... وبذلك يكون قد تم تمثيله غذائياً وأصبح الآن جزءاً من الطور الحيوي».</li><li>سلسلة المربعات على اليسار ترتيبي بالكود (من عندي) وتتبع النقاط.</li></ul>'});

/* 11 the abiotic phase (student book p. 102) */
explain({id:'abio',ch:2,title:'الطور غير الحيوي: المغذيات بعد الموت',tag:'ثلاثة أشكال',
 pts:['تفكّك <b>المحلّلات</b> الكائنات الحية بعد الموت، فتعود المغذيات إلى حالتها غير العضوية، أي إلى <b>الطور غير الحيوي</b> من الدورة.',
  'وتكون المغذيات في هذا الطور على عدة أشكال: <b>أيونات ذائبة في الماء</b> (مثل '+ion('Mg','2+')+' و'+ion('CO3','2−')+' و'+ion('PO4','3−')+' و'+ion('NO3','−')+').',
  '<b>غازات في الغلاف الجوي</b> (مثل '+ion('CO2')+').',
  '<b>رواسب</b> يمكن أن تتحول فيما بعد إلى صخور.'],
 fig2:'<div class="panel" style="padding:8px">'+abioSVG()+'</div>',fw:440,sync:true,fs:22,gap:12,
 note:'<ul><li>كتاب الطالب ص١٠٢ («الطور غير الحيوي»): «تفكك المحللات الكائنات الحية بعد الموت، الأمر الذي يؤدي إلى عودة المغذيات إلى حالتها غير العضوية ... وتكون المغذيات خلال هذا الطور من الدورة على عدة أشكال: أيونات ذائبة في الماء، غازات في الغلاف الجوي، رواسب يمكن أن تتحول فيما بعد إلى صخور».</li><li>الرسم (غلاف جوي وماء وقاع) بالكود، تخطيطي. تظهر أجزاؤه مع النقاط الثانية والثالثة والرابعة.</li></ul>'});

/* 13 case study 3-1: salmon and trees (student book p. 103) */
explain({id:'salm1',ch:2,title:'دراسة حالة 3-1: أهمية السلمون في نمو الأشجار',tag:'دراسة حالة',
 pts:['يعود السلمون كل عام إلى مجرى المياه العذبة الذي وُلد فيه ليتكاثر، فتأكله المفترسات مثل <b>الدببة والنسور</b>؛ وبهذا تُزال المغذيات من البيئة البحرية.',
  'يُقدَّر أن الدب الواحد في كولومبيا البريطانية يصطاد <b>700</b> سمكة سلمون في موسم التكاثر؛ يأكل نصف ما يصطاده بعيداً عن الماء، وتأكل القمامة والحشرات النصف الآخر.',
  'تعود المركبات العضوية الناتجة من تحلل السلمون إلى التربة فتمتصها جذور الأشجار؛ وغالباً ما تكون <b>النترات</b> عاملاً محدّداً لنمو النبات.',
  'توفر الأسماك ما يصل إلى <b>120 kg</b> من النيتروجين لكل هكتار من الغابات، فتنمو الأشجار <b>ثلاث مرات أسرع</b>: حلقة تغذية راجعة إيجابية.'],
 fig2:'<div class="col" style="gap:8px;align-items:center">'+phHTML('salmon','الصورة 3-6: سلمون المحيط الهادئ يتحرك نحو أعلى النهر لوضع البيض',330)+phHTML('eagle','الصورة 3-7: نسر يصطاد سمكة سلمون',330)+'</div>',fw:350,fs:21,gap:10,
 note:'<ul><li>كتاب الطالب ص١٠٣: دراسة الحالة ٣-١ «أهمية السلمون في نمو الأشجار» بنصّها بتصرف يسير. الصورتان من الكتاب (الصورة ٣-٦ والصورة ٣-٧).</li><li>الحصاد بالإنسان طريقة مهمة لإزالة المغذيات من البيئة البحرية، وتُزال أيضاً بهجرة كائنات بحرية مثل السلمون إلى المياه العذبة (الهدف ٣-١٧).</li></ul>'});

/* 14 case study 3-1: the loop and the questions (student book p. 103) */
slide({id:'salm2',ch:2,title:'دراسة حالة 3-1: أسئلة',tag:'اضغط لتظهر',
 html:function(){
  var Q=[['1 (أ) اشرح سبب أهمية نمو الأشجار لبقاء سمك السلمون.','تظلّل الأشجار مجرى الماء فلا يسخن (الماء الدافئ فيه أكسجين أقل فتقل البيوض القادرة على البقاء)، وتمنع تعرية التربة ودخول الرواسب فيبقى الماء صافياً، وتعيش عليها حشرات تغذّي صغار السلمون عند تفقيسها.'],
   ['1 (ب) اشرح كيف يساعد سمك السلمون على زيادة نمو الأشجار.','تأكله الدببة والنسور وتنقل بقاياه إلى الغابة؛ وعند تحلل بقاياه تعود المركبات العضوية (ومنها النيتروجين) إلى التربة، وتمتصها جذور الأشجار على شكل نترات، فتنمو أسرع.'],
   ['2 اقترح نوع كائن حي، غير الأشجار، يمكن أن يستفيد من المغذيات في جسم السلمون.','الدببة والنسور (تتغذى عليه)، والقمامات والحشرات (تأكل بقاياه)، والمحلّلات (بكتيريا وفطريات)، والنباتات الصغيرة قرب الضفاف. [من عندي]'],
   ['3 افترض أنك تعمل في مجال صون البيئة: اشرح ما إذا كنت ستبدأ بالحفاظ على الغابات أم السلمون. فسّر إجابتك.','إجابة مفتوحة. مثال مقبول: أبدأ بالغابات لأن إزالتها تُنهي الظلّ وتثبيت التربة والماء الصافي معاً، أما السلمون فيمكن أن يتعافى عدده إذا بقي موطنه؛ ومع ذلك فالاثنان مرتبطان بحلقة تغذية راجعة إيجابية فحماية أحدهما تحمي الآخر. [من عندي]']];
  return `<div style="display:flex;gap:16px;flex:1;align-items:stretch"><div class="col" style="width:440px;flex:none;gap:8px;justify-content:center"><div class="panel" style="padding:8px">${salmSVG()}</div><div class="sm" style="font-size:16px;text-align:center;color:var(--muted)">حلقة تغذية راجعة إيجابية (رسم تخطيطي)</div></div><div class="col" style="flex:1;min-width:0;gap:7px;justify-content:center">${qaHTML(Q,'tn')}</div></div>`;},
 init:function(el){ allOn(el); bindCards(el,function(){}) },
 note:'<ul><li>كتاب الطالب ص١٠٣: أسئلة دراسة الحالة ٣-١ (١ أ وب، ٢، ٣). الإجابات من عندي (دليل المعلم غير متوفر) بناءً على نص دراسة الحالة؛ والسؤال ٣ مفتوح.</li><li>الرسم على اليمين: حلقة التغذية الراجعة الإيجابية (كلما زاد السلمون نمت الأشجار أفضل، وصارت ظروف المجرى أنسب لوضع بيض السلمون). مرسوم بالكود.</li></ul>'});

slide({id:'q911',ch:4,title:'أسئلة الكتاب 9 و10 و11',tag:'اضغط لتظهر',

  var Q=[['9 (أ) صف المقصود بالمصطلحين: حيوي وغير حيوي، في سياق دورات المغذيات.','حيوي: المكوّنات الحية للنظام البيئي حيث تكون المغذيات على شكل مركبات عضوية (كربوهيدرات ودهون وبروتينات). غير حيوي: المكوّنات غير الحية حيث تكون المغذيات غير عضوية (أيونات ذائبة في الماء، غازات في الغلاف الجوي، رواسب وصخور).'],
   ['9 (ب) اشرح كيفية انتقال المغذيات من الطور غير الحيوي إلى الطور الحيوي من دورة مغذٍّ.','تمتصها المنتجات (كالعوالق النباتية) وتمثّلها غذائياً: تثبّت المغذيات غير العضوية في مركبات عضوية، كتثبيت CO₂ بالتمثيل الضوئي إلى جلوكوز، أو استخدام النترات لتكوين أحماض أمينية وبروتينات.'],
   ['10 (أ) صف كيفية انتقال المغذيات في الطور الحيوي من الدورة.','تنتقل من كائن حي إلى آخر عن طريق التغذية، أي على طول السلسلة الغذائية من المنتجات إلى المستهلكات؛ ويفقد كل كائن بعضها بالتبرز والإخراج، ويبقى بعضها في مركباته العضوية حتى يموت.'],

 init:function(el){

slide({id:'eou7',ch:6,title:'أسئلة نهاية الوحدة: 7 (التيارات الصاعدة والمغذيات)',tag:'ص113',

  var Q=[['7 (أ) 1 · صف كيف تدخل المياه الغنية بالمغذيات القادمة من أعماق المحيط خزان المغذيات على السطح. [2]','بالتيار الصاعد للمياه: عندما تهبّ الرياح بمحاذاة الشاطئ تُزيح الماء السطحي بعيداً فيحل محله ماء عميق بارد غني بالمغذيات (من تحلل الكائنات الغارقة) يصعد إلى السطح ويضيف مغذياته إلى الخزان.'],
   ['2 · اذكر طريقتين أخريين تدخل بهما المغذيات الطبقات السطحية. [2]','أي اثنتين من: الجريان السطحي من اليابسة؛ ذوبان غازات الغلاف الجوي؛ الإخراج والتحلل؛ النشاط التكتوني (الفوهات الحرارية والتعرية والبراكين).'],

   ['2 · اشرح كيف تكون زيادة المغذيات في الطبقات السطحية ضارة. [2]','تسبب ازدهار الطحالب (قد تكون ضارة)، ثم موتها وتحللها بالبكتيريا التي تستهلك الأكسجين، فينشأ نقص الأكسجين ومناطق ميتة تموت فيها الكائنات الحية.'],

/* one numeral style on the slides: Western digits (as in the answer boxes, the formulas and the student book). The slide sources and the
   feedback lines still contain Arabic-Indic digits in many places, so every text node that appears inside the stage is converted as it arrives,
   together with the Arabic decimal point, thousands comma and percent sign that go with those digits (1٫5 -> 1.5, ٢٥٪ -> 25%).
   The player's own bar and the teacher notes (outside the stage) keep their style. Teacher's request: "الأرقام لازم متماثلة".
   Shared by every lesson: build(..., digits=True) in _core/tools/u4build.py adds this file. */
(function(){
  var RE=/[٠-٩٪٫٬]/;
  function conv(s){
    return s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632})
            .replace(/(\d)٫(?=\d)/g,'$1.').replace(/(\d)٬(?=\d)/g,'$1,').replace(/٪/g,'%')
  }
  function fix(n){
    if(n.nodeType===3){ if(RE.test(n.nodeValue)) n.nodeValue=conv(n.nodeValue); return }
    if(n.nodeType!==1) return;
    var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT), t;
    while((t=w.nextNode())){ if(RE.test(t.nodeValue)) t.nodeValue=conv(t.nodeValue) }
  }
  function start(){
    var st=document.getElementById('stage'); if(!st){ setTimeout(start,50); return }
    fix(st);
    new MutationObserver(function(ms){ ms.forEach(function(m){ if(m.type==='characterData') fix(m.target); else Array.prototype.forEach.call(m.addedNodes,fix) }) })
      .observe(st,{childList:true,characterData:true,subtree:true});
  }
  start();
})();


})();
