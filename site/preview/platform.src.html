<title>نماذج المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*CORE_CSS*/
/* the platform shell: one frame for the home page and the teacher's records; the lesson view keeps the lesson player's frame */
body{overflow:auto; background:var(--c-bg)}
.app{position:static!important; display:block!important; inset:auto!important}
.view{position:fixed; inset:0; overflow:hidden}
.page{position:relative; z-index:2; min-height:100vh; padding:24px 48px 44px; max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.top2{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.top2 .brand{font-size:26px}
.top2 .sp{flex:1}
/*THEME4_CSS*/
/*THEME5_CSS*/
/*STICKERS_CSS*/

/* ---- vocabulary used by every screen ---- */
.pill{font:700 19px var(--font-display); color:var(--ink); background:rgba(var(--d2),.72); border:1px solid rgba(var(--t2),.35); border-radius:999px; padding:7px 20px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none}
.pill:hover{border-color:rgba(var(--t1),.9)}
.pill.on{background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border-color:transparent}
.pill svg{width:20px; height:20px}
.sample{font:700 16px var(--font-display); color:var(--muted); border:1px dashed rgba(var(--t2),.5); border-radius:999px; padding:4px 14px}
.glass{background:linear-gradient(145deg,rgba(var(--p1),.82),rgba(var(--p2),.76)); border:1.5px solid rgba(var(--t2),.42); border-radius:20px; padding:18px 22px; box-shadow:0 14px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.gbtn{background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border:0; border-radius:14px; padding:9px 22px; min-height:46px; font:800 20px var(--font-display); cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none}
.gbtn:hover{filter:brightness(1.06)} .gbtn:active{transform:scale(.97)}
.sbtn{background:rgba(var(--t1),.16); color:var(--ink); border:1px solid rgba(var(--t2),.45); border-radius:14px; padding:8px 18px; min-height:46px; font:700 19px var(--font-display); cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.sbtn:hover{background:rgba(var(--t1),.28)} .sbtn svg,.gbtn svg{width:21px; height:21px}
.h1{margin:0; font:800 46px/1.15 var(--font-display); color:#fff; text-shadow:0 2px 14px rgba(var(--d1),.7)}
.h1 b{color:var(--gold)}
.sub{margin:6px 0 0; font:600 22px var(--font-body); color:var(--muted)}
.h2{margin:0; font:800 28px var(--font-display)}
.mut{color:var(--muted)}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.hide{display:none!important}
.ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.tag{display:inline-flex; align-items:center; gap:6px; font:700 16px var(--font-display); border-radius:999px; padding:2px 12px; background:rgba(var(--d2),.7); border:1px solid rgba(var(--t2),.3)}
.tag.warn{background:rgba(255,196,80,.16); border-color:rgba(255,196,80,.6); color:#ffd88a}
.tag.bad{background:rgba(255,138,122,.16); border-color:rgba(255,138,122,.6); color:#ffb3a8}
.tag.good{background:rgba(166,242,138,.14); border-color:rgba(166,242,138,.55); color:#c8f7b6}
.bar{height:10px; border-radius:6px; background:rgba(var(--t2),.2); overflow:hidden}
.bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(to left,var(--gold),#f3d27a)}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60; max-width:min(92vw,640px); background:#0b1320; color:#fff; border:1.5px solid var(--gold); border-radius:14px; padding:12px 22px; font:700 19px var(--font-display); box-shadow:0 14px 40px rgba(0,0,0,.55)}

/* ---- home ---- */
.today{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
.tcard{display:flex; flex-direction:column; gap:8px; padding:16px 20px}
.tcard .pn{font:800 18px var(--font-display); color:var(--cyan)}
.tcard .cl{font:800 34px var(--font-display); line-height:1}
.tcard .ls{font:700 20px var(--font-body); color:var(--muted); min-height:30px}
.catbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.cprog{display:flex; align-items:center; gap:12px; margin-inline-start:auto; font:700 19px var(--font-display); color:var(--muted)}
.cprog .bar{width:160px}
.unit{padding:0; overflow:hidden}
.unit>button{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:14px; padding:16px 22px; cursor:pointer}
.unit>button:focus-visible{outline:3px solid var(--accent); outline-offset:-3px}
.unit .un{font:800 18px var(--font-display); color:#171100; background:linear-gradient(145deg,#F3D27A,#D9A92B); border-radius:10px; padding:2px 12px; white-space:nowrap}
.unit .ut{font:800 23px var(--font-display); flex:1}
.unit .cv{transition:transform 220ms var(--ease-out)} .unit.open .cv{transform:rotate(-90deg)}
.lgrid{display:none; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; padding:2px 22px 20px}
.unit.open .lgrid{display:grid}
.lc{display:flex; flex-direction:column; gap:6px; padding:14px 16px; border-radius:16px; background:rgba(var(--d2),.62); border:1px solid rgba(var(--t2),.3); text-decoration:none; color:var(--ink)}
.lc .cd{font:800 17px var(--font-display); color:var(--cyan)}
.lc .tt{font:800 20px/1.3 var(--font-display)}
.lc.built{border-color:rgba(228,188,75,.7); background:linear-gradient(145deg,rgba(var(--p1),.8),rgba(var(--p2),.7)); cursor:pointer}
.lc.built:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,.4)}
.lc .st{margin-top:auto; font:700 16px var(--font-display); color:var(--muted)}
.lc.built .st{color:var(--gold)}
.lc:not(.built){opacity:.55}

/* ---- the lesson view with the class drawer ---- */
.lv{position:fixed; inset:0; z-index:5; display:flex; flex-direction:column}
.lv .top{flex:none; height:60px}
.lv .bot{flex:none; height:68px}
.lv .mid{flex:1; min-height:0; display:flex; gap:0}
.stagebox{flex:1; min-width:0; display:grid; place-items:center; padding:14px 18px}
.fs{container-type:inline-size; width:min(100%, calc((100vh - 168px) * 1.7778)); aspect-ratio:16/9; border-radius:22px; border:2px solid rgba(var(--t2),.45); background:linear-gradient(150deg,rgba(var(--p1),.9),rgba(var(--p2),.85)); box-shadow:0 20px 60px rgba(0,0,0,.5)}
.fsi{width:100%; height:100%; padding:4cqw 5cqw; display:flex; flex-direction:column; gap:2.4cqw; justify-content:center}
.fs .t{font:800 2.1cqw var(--font-display); color:var(--cyan)}
.fs h2{margin:0; font:800 4.6cqw/1.15 var(--font-display)}
.fs .eq{font:800 5.4cqw var(--font-display); color:var(--gold); direction:ltr; text-align:center}
.fs p{margin:0; font:600 2.5cqw/1.5 var(--font-body); color:var(--ink)}
.fs .os{display:flex; gap:1.6cqw}
.fs .os button{flex:1; border:0; border-radius:1.4cqw; padding:1.6cqw 1cqw; font:800 2.4cqw var(--font-display); background:rgba(var(--t2),.16); color:var(--ink); box-shadow:inset 0 0 0 .22cqw rgba(var(--t2),.4)}
.fs .os button.ok{background:rgba(166,242,138,.2); box-shadow:inset 0 0 0 .3cqw var(--ok)}
.fs .os button.no{background:rgba(255,138,122,.16); box-shadow:inset 0 0 0 .3cqw var(--bad)}
.drawer{flex:none; width:0; overflow:hidden; transition:width 340ms var(--ease-out)}
.drawer.open{width:440px}
.dr-in{width:440px; height:100%; display:flex; flex-direction:column; gap:10px; padding:12px 12px 12px 18px}
.dr{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:14px 14px 12px; background:linear-gradient(160deg,rgba(var(--p1),.95),rgba(var(--d2),.97))}
.dr-h{display:flex; align-items:center; gap:10px}
.dr-h b{font:800 26px var(--font-display)}
.ctx{display:flex; flex-wrap:wrap; gap:6px}
.ctx .tag{font-size:15px}
.sum3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.sum3 div{border-radius:12px; padding:6px 4px; text-align:center; background:rgba(var(--d2),.7); border:1px solid rgba(var(--t2),.3); font:700 14px var(--font-display); color:var(--muted)}
.sum3 b{display:block; font:800 26px/1.1 var(--font-display); color:var(--ink)}
.sum3 .g b{color:var(--ok)} .sum3 .y b{color:#ffd88a}
.tools{display:flex; gap:8px}
.tools .sq{flex:1; display:flex; align-items:center; gap:8px; border-radius:12px; padding:0 12px; min-height:46px; background:rgba(var(--d2),.7); border:1px solid rgba(var(--t2),.35)}
.tools input{all:unset; flex:1; min-width:0; font:600 18px var(--font-body); color:var(--ink)}
.tools input::placeholder{color:var(--muted)}
.ib{width:46px; height:46px; border-radius:12px; border:1px solid rgba(var(--t2),.4); background:rgba(var(--t1),.16); display:grid; place-items:center; cursor:pointer; color:var(--ink); padding:0}
.ib:hover{background:rgba(var(--t1),.3)} .ib.on{background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100}
.ib svg{width:22px; height:22px}
.slist{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:7px; padding-inline-end:4px}
.stu{border-radius:14px; background:rgba(var(--d2),.6); border:1px solid rgba(var(--t2),.28); padding:5px 6px 5px 6px; display:grid; grid-template-columns:1fr auto; gap:2px 6px; align-items:center}
.stu.has{border-color:rgba(166,242,138,.6); background:rgba(166,242,138,.08)}
.stu.zero{border-color:rgba(255,196,80,.55); background:rgba(255,196,80,.07)}
.stu .nm{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; min-height:50px; padding:0 10px; cursor:pointer; border-radius:10px; font:800 21px var(--font-display)}
.stu .nm:active{background:rgba(var(--t1),.22)}
.stu .nm:focus-visible{outline:3px solid var(--accent)}
.cnt{min-width:40px; height:34px; border-radius:17px; display:grid; place-items:center; padding:0 10px; font:800 19px var(--font-display); background:rgba(var(--t2),.14); color:var(--muted)}
.has .cnt{background:var(--ok); color:#06281a} .zero .cnt{background:#ffd88a; color:#2a1c00}
.cnt.pop{animation:pop 320ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.prev{margin-inline-start:auto; font:600 14px var(--font-body); color:var(--muted)}
.acts{display:flex; gap:4px}
.acts button{width:44px; height:44px; border-radius:11px; border:1px solid rgba(var(--t2),.3); background:rgba(var(--t1),.1); display:grid; place-items:center; color:var(--ink); cursor:pointer; padding:0}
.acts button:hover{background:rgba(var(--t1),.26)}
.acts button.pos{color:#c8f7b6} .acts button.neg{color:#ffb3a8}
.acts svg{width:21px; height:21px} .acts .dn svg{transform:scaleY(-1)}
.recs{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; padding:0 8px 4px}
.recs:empty{display:none}
.rs{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; padding:2px 8px 6px}
.rs button{border:1px dashed rgba(var(--t2),.55); background:rgba(var(--d2),.7); color:var(--ink); border-radius:999px; padding:5px 14px; min-height:40px; font:700 17px var(--font-display); cursor:pointer}
.rs button:hover{border-style:solid; background:rgba(var(--t1),.25)}
.dr-f{display:flex; gap:8px}
.dr-f .sbtn{flex:1; justify-content:center; font-size:17px; padding:6px 10px}
.pick{position:absolute; inset:0; z-index:30; display:grid; place-items:center; background:rgba(2,8,20,.72); backdrop-filter:blur(3px)}
.pick .box{min-width:min(560px,86%); text-align:center; display:flex; flex-direction:column; gap:14px; padding:26px 30px; align-items:center}
.pick .who{font:800 64px/1.1 var(--font-display); color:var(--gold); min-height:72px; text-shadow:0 0 28px rgba(228,188,75,.45)}
.pick.rolling .who{color:var(--ink); text-shadow:none}
.stagewrap{position:relative; flex:1; min-width:0; display:flex}

/* ---- records ---- */
.seg2{display:flex; gap:8px; flex-wrap:wrap}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.ccard{display:flex; flex-direction:column; gap:10px}
.ccard .nm{font:800 40px/1 var(--font-display)}
.ccard .ml{display:flex; justify-content:space-between; font:700 18px var(--font-display); color:var(--muted)}
.ccard.add{border-style:dashed; align-items:center; justify-content:center; text-align:center; min-height:200px; cursor:pointer; color:var(--muted)}
.ccard.add:hover{border-color:rgba(var(--t1),.9); color:var(--ink)}
.ttab{display:grid; grid-template-columns:90px repeat(7,minmax(0,1fr)); gap:6px}
.ttab .hd{font:800 16px var(--font-display); color:var(--muted); text-align:center; padding:4px 0}
.ttab .dy{font:800 19px var(--font-display); display:flex; align-items:center}
.ttab .sl{min-height:46px; border-radius:11px; display:grid; place-items:center; font:800 18px var(--font-display); background:rgba(var(--d2),.5); border:1px dashed rgba(var(--t2),.2); color:transparent}
.ttab .sl.f{border:1px solid transparent; color:#171100}
.k1{background:linear-gradient(145deg,#F3D27A,#D9A92B)} .k2{background:linear-gradient(145deg,#8fd0ff,#4a9be0)} .k3{background:linear-gradient(145deg,#a8f0c8,#4cc98f)}
.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.tile{display:flex; flex-direction:column; gap:2px; padding:14px 18px}
.tile b{font:800 44px/1.1 var(--font-display)}
.tile span{font:700 18px var(--font-display); color:var(--muted)}
.tile.g b{color:var(--ok)} .tile.r b{color:#ffb3a8}
.fl{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px}
.fcard{display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; background:rgba(var(--d2),.65); border:1px solid rgba(255,196,80,.5); cursor:pointer; text-align:start; color:var(--ink); font:inherit}
.fcard:hover{background:rgba(var(--t1),.2)}
.fcard b{font:800 22px var(--font-display); display:block}
.fcard span{font:600 17px var(--font-body); color:var(--muted)}
.rt{width:100%; border-collapse:separate; border-spacing:0 6px}
.rt th{font:700 17px var(--font-display); color:var(--muted); text-align:start; padding:4px 12px; cursor:pointer; white-space:nowrap}
.rt td{background:rgba(var(--d2),.62); padding:9px 12px; font:700 20px var(--font-display); border-block:1px solid rgba(var(--t2),.22)}
.rt td:first-child{border-radius:0 12px 12px 0; border-inline-start:1px solid rgba(var(--t2),.22)}
.rt td:last-child{border-radius:12px 0 0 12px; border-inline-end:1px solid rgba(var(--t2),.22)}
.rt tr.lk{cursor:pointer} .rt tr.lk:hover td{background:rgba(var(--t1),.2)}
.rt .bar{width:120px; display:inline-block; vertical-align:middle; margin-inline-start:8px}
.hd2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.cmp{display:flex; flex-direction:column; gap:8px}
.cmp .ln{display:grid; grid-template-columns:130px 1fr 60px; gap:10px; align-items:center; font:700 18px var(--font-display)}
.cmp .bar{height:14px}
.cmp .ln.me .bar i{background:linear-gradient(to left,#ff9a8a,#ffb3a8)}
.tl{display:flex; flex-direction:column; gap:10px}
.ev{display:grid; grid-template-columns:150px 1fr; gap:14px; padding:12px 16px; border-radius:14px; background:rgba(var(--d2),.62); border:1px solid rgba(var(--t2),.28)}
.ev .dt{font:800 18px var(--font-display); color:var(--cyan)}
.ev .ls{font:800 20px var(--font-display)}
.ev .ch{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
@media (max-width:900px){.page{padding:18px 16px 40px}.h1{font-size:34px}.tiles{grid-template-columns:repeat(2,1fr)}.hd2{grid-template-columns:1fr}.ev{grid-template-columns:1fr}.ttab{grid-template-columns:70px repeat(7,minmax(0,1fr))}.drawer.open{width:min(440px,92vw)}.lv .mid{flex-direction:column}.drawer{width:100%!important;height:0}.drawer.open{height:48vh}.dr-in{width:100%}}
@media (prefers-reduced-motion:reduce){.drawer,.unit .cv{transition:none}.cnt.pop{animation:none}}
</style>
