<title>الدروس التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*CORE_CSS*/
body{overflow:auto; background:var(--c-bg)}
.app{position:static!important; display:block!important; inset:auto!important}
.view{position:fixed; inset:0; overflow:hidden}
.page{position:relative; z-index:2; min-height:100vh; padding:34px 56px 40px; max-width:1500px; margin:0 auto; display:flex; flex-direction:column; gap:26px}
.top2{display:flex; align-items:center; gap:18px}
.top2 .brand{font-size:26px}
.top2 .sp{flex:1}
.hero h1{margin:0; font-family:var(--font-display); font-weight:800; font-size:56px; line-height:1.1; color:#fff; text-shadow:0 2px 14px rgba(var(--d1),.7),0 0 26px rgba(var(--t1),.3)}
.hero h1 b{color:var(--gold)}
.hero p{margin:8px 0 0; font-size:26px; font-weight:600; color:var(--muted)}
.hrule{height:2px; background:linear-gradient(to left,var(--cyan),rgba(var(--t1),.35) 45%,transparent); box-shadow:0 0 12px rgba(var(--t1),.5); margin-top:16px}
.grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:20px}
.card{position:relative; display:flex; flex-direction:column; gap:10px; padding:22px 26px 20px; border-radius:20px; text-decoration:none; color:var(--ink);
  background:linear-gradient(145deg,rgba(var(--p1),.82),rgba(var(--p2),.76)); border:1.5px solid rgba(var(--t2),.48);
  box-shadow:0 14px 38px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14),0 0 26px rgba(var(--t1),.10);
  transition:transform 260ms var(--ease-out),box-shadow 260ms var(--ease-out),border-color 260ms var(--ease-out)}
.card:hover,.card:focus-visible{transform:translateY(-5px); border-color:rgba(var(--t1),.9); box-shadow:0 20px 46px rgba(0,0,0,.5),0 0 36px rgba(var(--t1),.28)}
.card .no{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--cyan); letter-spacing:.02em; display:flex; align-items:center; gap:10px}
.card .no i{font-style:normal; background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border-radius:10px; padding:2px 12px; font-size:30px}
.card h2{margin:0; font-family:var(--font-display); font-weight:800; font-size:34px; line-height:1.2}
.card p{margin:0; font-size:21px; line-height:1.5; color:var(--muted); min-height:64px}
.card .chips{display:flex; flex-wrap:wrap; gap:8px}
.card .chips span{background:rgba(var(--d2),.7); border:1px solid rgba(var(--t2),.3); border-radius:999px; padding:3px 12px; font-size:17px; font-weight:700}
.card .go{margin-top:4px; align-self:flex-start; background:linear-gradient(145deg,#F3D27A,#D9A92B); color:#171100; border-radius:14px; padding:8px 22px; font-weight:800; font-size:21px; font-family:var(--font-display)}
.card.soon{opacity:.62; cursor:default; pointer-events:none}
.card.soon .go{background:rgba(var(--t1),.18); color:var(--ink); border:1px dashed rgba(var(--t2),.5)}
.tips{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; padding:14px 22px; border-radius:16px; background:rgba(var(--d2),.62); border:1px solid rgba(var(--t2),.3); font-size:19px; font-weight:600; color:var(--muted)}
.tips b{color:var(--ink)} .tips kbd{font-family:var(--font-display); font-weight:800; background:rgba(var(--t1),.2); border:1px solid rgba(var(--t2),.45); border-radius:8px; padding:1px 10px; color:var(--ink)}
@media (max-width:760px){.page{padding:22px 18px 30px}.hero h1{font-size:38px}.hero p{font-size:20px}.grid2{grid-template-columns:1fr}}
/*THEME4_CSS*/
/*THEME5_CSS*/
/*STICKERS_CSS*/
.hero{position:relative}
.card .stk{z-index:3}
.fchip{position:absolute; top:10px; font-family:var(--font-display); font-weight:800; font-size:17px; color:rgb(var(--t1)); background:rgba(var(--d2),.72); border:1px solid rgba(var(--t2),.4); border-radius:999px; padding:1px 10px; opacity:0; pointer-events:none; animation:chipRise 6.6s ease-in infinite; animation-delay:var(--d,0s)}
@keyframes chipRise{0%{opacity:0; transform:translateY(26px) scale(.7)} 15%{opacity:1} 70%{opacity:.9} 100%{opacity:0; transform:translateY(-26px) scale(1)}}
html[data-fx="0"] .fchip{display:none}
@media (max-width:900px){.hero .stk,.fchip{display:none}}
</style>
<script>
document.documentElement.lang="ar";document.documentElement.dir="rtl";
(function(){
'use strict';
/*BG_JS*/
var LESSONS=[
 {no:'٣-١',t:'الكتل النسبية',d:'الكتلة الذرية النسبية Ar وكتلة الصيغة النسبية Mr، وكتابة الصيغة من نموذج أو مخطط.',chips:['٢٩ شريحة','مختبر افتراضي','تذاكر خروج','أسئلة امتحانات'],pal:'navy',bg:'doodles',href:'lesson31.html',stk:'s_fe'},
 {no:'٣-٢',t:'المول',d:'عدد أفوجادرو والكتلة المولية وحسابات المول: n = m ÷ M وعدد الجسيمات.',chips:['٢٨ شريحة','جداول تفاعلية','سباق الفصل','أسئلة امتحانات'],pal:'violet',bg:'bubbles',href:'lesson32.html',stk:'m_mole'},
 {no:'٣-٣',t:'حسابات تتضمن كتلاً متفاعلة',d:'استنباط الصيغة الكيميائية من الكتل، والمادة المحددة والفائضة، وكتلة الناتج من المعادلة.',chips:['٣٤ شريحة','مختبر افتراضي','أشكال جسيمات','أسئلة امتحانات'],pal:'emerald',bg:'hexes',href:'lesson33.html',stk:'m_tube'},
 {no:'٣-٤',t:'حسابات تتضمن حجوم الغازات',d:'قانون أفوجادرو والحجم المولي 24 L، وتفاعلات الغازات، وكتلة الغاز من المعادلة، ونشاط ٣-٣.',chips:['٣١ شريحة','مختبر افتراضي','خريطة الحل','أسئلة امتحانات'],pal:'ember',bg:'waves',href:'lesson34.html',stk:'n_potion'},
 {no:'٣-٥',t:'حسابات تتضمن محاليل متفاعلة',d:'تركيز الكتلة والتركيز المولي، والمعايرة بمختبر افتراضي، وحساباتها، والخريطة الكبرى للوحدة.',chips:['٣٦ شريحة','مختبر معايرة','الخريطة الكبرى','أسئلة امتحانات'],pal:'gold',bg:'organic',href:'lesson35.html',stk:'glass'}
];
var EFF=['flyR','zoom','float','wipeB','growTurn','flyL'];
function boot(){
  var h=document.body;
  h.insertAdjacentHTML('afterbegin','<div class="app" data-pal="emerald" style="position:static"><main class="view" id="view"></main>'+
   '<div class="page"><div class="top2"><div class="brand"><i><small>6</small>C</i><span>كيمياء</span></div><div class="sp"></div>'+STK.btn()+'<button class="tbtn" id="bFx" type="button" aria-label="الخلفية"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg><span>كاملة</span></button></div>'+
   '<header class="hero"><h1>كيمياء الصف العاشر: <b>الكيمياء الكمّية</b></h1><p>الوحدة الثالثة · دروس تفاعلية للسبورة والحاسوب</p><div class="hrule"></div>'+STK.html('m_flask',{css:'left:0;top:12px;',w:112,r:-4,d:.5,free:1})+STK.html('kids_duo',{css:'left:120px;top:-26px;',w:136,r:-3,d:.7,free:1})+STK.html('flat_atom',{css:'left:264px;top:6px;',w:92,r:6,d:.9,free:1})+'<span class="fchip" style="left:22px;--d:0s">H₂O</span><span class="fchip" style="left:64px;--d:2.2s">CO₂</span><span class="fchip" style="left:6px;--d:4.4s">O₂</span>'+'</header>'+
   '<section class="grid2" id="grid"></section>'+
   '<div class="tips"><b>داخل الدرس:</b> <span><kbd>←</kbd> التالي</span> <span><kbd>→</kbd> السابق</span> <span><kbd>N</kbd> ملاحظات المعلم</span> <span><kbd>G</kbd> فهرس الدرس</span> <span><kbd>F</kbd> ملء الشاشة</span> <span>زر الخلفية: كاملة / هادئة / ثابتة</span></div></div></div>');
  var app=document.querySelector('.app'), view=document.getElementById('view'), grid=document.getElementById('grid');
  LESSONS.forEach(function(L,i){
    var a=document.createElement(L.soon?'div':'a'); a.className='card fx e-'+EFF[i%EFF.length]+(L.soon?' soon':''); a.setAttribute('data-pal',L.pal); if(!L.soon) a.href=L.href;
    a.style.setProperty('--fdl',(260+i*110)+'ms');
    var cs=STK.html(L.stk,{css:'left:-16px;top:-34px;',w:96,r:-8,d:.9+i*.12,free:1});
    a.innerHTML='<div class="no">الدرس <i>'+L.no+'</i></div><h2>'+L.t+'</h2><p>'+L.d+'</p><div class="chips">'+L.chips.map(function(c){return '<span>'+c+'</span>'}).join('')+'</div><span class="go">'+(L.soon?'قريباً':'افتح الدرس ←')+'</span>'+cs;
    a.addEventListener('animationend',function(){a.classList.remove('fx','e-'+EFF[i%EFF.length])});
    function pick(){app.setAttribute('data-pal',L.pal); BG.go(L.bg,L.pal,1)}
    a.addEventListener('mouseenter',pick); a.addEventListener('focus',pick);
    grid.appendChild(a);
  });
  BG.mount(view); BG.go('doodles','emerald',1);
  STK.mount(null);
  document.getElementById('bFx').addEventListener('click',function(){BG.cycle()});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
